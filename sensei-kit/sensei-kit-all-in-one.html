  // いま開いている画面を描き終えるまで待つ（デモの手順から使う）

  function buildShell() {

        h('span', { class: 'kokuban-name' }, '先生の道具箱'), h('span', { class: 'kokuban-sub' }, '学級・授業・予定'),
        h('span', { class: 'kokuban-tray', 'aria-hidden': 'true' }, h('i', { class: 'c1' }), h('i', { class: 'c2' }), h('i', { class: 'c3' }))),
      nav,
      h('div', { class: 'mb-side-foot' }, h('span', { class: 'mb-save-state', 'data-mode': 'local' }, '読み込み中…'), themeBtn(), h('span', { class: 'mb-save-where' })));
    const scrim = h('div', { class: 'mb-scrim', hidden: true, onclick: () => drawer(false) });
    const view = h('div', { class: 'mb-view', id: 'mb-view' });

  }
  // 表示の明るさを押すたびに 自動 → 明るい → 暗い と切りかえる
  function themeBtn() {
    const b = h('button', { type: 'button', class: 'mb-theme' });
    const draw = () => {
      const t = THEMES.find((x) => x.v === Kit.theme.get()) || THEMES[0];
      Kit.clear(b).append(Kit.icon(t.icon), t.label.replace('表示：', ''));
      b.title = t.label + '（押すと切りかわります。教室で映すときは「明るい」が見やすいです）';
      b.setAttribute('aria-label', t.label + '。押すと切りかわります');
    };
    b.addEventListener('click', () => { const i = THEMES.findIndex((x) => x.v === Kit.theme.get()); Kit.theme.set(THEMES[(i + 1) % THEMES.length].v); draw(); });

  }
  function renderNav() {
    Kit.clear(shell.nav);
    const list = Kit.apps();
    for (const g of Kit.GROUPS) {
      const items = list.filter((a) => (a.group || 'home') === g.id);
      if (!items.length) continue;
      shell.nav.append(h('div', { class: 'mb-nav-group' },
        g.label ? h('div', { class: 'mb-nav-label' }, g.label) : null,
        items.map((a) => h('a', { class: 'mb-nav-item', href: '#' + a.id, 'data-app': a.id, onclick: (e) => { e.preventDefault(); Kit.go(a.id); } }, Kit.icon(a.icon || 'info'), h('span', null, a.title)))));
    }
  }
  function drawer(open) {
    shell.mb.classList.toggle('is-drawer', open);
    shell.scrim.hidden = !open;
    if (open) { const f = shell.nav.querySelector('[aria-current="page"]') || shell.nav.querySelector('a'); if (f) f.focus(); }
  }
  function saveState(s) {
    if (!shell) return;
    const el = shell.side.querySelector('.mb-save-state');
    el.dataset.mode = store.demo ? 'demo' : store.mode === 'db' ? 'db' : 'local';
    el.textContent = store.demo ? 'デモ中（保存しません）' : s === 'saving' ? '保存中…' : s === 'error' ? '保存できませんでした' : store.mode === 'db' ? 'アカウントに保存済み' : store.mode === 'memory' ? '保存できない環境です' : 'このブラウザに保存';
  }
  function saveWhere() {
    const el = shell.side.querySelector('.mb-save-where');
    el.textContent = store.mode === 'db' ? 'ほかの端末で開いても同じ内容です。'
      : env.artifact ? '共有で開いているため、このブラウザだけに保存されます。'
        : store.mode === 'memory' ? 'ページを閉じると消えます。バックアップを書き出してください。'
          : 'ときどきホームからバックアップを。';
  }

  function mount(id) { mounting = mountNow(id); return mounting; }
  async function mountNow(id) {
    const def = appMap.get(id) || appMap.get('home') || apps[0];
    if (!def) return;
    const seq = ++mountSeq;
    if (current && current.cleanup) { try { current.cleanup(); } catch (e) { console.error(e); } }
    current = { id: def.id, cleanup: null };
    const view = shell.view;
    Kit.clear(view);
    view.classList.toggle('is-wide', !!def.wide);
    for (const a of shell.nav.querySelectorAll('.mb-nav-item')) { if (a.dataset.app === def.id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }
    shell.top.querySelector('.mb-top-app').textContent = def.title;
    drawer(false);
    const root = h('div', { class: 'app app-' + def.id });
    view.append(root);
    const p = params; params = {};
    try {
      const c = await def.mount(root, p || {});
      if (seq !== mountSeq) { if (typeof c === 'function') c(); return; }
      current.cleanup = typeof c === 'function' ? c : null;
    } catch (e) {
      console.error(e);
      if (seq === mountSeq) root.append(h('div', { class: 'empty' }, h('div', { class: 'empty-title' }, 'この画面を開けませんでした'), h('p', { class: 'small mono' }, String((e && e.message) || e))));
    }
    if (seq === mountSeq) window.scrollTo(0, 0);
  }
  Kit.current = () => (current ? current.id : null);
  // ハッシュを先に受け取る係：fn(ハッシュ) → 開く画面の id（自分の担当でなければ null）
  Kit.hashHandlers = [];
  Kit.remount = () => (current ? mount(current.id) : Promise.resolve());

  Kit.start = async () => {
    buildShell();
    shell.view.append(h('p', { class: 'muted', style: { padding: '40px 0' } }, '道具箱をひらいています…'));
    ai.ready();
    await store.init();
    saveState('saved');
    saveWhere();
    // 共有リンク（#share=…）のように、画面の名前ではないハッシュは、受け取る係（Kit.hashHandlers）に先に渡す
    const route = () => {
      const raw = location.hash.slice(1);
      for (const fn of Kit.hashHandlers) {
        let to = null;
        try { to = fn(raw); } catch (e) { console.error(e); }
        if (to) { try { history.replaceState(null, '', '#' + to); } catch (e) { /* noop */ } mount(to); return; }
      }
      mount(raw || 'home');
    };
    window.addEventListener('hashchange', route);
    route();
    const flush = () => { store.flush(); };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  };
})();

/* 先生の道具箱 — 学校向けの共通部品（kit.js のあと、アプリより先に読む）
   ・祝日       School.holiday('2026-05-06') → '振替休日'。法律の決まりから計算する（2000〜2099年）
   ・くじ       School.rng(種) … 同じ種なら同じ並び（テストと「やり直し」に使う）
   ・名簿       School.classes … クラスの一覧・いま選んでいるクラス・名前を隠す・クラスの切り替え帯
   ・共有       School.share … 予定などを、リンク（#share=…）かファイルにして渡す。生徒の名前は入れない
   ・印刷       School.print … 印刷用の中身だけを、用紙の向きを決めて印刷する
   ・表計算     School.tsv … Excel にそのまま貼れる文字（タブ区切り）
   どれも、ほかのアプリやテスト（tools/test.cjs）から使えるよう window.School に置く。 */
(function () {
  'use strict';
  const { h } = Kit;
  const School = (window.School = {});
  const pad = (n) => String(n).padStart(2, '0');
  const ymdOf = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);

  /* ───────── 祝日（国民の祝日に関する法律の決まりから計算） ───────── */
  // 第n月曜日
  const nthMonday = (y, m, n) => { const first = new Date(y, m - 1, 1).getDay(); return 1 + ((8 - first) % 7) + (n - 1) * 7; };
  const shunbun = (y) => Math.floor(20.8431 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  const shubun = (y) => Math.floor(23.2488 + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  const holidayCache = new Map();
  function holidaysOf(y) {
    if (holidayCache.has(y)) return holidayCache.get(y);
    const out = {};
    if (y < 2000 || y > 2099) { holidayCache.set(y, out); return out; }
    const put = (m, d, name) => { out[ymdOf(y, m, d)] = name; };
    put(1, 1, '元日');
    put(1, nthMonday(y, 1, 2), '成人の日');
    put(2, 11, '建国記念の日');
    if (y >= 2020) put(2, 23, '天皇誕生日');
    put(3, shunbun(y), '春分の日');
    put(4, 29, y >= 2007 ? '昭和の日' : 'みどりの日');
    put(5, 3, '憲法記念日');
    if (y >= 2007) put(5, 4, 'みどりの日');
    put(5, 5, 'こどもの日');
    if (y === 2020) put(7, 23, '海の日'); else if (y === 2021) put(7, 22, '海の日'); else if (y >= 2003) put(7, nthMonday(y, 7, 3), '海の日'); else put(7, 20, '海の日');
    if (y === 2020) put(8, 10, '山の日'); else if (y === 2021) put(8, 8, '山の日'); else if (y >= 2016) put(8, 11, '山の日');
    put(9, y >= 2003 ? nthMonday(y, 9, 3) : 15, '敬老の日');
    put(9, shubun(y), '秋分の日');
    if (y === 2020) put(7, 24, 'スポーツの日'); else if (y === 2021) put(7, 23, 'スポーツの日'); else put(10, nthMonday(y, 10, 2), y >= 2020 ? 'スポーツの日' : '体育の日');
    put(11, 3, '文化の日');
    put(11, 23, '勤労感謝の日');
    if (y <= 2018) put(12, 23, '天皇誕生日');
    if (y === 2019) { put(4, 30, '国民の休日'); put(5, 1, '即位の日'); put(5, 2, '国民の休日'); put(10, 22, '即位礼正殿の儀'); }
    // 国民の休日：祝日にはさまれた平日
    const keys = Object.keys(out).sort();
    for (const k of keys) {
      const d = Kit.parseYmd(k);
      const next2 = Kit.ymd(Kit.addDays(d, 2)), next1 = Kit.ymd(Kit.addDays(d, 1));
      if (out[next2] && !out[next1] && Kit.parseYmd(next1).getDay() !== 0) out[next1] = '国民の休日';
    }
    // 振替休日：日曜の祝日のあと、最初の祝日でない日
    for (const k of Object.keys(out).sort()) {
      if (Kit.parseYmd(k).getDay() !== 0 || out[k] === '振替休日') continue;
      let d = Kit.addDays(k, 1);
      while (out[Kit.ymd(d)]) d = Kit.addDays(d, 1);
      if (d.getFullYear() === y) out[Kit.ymd(d)] = '振替休日';
    }
    holidayCache.set(y, out);
    return out;
  }
  School.holidaysOf = holidaysOf;
  School.holiday = (s) => { const k = String(s || ''); if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return ''; return holidaysOf(+k.slice(0, 4))[k] || ''; };
  // 土日・祝日か
  School.isOff = (s) => { const d = Kit.parseYmd(s).getDay(); return d === 0 || d === 6 || !!School.holiday(s); };

  /* ───────── くじ（種つきの乱数） ───────── */
  // mulberry32：同じ種なら同じ数の並び。種がなければ毎回ちがう
  School.rng = (seed) => {
    let a = (seed == null ? (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) : seed) >>> 0;
    const next = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    next.int = (n) => Math.floor(next() * n);
    next.pick = (arr) => arr[Math.floor(next() * arr.length)];
    next.shuffle = (arr) => { const a2 = arr.slice(); for (let i = a2.length - 1; i > 0; i--) { const j = Math.floor(next() * (i + 1)); [a2[i], a2[j]] = [a2[j], a2[i]]; } return a2; };
    return next;
  };
  School.newSeed = () => (Date.now() ^ Math.floor(Math.random() * 0xffffffff)) >>> 0;

  /* ───────── 表計算に貼る文字・名簿の読み取り ───────── */
  School.tsv = (rows) => rows.map((r) => r.map((c) => String(c == null ? '' : c).replace(/[\t\r\n]+/g, ' ')).join('\t')).join('\n');

  const GENDER = { 男: 'm', 男子: 'm', m: 'm', M: 'm', male: 'm', 女: 'f', 女子: 'f', f: 'f', F: 'f', female: 'f' };
  const HEAD = {
    no: /^(番号|出席番号|出席|No\.?|NO\.?|no\.?|#|番)$/, name: /^(氏名|名前|生徒名|生徒氏名|なまえ|name)$/i, sei: /^(姓|苗字|名字)$/, mei: /^(名)$/,
    kana: /^(ふりがな|フリガナ|よみ|読み|よみがな|かな|カナ)$/, gender: /^(性別|男女)$/, front: /^(配慮|前の席|視力|前方)$/,
  };
  const isKana = (c) => /^[ぁ-ゖァ-ヺー・ 　]+$/.test(c);
  const isNum = (c) => /^\d{1,3}$/.test(String(c).normalize('NFKC'));
  const isClassCell = (c) => /^(\d+年)?\d+組$|^\d+-\d+$|^[A-ZＡ-Ｚ]組$/.test(String(c).normalize('NFKC'));
  const YES = /^(○|◯|〇|1|はい|あり|前|要|yes|true)$/i;
  // Excel・名簿から貼り付けた文字を読む。1行1人。
  // 「氏名」「番号 氏名」「組 番号 氏名」「番号 姓 名」「番号 氏名 ふりがな 性別」など。見出しの行があれば、それに合わせる
  School.parseRoster = (text) => {
    const lines = String(text || '').replace(/^﻿/, '').split(/\r?\n/).map((l) => l.replace(/　/g, ' ').trim()).filter(Boolean);
    const sep = lines.some((l) => l.includes('\t')) ? '\t' : lines.some((l) => l.includes(',')) ? ',' : ' ';
    let rows = lines.map((l) => (sep === ' ' ? l.split(/ +/) : l.split(sep)).map((c) => c.trim()));
    let cols = null;
    if (rows.length) {
      const map = {};
      rows[0].forEach((c, i) => { for (const k in HEAD) if (HEAD[k].test(c) && map[k] == null) map[k] = i; });
      if (map.name != null || map.sei != null || map.no != null) { cols = map; rows = rows.slice(1); }
    }
    const out = [];
    for (const r of rows) {
      let no = null, name = '', kana = '', gender = '', front = false;
      if (cols) {
        const at = (k) => (cols[k] != null ? String(r[cols[k]] || '').trim() : '');
        if (cols.no != null) no = parseInt(at('no').normalize('NFKC'), 10);
        name = cols.name != null ? at('name') : [at('sei'), at('mei')].filter(Boolean).join(' ');
        kana = at('kana');
        gender = GENDER[at('gender')] || '';
        front = YES.test(at('front'));
      } else {
        const text = [];
        for (const c of r) {
          if (!c) continue;
          if (isNum(c)) no = +String(c).normalize('NFKC'); // 2つあれば（組 番号）あとのほう
          else if (GENDER[c]) gender = GENDER[c];
          else if (isClassCell(c)) continue;
          else text.push(c);
        }
        if (sep === ' ' || text.length <= 1) name = text.join(' ');
        else if (/\s/.test(text[0])) { name = text[0]; if (isKana(text[1])) kana = text[1]; }
        else if (isKana(text[1]) && (/\s/.test(text[1]) || text[1].length >= 5)) { name = text[0]; kana = text[1]; }
        else { name = text[0] + ' ' + text[1]; if (text[2] && isKana(text[2])) kana = text[2]; }
      }
      name = name.replace(/\s+/g, ' ').trim();
      if (!name && !(no > 0)) continue;
      out.push({ no: Number.isFinite(no) && no > 0 ? no : null, name, kana, gender, front });
    }
    // 番号がない行は、前の人の次の番号に
    let last = 0;
    for (const s of out) { if (s.no == null) s.no = last + 1; last = s.no; }
    return out;
  };

  /* ───────── 名簿（クラス） ───────── */
  // 架空のクラス（サンプル）。id を決めておくと、ほかのアプリのサンプルから名前で指せる
  const SAMPLE_NAMES = [
    ['相川 そら', 'm'], ['井上 ゆい', 'f'], ['上田 はると', 'm'], ['遠藤 さくら', 'f'], ['大野 りく', 'm'], ['加藤 ひなた', 'f'],
    ['木村 そうた', 'm'], ['久保 あおい', 'f'], ['小林 ゆうと', 'm'], ['斉藤 めい', 'f'], ['佐野 けんと', 'm'], ['島田 りん', 'f'],
    ['杉本 たくみ', 'm'], ['関 ここな', 'f'], ['田中 こうき', 'm'], ['千葉 みお', 'f'], ['土屋 はやと', 'm'], ['中島 あかり', 'f'],
    ['西村 しょう', 'm'], ['野口 ゆな', 'f'], ['橋本 だいち', 'm'], ['林 こはる', 'f'], ['平野 れん', 'm'], ['藤田 ほのか', 'f'],
    ['星野 いぶき', 'm'], ['前田 ちさと', 'f'], ['松本 かいと', 'm'], ['宮崎 みゆ', 'f'], ['村上 ゆうせい', 'm'], ['森 さな', 'f'],
    ['山口 りょう', 'm'], ['吉田 ひより', 'f'],
  ];
  const SAMPLE_CLASS = {
    id: 's-class-1', name: '2年3組', note: '架空のクラスです',
    students: SAMPLE_NAMES.map(([name, gender], i) => ({ id: 's-st-' + (i + 1), no: i + 1, name, kana: '', gender, front: i === 4 || i === 13 || i === 21, note: i === 4 ? '視力（前の席）' : '' })),
  };
  School.SAMPLE_CLASS = SAMPLE_CLASS;
  School.sampleStudent = (no) => 's-st-' + no;
  Kit.store.sample('classes', [SAMPLE_CLASS]);

  const byNo = (a, b) => (a.no || 0) - (b.no || 0) || String(a.name || '').localeCompare(String(b.name || ''), 'ja');
  School.classes = {
    async list() {
      const all = await Kit.store.list('classes', { sample: [SAMPLE_CLASS] });
      for (const c of all) c.students = (Array.isArray(c.students) ? c.students : []).slice().sort(byNo);
      return all.sort((a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'ja', { numeric: true }));
    },
    // いま選んでいるクラス（なければ最初のクラス。1つもなければ null）
    async current() {
      const all = await School.classes.list();
      const id = Kit.pref.get('class', null);
      return all.find((c) => c.id === id) || all[0] || null;
    },
    setCurrent(id) { Kit.pref.set('class', id); emitClass(); },
    async get(id) { const all = await School.classes.list(); return all.find((c) => c.id === id) || null; },
    async save(c) { const it = Kit.clone(c); delete it.sample; it.students = (it.students || []).slice().sort(byNo); return Kit.store.put('classes', it); },
    // クラスを消す。席・係・宿題など、そのクラスの記録も一緒に消す（各アプリが onRemove で登録）
    async remove(id) {
      for (const fn of removeHooks) { try { await fn(id); } catch (e) { console.error(e); } }
      await Kit.store.remove('classes', id);
      if (Kit.pref.get('class', null) === id) Kit.pref.set('class', null);
      emitClass();
    },
    onRemove(fn) { removeHooks.push(fn); },
  };
  const removeHooks = [];
  // そのクラスの記録をまとめて消す小物（アプリの onRemove 用）
  School.removeByClass = (coll) => async (classId) => { for (const it of await Kit.store.list(coll)) if (it.classId === classId) await Kit.store.remove(coll, it.id); };
  // クラスの切り替えを、開いている画面に知らせる
  const classListeners = new Set();
  function emitClass() { for (const fn of [...classListeners]) { try { fn(); } catch (e) { console.error(e); } } }
  School.onClassChange = (fn) => { classListeners.add(fn); return () => classListeners.delete(fn); };

  // 名前を隠す（教室で画面を映すとき）。番号だけを出す
  School.hidden = () => !!Kit.pref.get('hideNames', false);
  School.setHidden = (v) => { Kit.pref.set('hideNames', !!v); emitClass(); };
  // 生徒の呼び方：'3 青木 そら' / 名前を隠すときは '3番'
  School.label = (st, o = {}) => {
    if (!st) return '';
    const hide = o.hide == null ? School.hidden() : o.hide;
    if (hide || !st.name) return st.no + '番';
    if (o.short) return st.name.split(' ')[0] || st.name;
    return o.noNumber ? st.name : st.no + ' ' + st.name;
  };

  // アプリの上に出す「クラスの切り替え帯」。onChange(クラス) を呼ぶ。返り値は帯の要素
  School.classBar = async ({ onChange, extra } = {}) => {
    const all = await School.classes.list();
    const cur = await School.classes.current();
    const bar = h('div', { class: 'sk-classbar', role: 'group', 'aria-label': 'クラス' });
    if (!cur) {
      bar.append(h('span', { class: 'small' }, 'まだクラスがありません。'), Kit.btn('名簿をつくる', () => Kit.go('roster'), { sm: true, kind: 'primary', icon: 'users' }));
      return bar;
    }
    const sel = h('select', { id: 'sk-class-select', 'aria-label': 'クラスを選ぶ' }, all.map((c) => h('option', { value: c.id }, c.name || '（名前なし）')));
    sel.value = cur.id;
    sel.addEventListener('change', async () => { School.classes.setCurrent(sel.value); if (onChange) onChange(await School.classes.current()); });
    const hide = h('input', { type: 'checkbox', id: 'sk-hide-names', checked: School.hidden(), onchange: () => School.setHidden(hide.checked) });
    Kit.add(bar, [
      h('label', { for: 'sk-class-select', class: 'sk-classbar-l' }, 'クラス'), sel,
      h('span', { class: 'small muted num sk-classbar-n' }, cur.students.length + '人'),
      cur.sample ? h('span', { class: 'chip sample' }, '架空') : null,
      h('span', { class: 'grow' }),
      h('label', { class: 'check small', for: 'sk-hide-names', title: '教室で画面を映すときに' }, hide, '名前を隠す'),
      Kit.btn('名簿', () => Kit.go('roster'), { sm: true, kind: 'ghost', icon: 'users', class: 'sk-classbar-roster' }),
      extra || null]);
    return bar;
  };

  /* ───────── 共有（リンク・ファイル） ─────────
     中身は JSON → deflate-raw で縮める → base64url。先頭の1文字で形式（z=縮めた / j=そのまま）。
     リンクの # より後ろはサーバーに送られないので、共有の中身がサーバーの記録に残らない。 */
  const b64url = (bytes) => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
  const unb64url = (str) => { const s = String(str).replace(/-/g, '+').replace(/_/g, '/'); const bin = atob(s + '==='.slice((s.length + 3) % 4)); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; };
  async function pipe(bytes, stream) { return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
  // 縮めたものを戻す。大きすぎるもの（わざと作った圧縮爆弾など）は途中でやめる
  async function inflate(bytes, limit) {
    const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
    const parts = []; let n = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      n += value.length;
      if (n > limit) { try { await reader.cancel(); } catch (e) { /* noop */ } throw new Error('共有の中身が大きすぎます'); }
      parts.push(value);
    }
    const out = new Uint8Array(n); let o = 0;
    for (const p of parts) { out.set(p, o); o += p.length; }
    return out;
  }
  const SHARE_LIMIT = 2 * 1024 * 1024;
  School.share = {
    KINDS: { events: '予定', reminders: 'リマインダー', timetable: '時間割' },
    async encode(obj) {
      const bytes = new TextEncoder().encode(JSON.stringify(obj));
      if (typeof CompressionStream === 'function') {
        try { return 'z' + b64url(await pipe(bytes, new CompressionStream('deflate-raw'))); } catch (e) { /* 縮められなければそのまま */ }
      }
      return 'j' + b64url(bytes);
    },
    async decode(str) {
      const s = String(str || '').trim();
      const kind = s[0], bytes = unb64url(s.slice(1));
      let raw = bytes;
      if (kind === 'z') {
        if (typeof DecompressionStream !== 'function') throw new Error('このブラウザでは共有リンクを開けません。新しいブラウザで開いてください');
        raw = await inflate(bytes, SHARE_LIMIT);
      } else if (kind !== 'j') throw new Error('共有リンクの形が正しくありません');
      else if (raw.length > SHARE_LIMIT) throw new Error('共有の中身が大きすぎます');
      const obj = JSON.parse(new TextDecoder().decode(raw));
      if (!obj || obj.app !== 'sensei-kit' || !School.share.KINDS[obj.kind] || !Array.isArray(obj.items)) throw new Error('先生の道具箱の共有ではありません');
      return obj;
    },
    // 共有の中身を作る（生徒の名前・メモの持ち出しを防ぐため、決めた項目だけを入れる）
    pack(kind, items, o = {}) {
      return { app: 'sensei-kit', v: 1, kind, title: String(o.title || '').slice(0, 80), from: String(o.from || '').slice(0, 40), at: new Date().toISOString(), items };
    },
    // リンクにできる場所か（file:// や Artifact の中では、相手が開けるリンクにならない）
    canLink() { return /^https?:$/.test(location.protocol) && !Kit.env.artifact; },
    baseUrl() { return location.href.split('#')[0]; },
    async link(pack) { return School.share.baseUrl() + '#share=' + (await School.share.encode(pack)); },
    // 共有ダイアログ：リンク（とQR）・ファイル・コピー
    async open(pack, o = {}) {
      const n = pack.items.length;
      const body = h('div', { class: 'stack' });
      const what = h('p', null, (o.what || School.share.KINDS[pack.kind]) + ' ' + n + '件を共有します。', h('br'), h('span', { class: 'small muted' }, o.note || '受け取った人は、中身を確かめてから自分の道具箱に取り込めます。生徒の名前は入りません。'));
      body.append(what);
      if (School.share.canLink()) {
        const url = await School.share.link(pack);
        const inp = h('input', { type: 'text', readonly: true, value: url, id: 'sk-share-url', 'aria-label': '共有リンク' });
        inp.addEventListener('focus', () => inp.select());
        body.append(Kit.field({ label: '共有リンク', input: inp, hint: url.length > 1800 ? 'リンクが長いので、メールやチャットで送るのがおすすめです（QRコードにはできません）。' : 'メール・チャット・Classroom などに貼って送れます。' }));
        const row = h('div', { class: 'btn-row' }, Kit.btn('リンクをコピー', () => Kit.copy(url, '共有リンクをコピーしました'), { kind: 'primary', icon: 'copy' }));
        if (navigator.share) row.append(Kit.btn('ほかのアプリで送る', () => navigator.share({ title: pack.title || '先生の道具箱', url }).catch(() => {}), { icon: 'share' }));
        body.append(row);
        if (url.length <= 1100 && window.qrcode) {
          try { const c = Kit.qr(url, { cell: 4, level: 'L' }); c.classList.add('sk-share-qr'); c.setAttribute('role', 'img'); c.setAttribute('aria-label', '共有リンクのQRコード'); body.append(h('div', { class: 'sk-share-qrbox' }, c, h('span', { class: 'small muted' }, 'となりの先生のスマホで読み取れます。'))); }
          catch (e) { /* QR にできない長さ */ }
        }
      } else {
        body.append(h('p', { class: 'sk-note' }, Kit.env.artifact ? 'この画面からは、相手が開けるリンクを作れません。下のファイルで渡してください。' : 'このファイルをパソコンで直接開いているので、リンクは作れません。下のファイルで渡してください（Web に置いたページで開くと、リンクも作れます）。'));
      }
      const file = async () => {
        const name = 'sensei-share-' + pack.kind + '-' + Kit.ymd() + '.json';
        if (await Kit.download(name, JSON.stringify(pack, null, 1))) Kit.toast('共有用のファイルを書き出しました');
      };
      body.append(h('hr', { class: 'divider' }), h('div', { class: 'btn-row' }, Kit.btn('共有用のファイル（.json）', file, { icon: 'download' }), h('span', { class: 'small muted' }, '相手は ホーム →「共有を受け取る」で開けます。')));
      if (o.extra) body.append(o.extra);
      Kit.modal({ title: o.title || '共有する', body, wide: false, actions: [{ label: '閉じる', kind: 'ghost' }] });
    },
  };

  // 受け取る係：#share=… で開かれたら、その種類の画面を開いてから、取り込みの確認を出す
  const receivers = new Map(); // kind → async (pack) => void
  School.share.receive = (kind, fn) => receivers.set(kind, fn);
  const pending = { pack: null, error: null };
  School.share.take = async (pack) => {
    const fn = receivers.get(pack.kind);
    if (!fn) { Kit.toast('この種類の共有は、まだ受け取れません', { type: 'bad' }); return; }
    await fn(pack);
  };
  const ROUTE = { events: 'calendar', reminders: 'reminders', timetable: 'timetable' };
  Kit.hashHandlers.push((raw) => {
    if (!raw.startsWith('share=')) return null;
    const code = raw.slice(6);
    pending.pack = null; pending.error = null;
    School.share.decode(code).then((p) => { pending.pack = p; }).catch((e) => { pending.error = e; }).finally(() => {
      setTimeout(() => {
        if (pending.error) { Kit.toast('共有リンクを開けませんでした：' + ((pending.error && pending.error.message) || pending.error), { type: 'bad', ms: 8000 }); return; }
        if (pending.pack) { if (ROUTE[pending.pack.kind] && Kit.current() !== ROUTE[pending.pack.kind]) Kit.go(ROUTE[pending.pack.kind]); setTimeout(() => School.share.take(pending.pack), 250); }
      }, 300);
    });
    return 'home';
  });
  // ファイルから受け取る（ホームの「共有を受け取る」）
  School.share.fromFile = async () => {
    const f = await Kit.img.pick('application/json,.json');
    if (!f) return;
    if (f.size > SHARE_LIMIT) { Kit.toast('ファイルが大きすぎます（共有ファイルではないかもしれません）', { type: 'bad' }); return; }
    let pack;
    try { pack = JSON.parse(await f.text()); } catch (e) { Kit.toast('ファイルを読めませんでした', { type: 'bad' }); return; }
    if (!pack || pack.app !== 'sensei-kit' || !School.share.KINDS[pack.kind] || !Array.isArray(pack.items)) { Kit.toast('先生の道具箱の共有ファイルではありません', { type: 'bad' }); return; }
    if (ROUTE[pack.kind]) Kit.go(ROUTE[pack.kind]);
    setTimeout(() => School.share.take(pack), 250);
  };

  /* ───────── 印刷 ─────────
     School.print({ landscape, size, margin, build: () => 要素 }) … 道具箱の画面は隠して、渡した中身だけを印刷する。
     size は '257mm 364mm'（B4）のように紙の大きさを決めるとき（決めなければ A4） */
  let printRoot = null, pageStyle = null;
  School.print = ({ landscape = false, build, margin = '12mm', size }) => {
    if (!printRoot) { printRoot = h('div', { id: 'sk-print', 'aria-hidden': 'true' }); document.body.append(printRoot); }
    Kit.clear(printRoot);
    printRoot.append(build());
    if (pageStyle) pageStyle.remove();
    pageStyle = h('style', null, '@page { size: ' + (size || 'A4 ' + (landscape ? 'landscape' : 'portrait')) + '; margin: ' + margin + '; }');
    document.head.append(pageStyle);
    document.documentElement.classList.add('sk-printing');
    const done = () => { document.documentElement.classList.remove('sk-printing'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { try { window.print(); } catch (e) { Kit.toast('この画面では印刷できません。手元のブラウザで開いてください', { type: 'bad' }); done(); } }, 60);
  };

  /* ───────── 共通の見た目 ───────── */
  Kit.css('school', `
.sk-classbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 8px 6px 12px;margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.sk-classbar select{width:auto;min-width:8em;max-width:100%;font-weight:700}
@media (max-width:640px){.sk-classbar{gap:6px}.sk-classbar-l,.sk-classbar-n{display:none}.sk-classbar .sk-classbar-roster span{display:none}.sk-classbar .sk-classbar-roster{padding:0;width:40px}}
.sk-classbar-l{font-weight:700;color:var(--ink-2)}
.sk-note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:8px 10px}
.sk-share-qrbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sk-share-qr{width:148px;height:148px;image-rendering:pixelated;border-radius:6px;border:1px solid var(--line)}
.sk-steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sk-step{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 14px 4px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font:inherit;font-size:14px;cursor:pointer}
.sk-step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.sk-step[aria-current="step"]{border-color:var(--gosu);background:var(--gosu-wash);color:var(--ink);font-weight:700}
.sk-step[aria-current="step"] b{background:var(--gosu);color:var(--on-gosu)}
.sk-step:hover{border-color:var(--gosu)}
#sk-print{display:none}
@media print{
  html.sk-printing body>*:not(#sk-print){display:none!important}
  html.sk-printing #sk-print{display:block!important;color:#000;background:#fff}
  html.sk-printing body{background:#fff}
}
`);
})();

/* ---- js/core/seat-solver.js ---- */
/* 席替えを解く部品（画面とは切りはなした、ただの計算。tools/test.cjs から Node でも動かす）
   SeatSolver.solve({
     rows, cols,            … 縦の数（0 が黒板に近い前の列）、横の数
     blocked: ['r-c'],      … 机のない場所
     pairs: true,           … 2人ずつ机をくっつける（0-1, 2-3, … 列がとなり同士）
     students: [{ id, gender: 'm'|'f'|'', front: true }],
     fixed: { 'r-c': id },  … この席に決めておく人
     apart: [[idA, idB]],   … 近く（前後左右・ななめ）にしない2人
     frontRows: 2,          … 「前の席」の人は、前から何列目までに
     mix: 'none'|'side'|'checker'|'cols',  … 男女の並び（となり同士は男女／市松／縦の列ごと）
     prev: { 'r-c': id },   … 前回の席（同じとなり・同じ席を避ける）
     emptyBack: true,       … 空いた席は後ろに
     seed, restarts, iterations,
   }) → { ok, seats: {'r-c': id}, cost, issues: [{kind, text, ids}], error }
   決まり（固定の席）は必ず守り、それ以外は「重み」の合計が小さくなるよう、入れかえを何千回も試す。 */
(function (root) {
  'use strict';

  const W = { front: 1000, apart: 600, mix: 30, prevSide: 40, prevFB: 10, sameSeat: 12, nearSeat: 2, empty: 1 };
  const key = (r, c) => r + '-' + c;
  const pairKey = (a, b) => (a < b ? a + '|' + b : b + '|' + a);

  function rng(seed) {
    let a = (seed == null ? Math.floor(Math.random() * 0xffffffff) : seed) >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // 席のつながり：となり（2人席なら相方、そうでなければ左右）・前後・まわり8つ
  function geometry(rows, cols, blocked, pairs) {
    const bl = new Set(blocked || []);
    const cells = [], at = {};
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (bl.has(key(r, c))) continue;
      at[key(r, c)] = cells.length;
      cells.push({ r, c, k: key(r, c) });
    }
    const idx = (r, c) => (at[key(r, c)] == null ? -1 : at[key(r, c)]);
    for (const cell of cells) {
      const { r, c } = cell;
      const side = [];
      if (pairs) { const mate = c % 2 === 0 ? c + 1 : c - 1; if (idx(r, mate) >= 0) side.push(idx(r, mate)); }
      else { if (idx(r, c - 1) >= 0) side.push(idx(r, c - 1)); if (idx(r, c + 1) >= 0) side.push(idx(r, c + 1)); }
      const fb = [idx(r - 1, c), idx(r + 1, c)].filter((i) => i >= 0);
      const near = [];
      for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) { if (!dr && !dc) continue; const j = idx(r + dr, c + dc); if (j >= 0) near.push(j); }
      Object.assign(cell, { side, fb, near });
    }
    return { cells, at };
  }

  function solve(o) {
    const rows = Math.max(1, o.rows | 0), cols = Math.max(1, o.cols | 0);
    const { cells, at } = geometry(rows, cols, o.blocked, !!o.pairs);
    const students = (o.students || []).filter((s) => s && s.id);
    const sIndex = new Map(students.map((s, i) => [s.id, i]));
    const n = students.length, m = cells.length;
    if (n > m) return { ok: false, error: '席が足りません（' + n + '人に対して席が' + m + 'こ）。列か行をふやすか、机のない場所を減らしてください。', seats: {}, issues: [] };
    const gender = students.map((s) => (s.gender === 'm' ? 1 : s.gender === 'f' ? 2 : 0));
    const front = students.map((s) => !!s.front);
    const frontRows = Math.max(1, Math.min(rows, o.frontRows == null ? 2 : o.frontRows | 0));
    const mix = ['side', 'checker', 'cols'].includes(o.mix) ? o.mix : 'none';

    // 固定の席（名簿にいる人・机のある席だけ。同じ人が2か所なら最初だけ）
    const fixedCell = new Map(); // cellIndex → studentIndex
    const fixedStudent = new Set();
    for (const [k, id] of Object.entries(o.fixed || {})) {
      const ci = at[k], si = sIndex.get(id);
      if (ci == null || si == null || fixedStudent.has(si) || fixedCell.has(ci)) continue;
      fixedCell.set(ci, si); fixedStudent.add(si);
    }
    // 前回の席・となり
    const prevSeat = new Array(n).fill(-1);
    const prevSide = new Set(), prevFB = new Set();
    if (o.prev) {
      const pAt = {};
      for (const [k, id] of Object.entries(o.prev)) { const si = sIndex.get(id); if (si == null) continue; pAt[k] = si; const ci = at[k]; prevSeat[si] = ci == null ? -2 : ci; }
      const pg = geometry(o.prevRows || rows, o.prevCols || cols, o.prevBlocked || o.blocked, o.prevPairs == null ? !!o.pairs : !!o.prevPairs);
      for (const cell of pg.cells) {
        const a = pAt[cell.k]; if (a == null) continue;
        for (const j of cell.side) { const b = pAt[pg.cells[j].k]; if (b != null) prevSide.add(pairKey(a, b)); }
        for (const j of cell.fb) { const b = pAt[pg.cells[j].k]; if (b != null) prevFB.add(pairKey(a, b)); }
      }
    }
    const apart = [];
    for (const pr of o.apart || []) { const a = sIndex.get(pr && pr[0]), b = sIndex.get(pr && pr[1]); if (a != null && b != null && a !== b) apart.push([a, b]); }
    const emptyBack = o.emptyBack !== false;

    function cost(slot, pos, orient, detail) {
      let total = 0;
      const add = (w, kind, ids) => { total += w; if (detail) detail.push({ kind, ids }); };
      for (let i = 0; i < m; i++) {
        const s = slot[i], cell = cells[i];
        if (s < 0) { if (emptyBack && !detail) total += W.empty * (rows - 1 - cell.r); continue; }
        if (front[s] && cell.r >= frontRows) add(W.front * (1 + cell.r - frontRows), 'front', [s]);
        if (gender[s] && (mix === 'checker' || mix === 'cols')) {
          const par = mix === 'checker' ? (cell.r + cell.c) % 2 : cell.c % 2;
          if ((par === orient ? 1 : 2) !== gender[s]) add(W.mix, 'mix', [s]);
        }
        if (prevSeat[s] >= 0 && !fixedStudent.has(s)) {
          if (prevSeat[s] === i) add(W.sameSeat, 'sameSeat', [s]);
          else if (!front[s]) { const p = cells[prevSeat[s]]; if (p && Math.abs(p.r - cell.r) <= 1 && Math.abs(p.c - cell.c) <= 1) total += W.nearSeat; }
        }
        for (const j of cell.side) {
          if (j < i) continue;
          const t = slot[j]; if (t < 0) continue;
          if (mix === 'side' && gender[s] && gender[t] && gender[s] === gender[t]) add(W.mix, 'mix', [s, t]);
          if (prevSide.has(pairKey(s, t))) add(W.prevSide, 'prevSide', [s, t]);
        }
        for (const j of cell.fb) {
          if (j < i) continue;
          const t = slot[j]; if (t < 0) continue;
          if (prevFB.has(pairKey(s, t))) add(W.prevFB, 'prevFB', [s, t]);
        }
      }
      for (const [a, b] of apart) {
        const pa = cells[pos[a]], pb = cells[pos[b]];
        if (pa && pb && Math.abs(pa.r - pb.r) <= 1 && Math.abs(pa.c - pb.c) <= 1) add(W.apart, 'apart', [a, b]);
      }
      return total;
    }

    const free = []; // 動かしてよい席
    for (let i = 0; i < m; i++) if (!fixedCell.has(i)) free.push(i);
    const movers = []; for (let s = 0; s < n; s++) if (!fixedStudent.has(s)) movers.push(s);
    const restarts = Math.max(1, o.restarts || 8);
    const iterations = Math.max(100, o.iterations || Math.min(30000, 600 * Math.max(10, n)));
    const rand = rng(o.seed);
    let best = null;

    for (let run = 0; run < restarts; run++) {
      const orient = run % 2;
      const slot = new Array(m).fill(-1), pos = new Array(n).fill(-1);
      for (const [ci, si] of fixedCell) { slot[ci] = si; pos[si] = ci; }
      // 最初の並び：「前の席」の人を前の空き席に、ほかはくじで
      const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
      const frontFree = shuffle(free.filter((i) => cells[i].r < frontRows)), backFree = shuffle(free.filter((i) => cells[i].r >= frontRows));
      const order = shuffle(movers.filter((s) => front[s])).concat(shuffle(movers.filter((s) => !front[s])));
      // 空き席は後ろにまわしたいので、後ろの席ほどあとに使う
      const seatOrder = frontFree.concat(backFree.sort((x, y) => cells[x].r - cells[y].r || rand() - 0.5));
      order.forEach((s, k) => { const ci = seatOrder[k]; slot[ci] = s; pos[s] = ci; });

      let cur = cost(slot, pos, orient);
      let runBest = cur, runSlot = slot.slice();
      let T = 30;
      const cool = Math.pow(0.02 / T, 1 / iterations);
      for (let it = 0; it < iterations && runBest > 0; it++) {
        const a = free[Math.floor(rand() * free.length)], b = free[Math.floor(rand() * free.length)];
        if (a === b || (slot[a] < 0 && slot[b] < 0)) continue;
        const sa = slot[a], sb = slot[b];
        slot[a] = sb; slot[b] = sa;
        if (sa >= 0) pos[sa] = b;
        if (sb >= 0) pos[sb] = a;
        const next = cost(slot, pos, orient);
        const d = next - cur;
        if (d <= 0 || rand() < Math.exp(-d / T)) {
          cur = next;
          if (cur < runBest) { runBest = cur; runSlot = slot.slice(); }
        } else {
          slot[a] = sa; slot[b] = sb;
          if (sa >= 0) pos[sa] = a;
          if (sb >= 0) pos[sb] = b;
        }
        T *= cool;
      }
      if (!best || runBest < best.cost) best = { cost: runBest, slot: runSlot, orient };
      if (best.cost === 0) break; // 全部の条件を満たせたら、それ以上探さない
    }

    // 結果と、守れなかったこと
    const slot = best.slot, pos = new Array(n).fill(-1);
    slot.forEach((s, i) => { if (s >= 0) pos[s] = i; });
    const detail = [];
    cost(slot, pos, best.orient, detail);
    const seats = {};
    slot.forEach((s, i) => { if (s >= 0) seats[cells[i].k] = students[s].id; });
    const ids = (list) => list.map((s) => students[s].id);
    const issues = [];
    const frontMiss = detail.filter((d) => d.kind === 'front');
    const frontSeats = cells.filter((c) => c.r < frontRows).length;
    const frontWant = front.filter(Boolean).length;
    if (frontMiss.length) issues.push({ kind: 'front', ids: ids(frontMiss.map((d) => d.ids[0])), text: '「前の席」の人のうち ' + frontMiss.length + '人を、前から' + frontRows + '列目までに入れられませんでした' + (frontWant > frontSeats ? '（前の席は' + frontSeats + 'こ・希望は' + frontWant + '人）' : '（固定の席が前をふさいでいるかもしれません）') + '。' });
    const apartMiss = detail.filter((d) => d.kind === 'apart');
    if (apartMiss.length) issues.push({ kind: 'apart', ids: ids(apartMiss.flatMap((d) => d.ids)), text: '「はなす」組のうち ' + apartMiss.length + '組が、近くの席になりました。' });
    const mixMiss = detail.filter((d) => d.kind === 'mix');
    if (mixMiss.length && mix !== 'none') {
      const mN = gender.filter((g) => g === 1).length, fN = gender.filter((g) => g === 2).length;
      issues.push({ kind: 'mix', ids: [], text: '男女の並びが合わないところが ' + mixMiss.length + 'か所あります' + (mN !== fN ? '（男子' + mN + '人・女子' + fN + '人で、人数がちがうため）' : '') + '。' });
    }

      await render();
      return () => { alive = false; off(); offC(); rerender.cancel(); };
    },
  });
})();

        const nameIn = h('input', { type: 'text', id: 'ro-class-name', class: 'ro-name-input', maxlength: 30, placeholder: '例：2年3組' });
        nameIn.value = cur.name || '';

        nameIn.addEventListener('change', async () => { await persist.flush(); await reload(); });
        const genderN = (g) => cur.students.filter((s) => s.gender === g).length;

          h('span', { class: 'grow' })));

        const veil = h('div', { class: 'ro-veil' + (School.hidden() && !showAnyway ? ' is-veiled' : '') });

        const counts = {};

        if (!cur.students.length) table.append(h('p', { class: 'small muted', style: { padding: '14px' } }, 'まだ生徒がいません。「名簿を貼り付ける」か「1人ふやす」で入れてください。'));
        veil.append(table);

        body.append(h('div', { class: 'ro-tools' },

          h('span', { class: 'grow' }),
          Kit.btn('番号と氏名をコピー', copyRoster, { icon: 'copy', title: 'かんたん成績・Excel にそのまま貼れます' }),
          Kit.btn('CSV で書き出す', exportCsv, { icon: 'download', kind: 'ghost' })));
        body.append(h('details', { class: 'help ro-help' }, h('summary', null, 'ほかの道具とのつながり・名簿の扱い'),
          h('ul', null,
            h('li', null, '「番号と氏名をコピー」は、かんたん成績の名簿や Excel にそのまま貼れる形（1行に「番号　氏名」）です。'),
            h('li', null, '「前の席」に印をつけた人は、席替えで前のほうの席になります。性別は、席替えの「男女を交互に」だけに使います（空欄でもかまいません）。'),
            h('li', null, '名簿はこのブラウザの中だけに保存されます。学校の決まりで名前を入れられないときは、番号だけで使ってください。'),
            h('li', null, '生徒を消すと、その人の席・係・提出の記録は表示されなくなります。'))));
        // クラスを消すのは、いちばん下に（ふだん押さないので目立たせない）
        body.append(h('div', { class: 'ro-danger' }, Kit.btn('このクラスを消す', () => removeClass(), { sm: true, kind: 'danger', icon: 'trash' })));
      }

      function row(s, i, dup) {
        const id = 'ro-' + i;
        const no = h('input', { type: 'number', min: 1, max: 999, step: 1, inputmode: 'numeric', 'aria-label': '番号', id: id + '-no', class: 'c-no-in' });
        no.value = s.no == null ? '' : String(s.no);
        const name = h('input', { type: 'text', maxlength: 40, placeholder: '（番号だけでも可）', 'aria-label': (s.no || '') + '番の氏名', id: id + '-name' });
        name.value = s.name || '';
        const kana = h('input', { type: 'text', maxlength: 40, placeholder: 'ふりがな', 'aria-label': (s.no || '') + '番のふりがな', id: id + '-kana' });
        kana.value = s.kana || '';
        const gender = h('select', { 'aria-label': (s.no || '') + '番の性別', id: id + '-g' }, [['', '—'], ['m', '男'], ['f', '女']].map(([v, l]) => h('option', { value: v }, l)));
        gender.value = s.gender || '';
        const front = h('input', { type: 'checkbox', checked: !!s.front, id: id + '-front', 'aria-label': (s.no || '') + '番は前の席' });
        const note = h('input', { type: 'text', maxlength: 60, placeholder: 'メモ', 'aria-label': (s.no || '') + '番のメモ', id: id + '-note' });
        note.value = s.note || '';
        const upd = () => {
          const n = parseInt(no.value, 10);
          Object.assign(s, { no: Number.isFinite(n) && n > 0 ? n : s.no, name: name.value.replace(/\s+/g, ' ').trim(), kana: kana.value.trim(), gender: gender.value, front: front.checked, note: note.value.trim() });
          persist();
        };
        for (const el of [name, kana, note]) el.addEventListener('input', upd);
        for (const el of [gender, front]) el.addEventListener('change', upd);
        no.addEventListener('change', () => { upd(); cur.students.sort((a, b) => a.no - b.no); renderBody(); });
        return h('div', { class: 'ro-row' + (dup ? ' is-dup' : '') },
          h('span', { class: 'c-no' }, no), h('span', { class: 'c-name' }, name), h('span', { class: 'c-kana' }, kana),
          h('span', { class: 'c-gender' }, gender), h('label', { class: 'c-front ro-front', for: id + '-front' }, front, h('span', { class: 'ro-front-l' }, '前')),
          h('span', { class: 'c-note' }, note),
          h('span', { class: 'c-del' }, Kit.btn('', () => removeStudent(s), { icon: 'trash', kind: 'ghost', sm: true, title: (s.no || '') + '番を名簿から消す' })));
      }

      async function addStudent() {
        const next = cur.students.reduce((m, s) => Math.max(m, s.no || 0), 0) + 1;
        cur.students.push({ id: Kit.uid('st'), no: next, name: '', kana: '', gender: '', front: false, note: '' });
        await School.classes.save(cur);
        renderBody();
        const inp = body.querySelector('.ro-row:last-child .c-name input');
        if (inp) inp.focus();
      }
      async function removeStudent(s) {
        const ok = await Kit.confirm({ title: '名簿から消しますか？', body: (s.no || '') + '番 ' + (School.hidden() ? '' : s.name || '') + ' を名簿から消します。この人の席・係・提出の記録は表示されなくなります。', ok: '消す', danger: true });
        if (!ok) return;
        const before = Kit.clone(cur);
        cur.students = cur.students.filter((x) => x.id !== s.id);
        await School.classes.save(cur);
        renderBody();
        Kit.toast('名簿から消しました', { action: { label: '元に戻す', onClick: async () => { cur = before; await School.classes.save(cur); renderBody(); } } });
      }
      async function renumber() {
        const ok = await Kit.confirm({ title: '番号をつけ直しますか？', body: 'いまの並び順のまま、1番から順に番号をつけ直します。', ok: 'つけ直す' });
        if (!ok) return;
        cur.students.forEach((s, i) => { s.no = i + 1; });
        await School.classes.save(cur);
        renderBody();
      }
      async function copyRoster() {
        if (!cur.students.length) { Kit.toast('まだ生徒がいません', { type: 'bad' }); return; }
        await Kit.copy(School.tsv(cur.students.map((s) => [s.no, s.name || ''])), '番号と氏名をコピーしました（かんたん成績・Excel に貼れます）');
      }
      async function exportCsv() {
        if (!cur.students.length) { Kit.toast('まだ生徒がいません', { type: 'bad' }); return; }
        const rows = [['番号', '氏名', 'ふりがな', '性別', '前の席', 'メモ']].concat(cur.students.map((s) => [s.no, s.name || '', s.kana || '', s.gender ? GENDER_LABEL[s.gender] : '', s.front ? '○' : '', s.note || '']));
        if (await Kit.download('名簿-' + Kit.safeName(cur.name || 'クラス') + '.csv', Kit.csv(rows))) Kit.toast('名簿を書き出しました');
      }

      /* ── クラスの追加・削除 ── */
      async function addClass(o = {}) {
        const name = h('input', { type: 'text', id: 'ro-new-name', maxlength: 30, placeholder: '例：2年3組' });
        const count = h('input', { type: 'number', id: 'ro-new-count', min: 0, max: 60, step: 1, inputmode: 'numeric', placeholder: '例：32' });
        name.value = o.name || '';
        const body2 = h('div', { class: 'stack' },
          Kit.field({ label: 'クラスの名前', input: name }),
          Kit.field({ label: '人数（番号だけの名簿を作るとき）', input: count, hint: '空欄なら空のクラスを作ります。あとから「名簿を貼り付ける」で名前を入れられます。' }));
        const res = await new Promise((resolve) => Kit.modal({
          title: 'クラスを追加', body: body2, autofocus: 'input', onClose: (v) => resolve(v || null),
          actions: [{ label: 'やめる', kind: 'ghost' }, {
            label: '追加する', kind: 'primary', onClick: () => {
              if (!name.value.trim()) { Kit.toast('クラスの名前を入れてください', { type: 'bad' }); name.focus(); return false; }
              const n = Kit.clamp(parseInt(count.value, 10) || 0, 0, 60);
              return { name: name.value.trim(), n };
            },
          }],
        }));
        if (!res) return null;
        const c = { id: Kit.uid('class'), name: res.name, students: Array.from({ length: res.n }, (_, i) => ({ id: Kit.uid('st'), no: i + 1, name: '', kana: '', gender: '', front: false, note: '' })) };
        const saved = await School.classes.save(c);
        School.classes.setCurrent(saved.id);
        Kit.toast('「' + saved.name + '」を追加しました');
        await load(); render();
        return saved;
      }
      async function removeClass() {
        const ok = await Kit.confirm({ title: '「' + (cur.name || 'このクラス') + '」を消しますか？', body: '名簿と、このクラスの席・係・宿題の記録をすべて消します。元に戻せません（心配なら、先にホームからバックアップを書き出してください）。', ok: '消す', danger: true });
        if (!ok) return;
        await School.classes.remove(cur.id);
        cur = null;
        Kit.toast('クラスを消しました');
        await load(); render();
      }

      /* ── 貼り付け ── */
      function merge(old, parsed) {
        const used = new Set();
        return parsed.map((p) => {
          let m = null;
          if (p.name) m = old.find((s) => !used.has(s.id) && s.name && norm(s.name) === norm(p.name));
          if (!m) m = old.find((s) => !used.has(s.id) && s.no === p.no && (!s.name || !p.name));
          if (m) used.add(m.id);
          return { id: m ? m.id : Kit.uid('st'), no: p.no, name: p.name, kana: p.kana || (m && m.kana) || '', gender: p.gender || (m && m.gender) || '', front: p.front || !!(m && m.front), note: (m && m.note) || '' };
        });
      }
      function openPaste() {
        const ta = h('textarea', { id: 'ro-paste', rows: 8, placeholder: '例）\n1\t青木 そら\n2\t井上 ゆい\n3\t上田 はると\n（Excel の名簿をそのままコピーして貼り付けられます）' });
        const prev = h('div', { 'aria-live': 'polite' });
        const newName = h('input', { type: 'text', id: 'ro-paste-name', maxlength: 30, placeholder: '例：2年3組' });
        const canReplace = !!cur;
        let mode = canReplace && !cur.sample ? 'replace' : 'new';
        let parsed = [];
        const modeSeg = Kit.seg([
          ...(canReplace ? [{ value: 'replace', label: '「' + (cur.name || 'いまのクラス') + '」を置きかえる' }, { value: 'add', label: '「' + (cur.name || 'いまのクラス') + '」に追加' }] : []),
          { value: 'new', label: '新しいクラスにする' },
        ], mode, (v) => { mode = v; nameF.hidden = mode !== 'new'; }, { label: '入れ方' });
        const nameF = Kit.field({ label: '新しいクラスの名前', input: newName });
        nameF.hidden = mode !== 'new';
        const show = () => {
          parsed = School.parseRoster(ta.value);
          Kit.clear(prev);
          if (!ta.value.trim()) { prev.append(h('p', { class: 'small muted' }, '1行に1人。「氏名」「番号 氏名」「組 番号 氏名」「番号 姓 名」などの形を読めます。見出しの行（番号・氏名・ふりがな・性別）があれば、それに合わせます。')); return; }
          if (!parsed.length) { prev.append(h('p', { class: 'small', style: { color: 'var(--bad)' } }, '名簿として読めませんでした。1行に1人ずつ並んでいるか確かめてください。')); return; }
          const g = (x) => GENDER_LABEL[x.gender || ''];
          prev.append(h('p', { class: 'small' }, parsed.length + '人を読み取りました。確かめてください。'),
            h('div', { class: 'tbl-wrap ro-paste-prev' }, h('table', { class: 'tbl' },
              h('thead', null, h('tr', null, ['番号', '氏名', 'ふりがな', '性別', '前の席'].map((t) => h('th', null, t)))),
              h('tbody', null, parsed.map((p) => h('tr', null, h('td', { class: 'r' }, p.no), h('td', null, p.name || '（名前なし）'), h('td', null, p.kana || ''), h('td', null, g(p)), h('td', null, p.front ? '○' : '')))))));
        };
        ta.addEventListener('input', show);
        show();
        const body2 = h('div', { class: 'stack' }, Kit.field({ label: '名簿（Excel からコピーして貼り付け）', input: ta }), prev, Kit.field({ label: '入れ方', input: modeSeg }), nameF,
          h('p', { class: 'small muted' }, '置きかえるときは、同じ名前（名前がなければ同じ番号）の人の席・係・提出の記録を引き継ぎます。'));
        Kit.modal({
          title: '名簿を貼り付ける', wide: true, body: body2, autofocus: 'input',
          actions: [{ label: 'やめる', kind: 'ghost' }, {
            label: '名簿に入れる', kind: 'primary', onClick: async () => {
              show();
              if (!parsed.length) { Kit.toast('名簿を貼り付けてください', { type: 'bad' }); ta.focus(); return false; }
              if (mode === 'new') {
                if (!newName.value.trim()) { Kit.toast('新しいクラスの名前を入れてください', { type: 'bad' }); newName.focus(); return false; }
                const c = await School.classes.save({ id: Kit.uid('class'), name: newName.value.trim(), students: merge([], parsed) });
                School.classes.setCurrent(c.id);
                Kit.toast('「' + c.name + '」に' + parsed.length + '人を入れました');
              } else if (mode === 'replace') {
                cur.students = merge(cur.students, parsed);
                await School.classes.save(cur);
                Kit.toast('名簿を置きかえました（' + parsed.length + '人）');
              } else {
                const fresh = merge([], parsed);
                cur.students = cur.students.concat(fresh);
                await School.classes.save(cur);
                Kit.toast(parsed.length + '人を追加しました');
              }
              await load(); render();
              return true;
            },
          }],
        });
      }

      async function reload() { await load(); render(); }
      await load();
      render();
      // ほかのタブ・バックアップからの読み込みなどで変わったときだけ描きなおす（自分の入力中は描きなおさない）
      const onStore = Kit.debounce(async () => {
        const before = sig(cur);
        const all = await School.classes.list();
        const now = cur ? all.find((c) => c.id === cur.id) : null;
        if (!cur || !now || sig(now) !== before) { classes = all; if (!now) cur = null; await load(); render(); }
        else { classes = all; renderTabs(); renderSample(); }
      }, 250);
      const offs = [Kit.store.on('coll:classes', onStore), School.onClassChange(() => { showAnyway = false; load().then(render); })];
      return () => { offs.forEach((f) => f()); onStore.cancel(); persist.flush(); };
    },
  });
})();

// 席替え：条件（前の席・はなす2人・男女・前回のとなり）をつけて、くじで席を決める。発表・印刷も
(function () {
  'use strict';
  const { h } = Kit;
  const K = (r, c) => r + '-' + c;
  const range = (n) => Array.from({ length: n }, (_, i) => i);

  const CFG_DEFAULT = { rows: 6, cols: 6, pairs: true, blocked: [], frontRows: 2, mix: 'none', avoidPrev: true, emptyBack: true, apart: [], fixed: {}, view: 'student' };
  const MIX = [
    { value: 'none', label: '気にしない' },
    { value: 'side', label: 'となり同士は男女' },
    { value: 'checker', label: '市松（前後左右が交互）' },
    { value: 'cols', label: '縦の列ごとに男女' },
  ];
  const normCfg = (c, classId) => {
    const o = Object.assign(Kit.clone(CFG_DEFAULT), c || {});
    o.rows = Kit.clamp(o.rows | 0 || 6, 1, 12); o.cols = Kit.clamp(o.cols | 0 || 6, 1, 12);
    o.blocked = (o.blocked || []).filter((k) => { const [r, cc] = String(k).split('-').map(Number); return r < o.rows && cc < o.cols; });
    o.frontRows = Kit.clamp(o.frontRows | 0 || 2, 1, 3);
    if (!MIX.some((x) => x.value === o.mix)) o.mix = 'none';
    o.apart = Array.isArray(o.apart) ? o.apart.filter((p) => Array.isArray(p) && p[0] && p[1]) : [];
    o.fixed = o.fixed && typeof o.fixed === 'object' ? o.fixed : {};
    o.view = o.view === 'teacher' ? 'teacher' : 'student';
    if (classId) { o.classId = classId; o.id = 'cfg-' + classId; }
    return o;
  };

  // サンプル：架空のクラスの設定と、前回の席
  const SC = School.SAMPLE_CLASS;
  const sampleCfg = normCfg({ apart: [[School.sampleStudent(3), School.sampleStudent(27)]] }, SC.id);
  const sampleRes = SeatSolver.solve({ rows: 6, cols: 6, pairs: true, students: SC.students, frontRows: 2, seed: 20261001, restarts: 1, iterations: 3000, apart: sampleCfg.apart });
  Kit.store.sample('seatcfg', [sampleCfg]);
  Kit.store.sample('seatplans', [{ id: 's-seat-1', classId: SC.id, title: '9月の席', date: Kit.rel(-20), rows: 6, cols: 6, blocked: [], pairs: true, seats: sampleRes.seats, seed: 20261001 }]);
  School.classes.onRemove(School.removeByClass('seatcfg'));
  School.classes.onRemove(School.removeByClass('seatplans'));

  Kit.css('seats', `

.st-mk{position:absolute;top:3px;display:flex;gap:2px}
.st-mk.l{left:4px}.st-mk.r{right:4px}
.st-mk svg{width:12px;height:12px;color:var(--gosu)}
.st-mk b{font-size:10px;line-height:1.2;padding:0 3px;border-radius:3px;background:var(--surface-2);color:var(--ink-2);font-weight:700}
.st-mk b.fr{background:var(--warn-wash);color:var(--warn)}
@keyframes st-pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
.st-issues{display:grid;gap:6px;margin-top:10px}
.st-issue{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--warn-wash);color:var(--ink)}
.st-issue svg{flex:none;width:16px;height:16px;color:var(--warn);margin-top:3px}
.st-ok{display:flex;gap:8px;align-items:center;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--ok-wash);color:var(--ink)}
.st-ok svg{width:16px;height:16px;color:var(--ok)}
.st-unseated{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px;font-size:13px}
.st-unseated .chip{cursor:pointer;min-height:30px;font-size:13px}
.st-unseated .chip[aria-pressed="true"]{background:var(--shu);color:var(--on-shu)}
.st-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.st-set{display:grid;gap:14px}
.st-set h3{font-size:14px;font-weight:700}
.st-num{display:inline-flex;align-items:center;gap:4px}
.st-num b{min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums;font-size:16px}
.st-dims{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.st-pairs{display:grid;gap:6px}
.st-pair{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 4px 4px 10px;border:1px solid var(--line);border-radius:8px}
.st-pair span{flex:1;min-width:0}
.st-addpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px}
.st-sum{font-size:13px;color:var(--ink-2)}
/* 発表 */
.st-show{position:fixed;inset:0;z-index:150;background:var(--bg);display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) var(--gutter-r) max(14px,env(safe-area-inset-bottom)) var(--gutter-l);overflow:auto}
.st-show-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.st-show-top h2{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,3vw,30px);margin-right:auto}
.st-show .st-board{--seat-h:clamp(56px,9vh,96px);flex:1;align-content:center}
.st-show .st-seat{--seat-w:clamp(70px,12vw,150px)}
.st-show .st-seat .nm{font-size:clamp(14px,2.2vw,24px)}
.st-show .st-seat .no{font-size:clamp(11px,1.3vw,15px)}
.st-seat.is-hidden{background:var(--gosu-wash);border-color:var(--gosu);color:var(--gosu)}
.st-seat.is-hidden .nm{font-size:clamp(18px,3vw,30px);font-family:var(--font-display)}
.st-seat.is-flip{animation:st-flip .45s ease-out}
@keyframes st-flip{0%{transform:rotateY(90deg)}100%{transform:none}}
@media (max-width:640px){
  .st-board{--seat-h:54px;--gap:4px;--aisle:8px}
  .st-seat{--seat-w:calc((100vw - 2 * var(--gutter-l) - 60px - var(--extra-aisles, 0px)) / var(--ncols))}
  .st-seat .nm{font-size:12.5px}
  .st-seat .nm .mei{display:none}
  .st-boardcard{padding:10px}
}
/* 印刷 */
.st-print{font-family:var(--font-body);color:#000}
.st-print h1{font-size:20pt;margin:0 0 2mm;font-family:var(--font-display)}
.st-print .sub{font-size:10pt;margin-bottom:5mm}
.st-print .pg{page-break-after:always}
.st-print .pg:last-child{page-break-after:auto}
.st-print .front{display:flex;justify-content:center;gap:6mm;margin:3mm auto;width:70%}
.st-print .front span{flex:1;text-align:center;border:1.5pt solid #000;padding:1.5mm 0;font-size:11pt;letter-spacing:.4em}
.st-print .front span.k{flex:none;width:28mm;letter-spacing:.2em}
.st-print table{border-collapse:separate;border-spacing:2.5mm;margin:0 auto}
.st-print td{border:1pt solid #000;border-radius:2mm;width:var(--pw);height:var(--ph);text-align:center;vertical-align:middle;padding:1mm}
.st-print td.none{border:0}
.st-print td.aisle{border:0;width:4mm;padding:0}
.st-print td .no{display:block;font-size:8pt;color:#333}
.st-print td .nm{display:block;font-size:var(--pf);font-weight:700;line-height:1.2}
.st-print td.empty .nm{font-weight:400;color:#777;font-size:9pt}
`);

  Kit.app({
    id: 'seats', title: '席替え', group: 'class', icon: 'seats', order: 20,
    desc: '条件をつけて、くじで席を決める。発表・印刷も',
    colls: ['seatcfg', 'seatplans'],
    async mount(root) {
      const S = { cls: null, cfg: null, plans: [], draft: null, sel: null, selStudent: null, mode: 'swap', viewPlanId: null, busy: false };
      const mq = window.matchMedia('(max-width: 640px)');
      let alive = true;

      const classSlot = h('div'), sampleSlot = h('div'), main = h('div');
      const runBtn = Kit.btn('席替えする', () => run(), { kind: 'primary', icon: 'shuffle' });
      root.append(Kit.appHead({
        title: '席替え',
        desc: '条件をつけて、くじで席を決めます。発表と座席表の印刷も。',
        actions: [runBtn, Kit.btn('発表する', () => show(), { icon: 'eye' }), Kit.btn('印刷', () => printDlg(), { icon: 'printer' })],
      }), classSlot, sampleSlot, main);

      /* ── 読み込み ── */
      async function load() {
        S.cls = await School.classes.current();
        if (!S.cls) { S.cfg = null; S.plans = []; S.draft = null; return; }
        const cfgs = await Kit.store.list('seatcfg', { sample: [sampleCfg] });
        S.cfg = normCfg(cfgs.find((c) => c.classId === S.cls.id), S.cls.id);
        const all = await Kit.store.list('seatplans');
        S.plans = all.filter((p) => p.classId === S.cls.id).sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));
        const show = (S.viewPlanId && S.plans.find((p) => p.id === S.viewPlanId)) || S.plans[0] || null;
        if (!S.draft || S.draft.classId !== S.cls.id || S.draft.saved) S.draft = show ? fromPlan(show) : blankDraft();
      }
      const fromPlan = (p) => ({ classId: p.classId, planId: p.id, title: p.title || '', date: p.date, rows: p.rows, cols: p.cols, blocked: (p.blocked || []).slice(), pairs: !!p.pairs, seats: Object.assign({}, p.seats || {}), seed: p.seed, saved: true, issues: null });
      const blankDraft = () => ({ classId: S.cls.id, planId: null, title: '', date: Kit.ymd(), rows: S.cfg.rows, cols: S.cfg.cols, blocked: S.cfg.blocked.slice(), pairs: S.cfg.pairs, seats: {}, saved: false, issues: null });
      const latest = () => S.plans[0] || null;
      const stById = () => new Map((S.cls ? S.cls.students : []).map((s) => [s.id, s]));
      const saveCfg = Kit.debounce(() => { if (S.cfg) Kit.store.put('seatcfg', Object.assign({}, S.cfg)); }, 300);

      /* ── 描く ── */
      async function render() {
        Kit.clear(classSlot); Kit.clear(sampleSlot); Kit.clear(main);
        classSlot.append(await School.classBar({ onChange: async () => { S.draft = null; S.viewPlanId = null; S.sel = null; await load(); render(); } }));
        if (!S.cls) { main.append(Kit.empty({ title: '席替えには名簿が要ります', body: '名簿にクラスを入れると、ここで席替えができます（出席番号だけでも使えます）。', actions: [Kit.btn('名簿を開く', () => Kit.go('roster'), { kind: 'primary', icon: 'users' })] })); return; }
        if (S.cls.sample) sampleSlot.append(Kit.sampleBar('架空のクラス（2年3組）で試せます。「席替えする」を押してみてください。'));
        main.append(h('div', { class: 'st-wrap' }, boardCard(), settingsCard()));
      }

      function boardCard() {
        const d = S.draft;
        const card = h('section', { class: 'card st-boardcard', 'aria-label': '座席' });
        const histSel = h('select', { id: 'st-hist', 'aria-label': '保存した席', style: { width: 'auto', maxWidth: '100%' } },
          h('option', { value: '' }, S.plans.length ? '保存した席（' + S.plans.length + '）' : '保存した席はまだありません'),
          S.plans.map((p) => h('option', { value: p.id }, Kit.fmtDate(p.date, 'M/D') + ' ' + (p.title || '席'))));
        histSel.value = d.planId || '';
        histSel.addEventListener('change', async () => {
          if (!histSel.value) return;
          if (!d.saved && Object.keys(d.seats).length && !(await Kit.confirm({ title: '保存していない席があります', body: 'いま表示している席は、まだ保存していません。ほかの席を開くと消えます。', ok: '開く' }))) { histSel.value = d.planId || ''; return; }
          const p = S.plans.find((x) => x.id === histSel.value);
          if (p) { S.viewPlanId = p.id; S.draft = fromPlan(p); S.sel = null; render(); }
        });
        const status = d.saved ? h('span', { class: 'chip ok' }, Kit.fmtDate(d.date, 'M/D') + ' に保存') : Object.keys(d.seats).length ? h('span', { class: 'chip shu' }, 'まだ保存していません') : null;
        card.append(h('div', { class: 'st-bar' },
          h('div', { class: 'st-title' }, (S.cls.name || '') + ' の席', status),
          histSel,
          Kit.seg([{ value: 'student', label: '生徒から見た図' }, { value: 'teacher', label: '教卓から見た図' }], S.cfg.view, (v) => { S.cfg.view = v; saveCfg(); render(); }, { label: '図の向き' })));
        const hint = { swap: '席を2つ押すと、入れかわります。', pin: '押した席の人を「固定」にします（次の席替えでも動きません）。', layout: '押した場所の机を、出す・なくすを切りかえます。' }[S.mode];
        card.append(h('div', { class: 'st-modes' },
          Kit.seg([{ value: 'swap', label: '入れかえ', icon: 'swap' }, { value: 'pin', label: '固定する', icon: 'pin' }, { value: 'layout', label: '机の配置', icon: 'seats' }], S.mode, (v) => { S.mode = v; S.sel = null; S.selStudent = null; render(); }, { label: '押したときの動き' }),
          h('span', { class: 'st-modehint' }, hint)));
        card.append(board({ interactive: true }));
        card.append(unseatedEl());
        card.append(issuesEl());
        card.append(h('div', { class: 'st-actions' },
          Kit.btn(d.saved ? 'この席を保存しなおす' : 'この席で決定（保存）', () => savePlan(), { kind: d.saved ? '' : 'primary', icon: 'save', disabled: !Object.keys(d.seats).length }),
          Kit.btn(Object.keys(d.seats).length ? 'もう一度くじ' : '席替えする', () => run(), { icon: 'shuffle' }),
          !d.saved && latest() ? Kit.btn('保存した席に戻す', () => { S.draft = fromPlan(latest()); S.sel = null; render(); }, { kind: 'ghost', icon: 'undo' }) : null,
          h('span', { class: 'grow' }),
          d.saved && d.planId ? Kit.btn('', () => removePlan(d.planId), { icon: 'trash', kind: 'ghost', title: 'この保存した席を消す' }) : null));
        return card;
      }

      // 座席の図。o.big … 発表用 / o.hiddenSet … 発表で伏せている席 / o.interactive … 押せる
      function board(o = {}) {
        const d = o.draft || S.draft, view = o.view || S.cfg.view;
        const st = stById();
        const blocked = new Set(d.blocked || []);
        const issueIds = new Set((d.issues || []).filter((x) => x.kind === 'front' || x.kind === 'apart').flatMap((x) => x.ids || []));
        const fixedAt = o.interactive ? S.cfg.fixed : {};
        const rowsOrder = view === 'teacher' ? range(d.rows).reverse() : range(d.rows);
        const colsOrder = view === 'teacher' ? range(d.cols).reverse() : range(d.cols);
        const aisleAfter = (c, i) => d.pairs && i < colsOrder.length - 1 && (view === 'teacher' ? c % 2 === 0 : c % 2 === 1);
        const tpl = [];
        colsOrder.forEach((c, i) => { tpl.push('auto'); if (aisleAfter(c, i)) tpl.push('var(--aisle)'); });
        const nAisles = tpl.length - colsOrder.length;
        const grid = h('div', { class: 'st-grid', role: 'group', 'aria-label': view === 'teacher' ? '教卓から見た座席' : '生徒から見た座席', style: '--tpl:' + tpl.join(' ') + ';--ncols:' + d.cols + ';--extra-aisles:' + nAisles * 8 + 'px' });
        const showMix = S.cfg.mix !== 'none';
        for (const r of rowsOrder) {
          colsOrder.forEach((c, i) => {
            const k = K(r, c);
            const none = blocked.has(k);
            const id = d.seats[k], s = id ? st.get(id) : null;
            let el;
            if (none) {
              el = h(o.interactive && S.mode === 'layout' ? 'button' : 'div', { class: 'st-seat is-none' + (o.interactive && S.mode === 'layout' ? ' can-edit' : ''), 'data-k': k, type: o.interactive && S.mode === 'layout' ? 'button' : null, 'aria-label': o.interactive && S.mode === 'layout' ? (r + 1) + '列目の' + (c + 1) + '番目に机を出す' : null });
            } else if (!s) {
              el = h(o.interactive ? 'button' : 'div', { type: o.interactive ? 'button' : null, class: 'st-seat is-empty' + (S.sel === k ? ' is-sel' : ''), 'data-k': k, 'aria-label': '空いた席' }, h('span', { class: 'nm' }, '空き'));
            } else {
              const hiddenNow = o.hiddenSet && o.hiddenSet.has(k);
              const name = School.label(s, { noNumber: true });
              const parts = name.split(' ');
              const nm = hiddenNow ? h('span', { class: 'nm' }, '？') : School.hidden() || !s.name ? h('span', { class: 'nm' }, s.no + '番') : h('span', { class: 'nm' }, h('span', { class: 'sei' }, parts[0]), parts[1] ? h('span', { class: 'mei' }, ' ' + parts.slice(1).join(' ')) : null);
              el = h(o.interactive || o.big ? 'button' : 'div', {
                type: o.interactive || o.big ? 'button' : null,
                class: 'st-seat' + (S.sel === k && o.interactive ? ' is-sel' : '') + (fixedAt[k] === id ? ' is-fixed' : '') + (o.interactive && issueIds.has(id) ? ' is-issue' : '') + (hiddenNow ? ' is-hidden' : '') + (o.flipKey === k ? ' is-flip' : '') + (o.popAll ? ' is-new' : ''),
                'data-k': k, 'aria-label': hiddenNow ? 'まだ伏せている席' : (s.no + '番' + (School.hidden() ? '' : ' ' + (s.name || ''))) + (fixedAt[k] === id ? '（固定）' : ''),
              },
              hiddenNow || !s.name || School.hidden() ? null : h('span', { class: 'no' }, s.no),
              nm,
              o.interactive ? h('span', { class: 'st-mk l' }, fixedAt[k] === id ? Kit.icon('pin') : null, s.front ? h('b', { class: 'fr', title: '前の席' }, '前') : null) : null,
              o.interactive && showMix && s.gender ? h('span', { class: 'st-mk r' }, h('b', null, s.gender === 'm' ? '男' : '女')) : null);
            }
            grid.append(el);
            if (aisleAfter(c, i)) grid.append(h('span', { class: 'st-aisle', 'aria-hidden': 'true' }));
          });
        }
        const front = h('div', { class: 'st-front', 'aria-hidden': 'true' }, h('span', { class: 'st-kokuban' }, '黒板'), h('span', { class: 'st-kyotaku' }, '教卓'));
        const wrap = h('div', { class: 'st-board' + (o.big ? ' is-big' : '') });
        if (view === 'teacher') wrap.append(grid, front); else wrap.append(front, grid);
        if (o.interactive) grid.addEventListener('click', onSeat);
        return wrap;
      }

      function unseatedEl() {
        const d = S.draft;
        const seated = new Set(Object.values(d.seats));
        const left = S.cls.students.filter((s) => !seated.has(s.id));
        if (!left.length || !Object.keys(d.seats).length) return h('div');
        return h('div', { class: 'st-unseated' },
          h('span', null, '席がまだない人：'),
          left.map((s) => h('button', { type: 'button', class: 'chip', 'aria-pressed': String(S.selStudent === s.id), onclick: () => { S.selStudent = S.selStudent === s.id ? null : s.id; S.sel = null; render(); } }, School.label(s))),
          h('span', { class: 'small muted' }, '名前を押してから、空いた席を押すと座ります。'));
      }
      function issuesEl() {
        const d = S.draft, box = h('div', { class: 'st-issues', 'aria-live': 'polite' });
        if (d.error) { box.append(h('div', { class: 'st-issue' }, Kit.icon('warn'), h('span', null, d.error))); return box; }
        if (!d.issues) return box;
        if (!d.issues.length) box.append(h('div', { class: 'st-ok' }, Kit.icon('check'), h('span', null, '条件をすべて満たしました。')));
        for (const it of d.issues) box.append(h('div', { class: 'st-issue' }, Kit.icon('warn'), h('span', null, it.text)));
        return box;
      }

      /* ── 押したとき ── */
      function onSeat(e) {
        const b = e.target.closest('[data-k]');
        if (!b) return;
        const k = b.dataset.k, d = S.draft;
        if (S.mode === 'layout') return toggleDesk(k);
        if ((d.blocked || []).includes(k)) return;
        if (S.mode === 'pin') {
          const id = d.seats[k];
          if (!id) { Kit.toast('空いた席は固定できません'); return; }
          const fx = S.cfg.fixed;
          for (const kk of Object.keys(fx)) if (fx[kk] === id && kk !== k) delete fx[kk];
          if (fx[k] === id) delete fx[k]; else fx[k] = id;
          saveCfg(); render(); return;
        }
        // 席がない人を座らせる
        if (S.selStudent) {
          if (d.seats[k]) { Kit.toast('空いた席を押してください'); return; }
          d.seats[k] = S.selStudent; S.selStudent = null; changed(); return;
        }
        if (!S.sel) { if (!d.seats[k]) return; S.sel = k; render(); return; }
        if (S.sel === k) { S.sel = null; render(); return; }
        const a = S.sel, ia = d.seats[a], ib = d.seats[k];
        if (ib) d.seats[a] = ib; else delete d.seats[a];
        if (ia) d.seats[k] = ia; else delete d.seats[k];
        // 固定は人についていく
        const fx = S.cfg.fixed;
        const fa = fx[a], fb = fx[k];
        delete fx[a]; delete fx[k];
        if (fa) fx[k] = fa;
        if (fb) fx[a] = fb;
        S.sel = null;
        saveCfg();
        changed();
      }
      function changed() { S.draft.saved = false; S.draft.issues = null; render(); }
      function toggleDesk(k) {
        const set = new Set(S.cfg.blocked);
        if (set.has(k)) set.delete(k);
        else {
          if (S.draft.seats[k]) { Kit.toast('人が座っている席はなくせません。先に入れかえてください', { type: 'bad' }); return; }
          set.add(k);
        }
        S.cfg.blocked = [...set];
        S.draft.blocked = S.cfg.blocked.slice();
        for (const kk of Object.keys(S.cfg.fixed)) if (set.has(kk)) delete S.cfg.fixed[kk];
        saveCfg(); S.draft.saved = false; render();
      }

      /* ── 設定 ── */
      function settingsCard() {
        const c = S.cfg, st = S.cls.students;
        const seatsN = c.rows * c.cols - c.blocked.length;
        const num = (label, val, min, max, set) => h('span', { class: 'st-num' }, h('span', { class: 'small ink-2' }, label),
          Kit.btn('', () => set(Math.max(min, val - 1)), { icon: 'minus', sm: true, title: label + 'を減らす', disabled: val <= min }),
          h('b', { 'aria-live': 'polite' }, val),
          Kit.btn('', () => set(Math.min(max, val + 1)), { icon: 'plus', sm: true, title: label + 'をふやす', disabled: val >= max }));
        const setDims = (rows, cols) => {
          c.rows = rows; c.cols = cols;
          c.blocked = c.blocked.filter((k) => { const [r, cc] = k.split('-').map(Number); return r < rows && cc < cols; });
          for (const k of Object.keys(c.fixed)) { const [r, cc] = k.split('-').map(Number); if (r >= rows || cc >= cols) delete c.fixed[k]; }
          const d = S.draft;
          d.rows = rows; d.cols = cols; d.blocked = c.blocked.slice();
          for (const k of Object.keys(d.seats)) { const [r, cc] = k.split('-').map(Number); if (r >= rows || cc >= cols) delete d.seats[k]; }
          d.saved = false; d.issues = null;
          saveCfg(); render();
        };
        const genders = st.filter((s) => s.gender).length;
        const fronts = st.filter((s) => s.front);
        const pick = (id) => h('select', { id, 'aria-label': '生徒を選ぶ' }, h('option', { value: '' }, '選ぶ'), st.map((s) => h('option', { value: s.id }, School.label(s))));
        const pa = pick('st-pa'), pb = pick('st-pb');
        const byId = stById();
        const fixedList = Object.entries(c.fixed).filter(([, id]) => byId.has(id));
        return h('section', { class: 'card st-set', 'aria-label': '席替えの条件' },
          h('h2', { class: 'small', style: { fontSize: '16px', fontWeight: 700 } }, '条件'),
          h('div', { class: 'stack tight' },
            h('h3', null, '机の数'),
            h('div', { class: 'st-dims' }, num('横', c.cols, 1, 12, (v) => setDims(c.rows, v)), num('縦', c.rows, 1, 12, (v) => setDims(v, c.cols))),
            h('p', { class: 'st-sum' + (seatsN < st.length ? '' : ''), style: seatsN < st.length ? { color: 'var(--bad)' } : null }, '席 ' + seatsN + 'こ・生徒 ' + st.length + '人' + (seatsN < st.length ? '（席が足りません）' : seatsN > st.length ? '（空き ' + (seatsN - st.length) + '）' : '')),

            h('label', { class: 'check', for: 'st-empty' }, h('input', { type: 'checkbox', id: 'st-empty', checked: c.emptyBack, onchange: (e) => { c.emptyBack = e.target.checked; saveCfg(); } }), '空いた席は後ろに')),
