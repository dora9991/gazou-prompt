<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#24473b">
<title>先生の道具箱</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 先生の道具箱 — 共通の見た目（みせびらき の kit.css を写して、色と看板だけ学校向けに）
   黒板の緑を地の色に、ここぞという所だけチョークの朱。看板は黒板とチョーク受け。
   レイアウト：左にメニュー（黒板の看板つき）、右に作業台。スマホでは上に細い帯、メニューは引き出し。
   色はすべてトークン。トークンの名前は みせびらき と同じ（--gosu が主の色、--shu が差し色）。
   アプリ側の CSS も、ここの変数だけを使う（ダーク表示が自動でそろう）。 */
:root {
  --bg: #f3f5f1;
  --surface: #ffffff;
  --surface-2: #eaefe8;
  --surface-3: #dce5da;
  --line: #d2dbd0;
  --line-strong: #aab8a8;
  --ink: #17221c;
  --ink-2: #425147;
  --ink-3: #56645b;
  --gosu: #1f6b52;
  --gosu-hi: #26805f;
  --gosu-wash: #daeee3;
  --on-gosu: #ffffff;
  --shu: #c0482a;
  --shu-wash: #fae3da;
  --on-shu: #ffffff;
  --board: #24473b;
  --on-board: #f6f3ea;
  --frame: #a07b4f;
  --ok: #23774a;
  --ok-wash: #dcefe3;
  --warn: #8f5b00;
  --warn-wash: #f8ecd2;
  --bad: #b3261e;
  --bad-wash: #f8dcda;
  --focus: #26805f;
  --demo: #f3cf4a;
  --demo-wash: #fbf1c9;
  --on-demo: #2b2306;
  --scrim: rgba(12, 24, 18, .42);
  --shadow-1: 0 1px 2px rgba(20, 40, 30, .06);
  --shadow-2: 0 2px 4px rgba(20, 40, 30, .05), 0 12px 32px rgba(20, 40, 30, .12);
  /* グラフ・種類の色（みせびらき と同じ検証済みの並び。順番どおりに使い、使い回さない） */
  --series-1: #2f6fd0;
  --series-2: #e25a33;
  --series-3: #1baf7a;
  --series-4: #eda100;
  --series-5: #e87ba4;
  --series-6: #008300;
  --series-7: #6250d6;
  --series-8: #e34948;
  --chart-grid: #e3eae1;
  --chart-axis: #b7c4b5;
  --r: 10px;
  --r-sm: 6px;
  --r-lg: 16px;
  --font-display: "Klee One", "Hiragino Maru Gothic ProN", "Yu Gothic", "YuGothic", "IPAGothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic", Meiryo, "IPAGothic", system-ui, sans-serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --side-w: 248px;
  --top-h: 52px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1512;
    --surface: #17231d;
    --surface-2: #1e2c25;
    --surface-3: #26372e;
    --line: #2e4136;
    --line-strong: #3c5346;
    --ink: #e5eee8;
    --ink-2: #b2c3b8;
    --ink-3: #8ea095;
    --gosu: #7fd0ac;
    --gosu-hi: #9fdec1;
    --gosu-wash: #1b3a2d;
    --on-gosu: #0a1510;
    --shu: #ff8a66;
    --shu-wash: #47261b;
    --on-shu: #1a0b07;
    --board: #1c3a2f;
    --on-board: #f2efe6;
    --frame: #6e5537;
    --ok: #6fd09a;
    --ok-wash: #15372a;
    --warn: #f0c35a;
    --warn-wash: #3a2f12;
    --bad: #ff8d84;
    --bad-wash: #47201d;
    --focus: #9fdec1;
    --demo: #e9c54e;
    --demo-wash: #3a3214;
    --on-demo: #1f1904;
    --scrim: rgba(0, 0, 0, .55);
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-2: 0 2px 4px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
    --series-1: #5b8fe6;
    --series-2: #e5673f;
    --series-3: #199e70;
    --series-4: #c98500;
    --series-5: #d55181;
    --series-6: #2f9a2f;
    --series-7: #9085e9;
    --series-8: #e66767;
    --chart-grid: #20302a;
    --chart-axis: #3c5346;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1512;
  --surface: #17231d;
  --surface-2: #1e2c25;
  --surface-3: #26372e;
  --line: #2e4136;
  --line-strong: #3c5346;
  --ink: #e5eee8;
  --ink-2: #b2c3b8;
  --ink-3: #8ea095;
  --gosu: #7fd0ac;
  --gosu-hi: #9fdec1;
  --gosu-wash: #1b3a2d;
  --on-gosu: #0a1510;
  --shu: #ff8a66;
  --shu-wash: #47261b;
  --on-shu: #1a0b07;
  --board: #1c3a2f;
  --on-board: #f2efe6;
  --frame: #6e5537;
  --ok: #6fd09a;
  --ok-wash: #15372a;
  --warn: #f0c35a;
  --warn-wash: #3a2f12;
  --bad: #ff8d84;
  --bad-wash: #47201d;
  --focus: #9fdec1;
  --demo: #e9c54e;
  --demo-wash: #3a3214;
  --on-demo: #1f1904;
  --scrim: rgba(0, 0, 0, .55);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .3);
  --shadow-2: 0 2px 4px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .45);
  --series-1: #5b8fe6;
  --series-2: #e5673f;
  --series-3: #199e70;
  --series-4: #c98500;
  --series-5: #d55181;
  --series-6: #2f9a2f;
  --series-7: #9085e9;
  --series-8: #e66767;
  --chart-grid: #20302a;
  --chart-axis: #3c5346;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  line-break: strict;
}
img, video, canvas, svg { max-width: 100%; }
[hidden] { display: none !important; }
a { color: var(--gosu); }
a:hover { color: var(--gosu-hi); }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
::selection { background: var(--gosu-wash); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ───────── 外枠（メニュー＋作業台） ───────── */
.mb { display: grid; grid-template-columns: 1fr; min-height: 100vh; min-height: 100dvh; }
@media (min-width: 1000px) { .mb { grid-template-columns: var(--side-w) minmax(0, 1fr); } }

.mb-top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40;
  display: flex; align-items: center; gap: 10px;
  height: var(--top-h);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  background: var(--board); color: var(--on-board);
}
@media (min-width: 1000px) { .mb-top { display: none; } }
.mb-top .mb-menu-btn { color: var(--on-board); background: transparent; border: 0; width: 40px; height: 40px; margin-left: -8px; border-radius: 8px; display: grid; place-items: center; cursor: pointer; }
.mb-top .mb-menu-btn:hover { background: rgba(255, 255, 255, .12); }
.mb-top .mb-top-brand { font-family: var(--font-display); font-weight: 600; letter-spacing: .08em; font-size: 17px; }
.mb-top .mb-top-app { margin-left: auto; font-size: 13px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.mb-side {
  position: fixed; inset: 0 auto 0 0; z-index: 60;
  width: min(86vw, 300px);
  transform: translateX(-102%);
  transition: transform .22s ease;
  background: var(--surface);
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  overflow-y: auto; scrollbar-width: thin;
}
.mb.is-drawer .mb-side { transform: none; box-shadow: var(--shadow-2); }
.mb-scrim { position: fixed; inset: 0; z-index: 55; background: var(--scrim); }
@media (min-width: 1000px) {
  .mb-side { position: sticky; top: 0; height: 100vh; height: 100dvh; width: auto; transform: none; transition: none; padding-left: 0; }
  .mb-scrim { display: none; }
}

/* 黒板の看板（木の枠とチョーク受け）。押すとホームへ */
.kokuban {
  position: relative; display: block; margin: 14px 14px 8px; padding: 12px 12px 16px;
  color: var(--on-board); text-align: center; text-decoration: none;
  background: radial-gradient(120% 90% at 30% 20%, color-mix(in srgb, var(--board) 82%, #fff) 0%, var(--board) 60%);
  border: 5px solid var(--frame); border-radius: 6px;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18), var(--shadow-1);
}
.kokuban:hover { color: var(--on-board); filter: brightness(1.05); }
.kokuban .kokuban-name { font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: .12em; line-height: 1.25; display: block; text-shadow: 0 0 1px rgba(255, 255, 255, .35); }
.kokuban .kokuban-sub { display: block; font-size: 12px; letter-spacing: .18em; opacity: .85; margin-top: 2px; }
.kokuban .kokuban-tray { position: absolute; left: -5px; right: -5px; bottom: -11px; height: 7px; background: var(--frame); border-radius: 2px; display: flex; justify-content: flex-end; align-items: flex-start; gap: 5px; padding: 0 14px; }
.kokuban .kokuban-tray i { display: block; width: 14px; height: 4px; margin-top: -3px; border-radius: 2px; background: #f7f4ec; }
.kokuban .kokuban-tray i.c2 { width: 10px; background: #f3cf4a; }
.kokuban .kokuban-tray i.c3 { width: 12px; background: #ef8fa6; }

.mb-nav { padding: 18px 10px 10px; display: grid; gap: 10px; }
.mb-nav-group > .mb-nav-label { font-size: 12px; letter-spacing: .14em; color: var(--ink-3); padding: 0 10px 2px; font-weight: 700; }
.mb-nav-item {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 40px; padding: 0 10px; border-radius: 8px; border: 0; background: transparent;
  color: var(--ink-2); font: inherit; font-size: 15px; font-weight: 500; text-align: left; cursor: pointer; text-decoration: none;
}
.mb-nav-item svg { flex: none; width: 18px; height: 18px; color: var(--ink-3); }
.mb-nav-item:hover { background: var(--surface-2); color: var(--ink); }
.mb-nav-item[aria-current="page"] { background: var(--gosu-wash); color: var(--ink); font-weight: 700; }
.mb-nav-item[aria-current="page"] svg { color: var(--gosu); }
.mb-side-foot { margin-top: auto; padding: 8px 12px 10px 20px; font-size: 12.5px; color: var(--ink-3); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; }
.mb-side-foot .mb-save-where { flex-basis: 100%; }
.mb-theme { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink-2); font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap; }
.mb-theme:hover { background: var(--surface-2); color: var(--ink); }
.mb-theme svg { width: 15px; height: 15px; }
/* 背の低い画面（Chromebook など）：メニューを1画面に収める。グループの見出しは細い線に、看板は小さく */
@media (min-width: 1000px) and (max-height: 760px) {
  .kokuban { margin: 10px 14px 6px; padding: 8px 12px 12px; }
  .kokuban .kokuban-name { font-size: 19px; }
  .kokuban .kokuban-sub { display: none; }
  .mb-nav { padding: 12px 10px 8px; gap: 0; }
  .mb-nav-group + .mb-nav-group { border-top: 1px solid var(--line); margin-top: 5px; padding-top: 5px; }
  .mb-nav-group > .mb-nav-label { display: none; }
  .mb-side-foot .mb-save-where { display: none; }
}
.mb-save-state { display: flex; align-items: center; gap: 6px; }
.mb-save-state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.mb-save-state[data-mode="db"]::before { background: var(--ok); }
.mb-save-state[data-mode="local"]::before { background: var(--warn); }

.mb-main { min-width: 0; }
.mb-view {
  padding-left: var(--gutter-l); padding-right: var(--gutter-r);
  padding-block: 18px 72px;
  max-width: 1240px; margin: 0 auto;
}
.mb-view.is-wide { max-width: none; padding-block: 0; padding-left: 0; padding-right: 0; }

/* ───────── アプリの見出し ───────── */
.app-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; margin-bottom: 14px; }
.app-head .app-title { min-width: 0; flex: 1 1 320px; }
.app-head h1 { font-family: var(--font-display); font-weight: 600; font-size: clamp(23px, 3vw, 29px); letter-spacing: .04em; display: flex; align-items: center; gap: 12px; }
/* 見出しの頭に、チョーク1本 */
.app-head h1::before {
  content: ""; flex: none; width: 20px; height: 7px; border-radius: 4px;
  background: linear-gradient(90deg, var(--shu) 0 72%, color-mix(in srgb, var(--shu) 55%, var(--surface)) 72%);
  transform: rotate(-24deg);
}
.app-head .app-desc { color: var(--ink-2); margin-top: 2px; font-size: 14.5px; max-width: 46em; }
.app-head .app-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
@media (max-width: 640px) { .app-head h1 { font-size: 21px; gap: 10px; } }

/* ───────── 部品 ───────── */
.btn {
  --btn-bg: var(--surface); --btn-fg: var(--ink); --btn-line: var(--line-strong);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 7px 15px;
  border: 1px solid var(--btn-line); border-radius: 9px;
  background: var(--btn-bg); color: var(--btn-fg);
  font: inherit; font-size: 14px; font-weight: 500; line-height: 1.2;
  cursor: pointer; text-decoration: none; white-space: nowrap;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { --btn-bg: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; transform: none; }
.btn svg { width: 17px; height: 17px; flex: none; }
.btn.primary { --btn-bg: var(--gosu); --btn-fg: var(--on-gosu); --btn-line: var(--gosu); font-weight: 700; }
.btn.primary:hover { --btn-bg: var(--gosu-hi); --btn-line: var(--gosu-hi); }
.btn.accent { --btn-bg: var(--shu); --btn-fg: var(--on-shu); --btn-line: var(--shu); font-weight: 700; }
.btn.accent:hover { filter: brightness(1.06); }
.btn.ghost { --btn-bg: transparent; --btn-line: transparent; color: var(--ink-2); }
.btn.ghost:hover { --btn-bg: var(--surface-2); color: var(--ink); }
.btn.danger { --btn-fg: var(--bad); --btn-line: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.danger:hover { --btn-bg: var(--bad-wash); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 13.5px; border-radius: 8px; }
.btn.icon { padding: 0; width: 40px; min-width: 40px; }
.btn.icon.sm { width: 34px; min-width: 34px; }
.btn.ai { --btn-line: color-mix(in srgb, var(--gosu) 40%, var(--line)); color: var(--gosu); }
.btn.ai svg { color: var(--gosu); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
/* 指で押す画面では、小さいボタンも 36px 以上に */
@media (pointer: coarse) {
  .btn { min-height: 44px; }
  .btn.icon { width: 44px; min-width: 44px; }
  .btn.sm { min-height: 40px; }
  .btn.icon.sm { width: 40px; min-width: 40px; }
  .seg > button { min-height: 40px; }
  input[type="checkbox"], input[type="radio"] { width: 22px; height: 22px; }
}

label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
input[type="text"], input[type="email"], input[type="tel"], input[type="url"], input[type="number"],
input[type="date"], input[type="time"], input[type="datetime-local"], input[type="month"], input[type="search"],
input[type="password"], input:not([type]), select, textarea {
  width: 100%; min-width: 0;
  min-height: 40px; padding: 7px 10px;
  border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface); color: var(--ink);
  font: inherit; font-size: 15px; line-height: 1.5;
}
textarea { min-height: 84px; resize: vertical; }
select { padding-right: 28px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--gosu); width: 19px; height: 19px; flex: none; }
input[type="color"] { width: 44px; height: 36px; padding: 2px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); cursor: pointer; }
input[type="range"] { accent-color: var(--gosu); width: 100%; }
::placeholder { color: var(--ink-3); opacity: 1; }

.field { display: grid; gap: 4px; min-width: 0; }
.hint, .field .hint { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.field.inline { grid-template-columns: auto 1fr; align-items: center; gap: 10px; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink); cursor: pointer; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.card.pad-lg { padding: 22px; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.card-h h2, .card-h h3 { font-size: 16px; font-weight: 700; }
.card-h .spacer { flex: 1; }
.section-title { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: .03em; margin: 26px 0 12px; }

.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack.tight { gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; min-width: 0; }
.row.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.grid { display: grid; gap: 14px; min-width: 0; }
.grid > * { min-width: 0; }
.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); }
.split { display: grid; gap: 16px; grid-template-columns: 1fr; min-width: 0; }
@media (min-width: 900px) { .split { grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); } .split.wide-side { grid-template-columns: minmax(300px, 440px) minmax(0, 1fr); } }

.muted { color: var(--ink-3); }
.ink-2 { color: var(--ink-2); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: .92em; }
.display { font-family: var(--font-display); }
.nowrap { white-space: nowrap; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.divider { height: 1px; background: var(--line); border: 0; margin: 4px 0; }

/* 小さな札 */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 9px; border-radius: 999px; min-height: 22px;
  font-size: 12px; font-weight: 500; line-height: 1.6;
  background: var(--surface-2); color: var(--ink-2); border: 1px solid transparent; white-space: nowrap;
}
.chip.sample { background: var(--gosu-wash); color: var(--gosu); font-weight: 700; letter-spacing: .04em; }
.chip.blue { background: var(--gosu-wash); color: var(--gosu); }
.chip.shu { background: var(--shu-wash); color: var(--shu); font-weight: 700; }
.chip.ok { background: var(--ok-wash); color: var(--ok); }
.chip.warn { background: var(--warn-wash); color: var(--warn); }
.chip.bad { background: var(--bad-wash); color: var(--bad); }
.chip.line { background: transparent; border-color: var(--line-strong); }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
button.chip { cursor: pointer; font: inherit; font-size: 12px; }
button.chip[aria-pressed="true"] { background: var(--gosu); color: var(--on-gosu); }

/* サンプル表示中の帯 */
.sample-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 6px 8px 6px 10px; margin-bottom: 12px;
  border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 13.5px; line-height: 1.55; color: var(--ink-2);
}
.sample-bar > span { flex: 1 1 260px; min-width: 0; }
.sample-bar strong { display: inline-block; margin-right: 6px; padding: 0 9px; border-radius: 999px; background: var(--gosu-wash); color: var(--gosu); font-size: 12.5px; letter-spacing: .04em; }
.sample-bar .btn-row { margin-left: auto; }
html.is-demo .sample-bar { display: none; }

/* 切り替えボタン（セグメント） */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); }
.seg > button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; background: transparent; color: var(--ink-2); font: inherit; font-size: 13.5px; padding: 5px 12px; border-radius: 6px; cursor: pointer; min-height: 34px; white-space: nowrap; }
.seg > button svg { flex: none; }
.seg > button:hover { color: var(--ink); }
.seg > button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow-1); }

/* タブ */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs > button { border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink-2); padding: 9px 14px; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs > button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gosu); font-weight: 700; }

/* 表 */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tbl th, table.tbl td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.tbl th { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .04em; background: var(--surface-2); white-space: nowrap; }
table.tbl tr:last-child td { border-bottom: 0; }
table.tbl td.r, table.tbl th.r { text-align: right; font-variant-numeric: tabular-nums; }
table.tbl tbody tr:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }

/* 数字の札（KPI） */
.kpi { display: grid; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.kpi .kpi-label { font-size: 12.5px; color: var(--ink-3); font-weight: 500; }
.kpi .kpi-value { font-size: 26px; font-weight: 700; letter-spacing: .01em; line-height: 1.25; }
.kpi .kpi-sub { font-size: 12.5px; color: var(--ink-2); }
.meter { height: 8px; border-radius: 99px; background: var(--gosu-wash); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; background: var(--gosu); }
.meter.ok > i { background: var(--ok); }
.meter.warn > i { background: var(--warn); }

/* 何もないとき */
.empty { text-align: center; padding: 32px 18px; border: 1px dashed var(--line-strong); border-radius: var(--r); color: var(--ink-2); background: var(--surface); }
.empty .empty-title { font-weight: 700; color: var(--ink); margin-bottom: 4px; font-size: 15px; }
.empty .btn-row { justify-content: center; margin-top: 12px; }

/* 道具の帯（アプリ上部の操作列） */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; }
.toolbar .spacer { flex: 1; }

/* 一覧 */
.list { display: grid; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; }
.list > .list-item { display: flex; gap: 12px; align-items: flex-start; padding: 11px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.list > .list-item:last-child { border-bottom: 0; }
.list > button.list-item { width: 100%; background: transparent; border-left: 0; border-right: 0; border-top: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.list > button.list-item:hover { background: var(--surface-2); }
.list > .list-item[aria-selected="true"] { background: var(--gosu-wash); }

/* ダイアログ */
.modal-back { position: fixed; inset: 0; z-index: 100; background: var(--scrim); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gutter-r) max(16px, env(safe-area-inset-bottom, 0px)) var(--gutter-l); animation: mb-fade .14s ease-out; }
.modal {
  width: min(560px, 100%); max-height: calc(100dvh - 32px); overflow: auto;
  background: var(--surface); color: var(--ink);
  border-radius: var(--r-lg); border: 1px solid var(--line); box-shadow: var(--shadow-2);
  display: flex; flex-direction: column;
}
.modal.wide { width: min(880px, 100%); }
.modal:focus { outline: none; }
.modal-h { display: flex; align-items: center; gap: 10px; padding: 16px 18px 4px; }
.modal-h h2 { font-size: 17px; font-weight: 700; flex: 1; }
.modal-b { padding: 10px 18px 6px; display: grid; gap: 12px; }
.modal-f { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; }
@keyframes mb-fade { from { opacity: 0; } to { opacity: 1; } }

/* 知らせ */
.mb-toasts { position: fixed; z-index: 170; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; width: min(440px, calc(100% - 32px)); pointer-events: none; }
.toast { pointer-events: auto; background: var(--ink); color: var(--surface); padding: 10px 14px; border-radius: 10px; box-shadow: var(--shadow-2); font-size: 14px; display: flex; gap: 10px; align-items: center; animation: mb-rise .18s ease-out; }
.toast.bad { background: var(--bad); color: #fff; }
.toast .btn { --btn-bg: transparent; --btn-fg: inherit; --btn-line: currentColor; min-height: 28px; padding: 3px 10px; font-size: 13px; margin-left: auto; }
@keyframes mb-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 使い方などの折りたたみ */
details.help { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 10px 14px; font-size: 14px; }
details.help > summary { cursor: pointer; font-weight: 700; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 8px; }
details.help > summary::-webkit-details-marker { display: none; }
details.help > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.help[open] > summary::before { transform: rotate(45deg); }
details.help ol, details.help ul { margin: 8px 0 0; padding-left: 1.4em; color: var(--ink-2); }
details.help li + li { margin-top: 4px; }

/* 画面によって出し分ける部品 */
html:not(.has-ai) .ai-only { display: none !important; }
html.is-artifact .local-only { display: none !important; }
html:not(.is-artifact) .artifact-only { display: none !important; }
kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface-2); }

/* グラフ */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
.chart .chart-legend span { display: inline-flex; align-items: center; gap: 6px; }
.chart .chart-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.chart .chart-legend i.line { height: 2px; width: 14px; border-radius: 2px; }
.chart .chart-tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow-2); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; min-width: 120px; }
.chart .chart-tip .tip-h { color: var(--ink-3); margin-bottom: 3px; }
.chart .chart-tip .tip-row { display: flex; align-items: center; gap: 8px; }
.chart .chart-tip .tip-row b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 10px; }
.chart .chart-tip .tip-row i { width: 12px; height: 2px; border-radius: 2px; display: inline-block; }
.chart .chart-table-toggle { margin-top: 6px; }
.chart text { fill: var(--ink-3); font-size: 12px; font-family: var(--font-body); }

/* ───────── 使い方のデモ（js/demo.js） ───────── */
.app-title-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.demo-btn {
  display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 4px 14px 4px 5px;
  border-radius: 999px; border: 1px solid color-mix(in srgb, var(--demo) 70%, var(--line));
  background: var(--demo-wash); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; white-space: nowrap;
  transition: background .12s, transform .06s;
}
.demo-btn svg { box-sizing: content-box; width: 12px; height: 12px; padding: 6px; border-radius: 50%; background: var(--demo); color: var(--on-demo); }
.demo-btn:hover { background: color-mix(in srgb, var(--demo) 30%, var(--demo-wash)); }
.demo-btn:active { transform: translateY(1px); }
@media (pointer: coarse) { .demo-btn { min-height: 40px; } }

.demo-ribbon {
  position: sticky; top: 0; z-index: 165; /* 使い方の吹き出し（160）より上：説明の途中でも「デモを終わる」を押せる */
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px;
  padding: 8px var(--gutter-r) 8px var(--gutter-l);
  background: var(--demo); color: var(--on-demo); font-size: 13.5px; line-height: 1.5;
  box-shadow: 0 2px 8px rgba(40, 30, 0, .18);
}
@media (max-width: 999px) { .demo-ribbon { top: calc(var(--top-h) + env(safe-area-inset-top, 0px)); } .mb.is-drawer .demo-ribbon { z-index: 45; } }
.demo-ribbon-tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: var(--on-demo); color: var(--demo); font-weight: 700; font-size: 12.5px; letter-spacing: .06em; }
.demo-ribbon-text { min-width: 0; }
.demo-ribbon-text b { font-weight: 700; }
.demo-ribbon-btns { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.demo-ribbon-btns button { display: inline-flex; align-items: center; gap: 5px; min-height: 34px; padding: 4px 12px; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; border: 1.5px solid var(--on-demo); background: transparent; color: var(--on-demo); }
.demo-ribbon-btns .demo-ribbon-end { background: var(--on-demo); color: var(--demo); }
.demo-ribbon-btns button:hover { filter: brightness(1.08); }
@media (pointer: coarse) { .demo-ribbon-btns button { min-height: 40px; } }
@media (max-width: 640px) {
  .demo-ribbon { flex-wrap: nowrap; gap: 8px; padding-top: 6px; padding-bottom: 6px; font-size: 12.5px; }
  .demo-ribbon-long { display: none; }
  .demo-ribbon-text { flex: 1 1 auto; line-height: 1.35; }
  .demo-ribbon-btns button { min-height: 36px; padding: 4px 10px; font-size: 12.5px; }
  .demo-ribbon-tag { padding: 2px 8px; }
  .tour-card.docked .tour-auto span, .tour-card.docked .tour-back span { display: none; }
  .tour-card.docked .tour-foot { flex-wrap: nowrap; }
}
.mb-save-state[data-mode="demo"]::before { background: var(--demo); }

.tour { position: fixed; inset: 0; z-index: 160; pointer-events: none; }
.tour-block { position: fixed; pointer-events: auto; background: transparent; }
.tour.no-spot .tour-block:first-child { background: rgba(8, 16, 12, .45); }
.tour-spot {
  position: fixed; pointer-events: none; border-radius: 10px;
  box-shadow: 0 0 0 3px var(--demo), 0 0 0 9999px rgba(8, 16, 12, .45);
  transition: left .28s ease, top .28s ease, width .28s ease, height .28s ease;
}
.tour-spot::after { content: ""; position: absolute; inset: -3px; border-radius: 12px; box-shadow: 0 0 0 0 color-mix(in srgb, var(--demo) 70%, transparent); animation: tour-pulse 1.8s ease-out infinite; }
@keyframes tour-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--demo) 70%, transparent); } 70%, 100% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--demo) 0%, transparent); } }
.tour-card {
  position: fixed; pointer-events: auto; width: min(380px, calc(100vw - 24px));
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-top: 4px solid var(--demo);
  border-radius: 14px; box-shadow: var(--shadow-2); padding: 12px 16px 14px;
  transition: left .28s ease, top .28s ease;
}
.tour-card.docked { left: 12px !important; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); top: auto !important; width: auto; max-height: 46vh; overflow: auto; }
.tour-card.nudge { animation: tour-nudge .32s ease; }
@keyframes tour-nudge { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.tour-top { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.tour-count { font-size: 12.5px; color: var(--ink-3); font-weight: 700; white-space: nowrap; }
.tour-count b { color: var(--ink); }
.tour-dots { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.tour-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line-strong); }
.tour-dots i.done { background: color-mix(in srgb, var(--demo) 60%, var(--line-strong)); }
.tour-dots i.now { background: var(--demo); box-shadow: 0 0 0 2px color-mix(in srgb, var(--demo) 35%, transparent); width: 16px; border-radius: 4px; }
.tour-x { margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; border: 0; background: transparent; color: var(--ink-3); cursor: pointer; }
.tour-x:hover { background: var(--surface-2); color: var(--ink); }
.tour-title { font-size: 17px; font-weight: 700; line-height: 1.45; }
.tour-text { margin-top: 4px; font-size: 15px; color: var(--ink-2); line-height: 1.7; }
.tour-note, .tour-hint { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); }
.tour-bar { margin-top: 10px; height: 4px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.tour-bar i { display: block; height: 100%; width: 100%; background: var(--demo); transform-origin: left; animation: tour-bar linear forwards; }
@keyframes tour-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tour-foot { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.tour-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 6px 14px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tour-btn:hover { background: var(--surface-2); }
.tour-btn:disabled { opacity: .45; cursor: default; }
.tour-btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); font-weight: 500; padding-inline: 10px; }
.tour-btn.ghost:hover { background: var(--surface-2); }
.tour-btn.primary { background: var(--demo); border-color: var(--demo); color: var(--on-demo); }
.tour-btn.primary:hover { filter: brightness(1.05); }
.tour-auto[aria-pressed="true"] { color: var(--ink); background: var(--demo-wash); }
.tour-finger {
  position: fixed; left: -21px; top: -21px; width: 42px; height: 42px; border-radius: 50%; pointer-events: none; opacity: 0;
  background: rgba(255, 255, 255, .55); border: 3px solid rgba(20, 30, 25, .78); box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
  transition: transform .5s cubic-bezier(.3, .7, .2, 1), opacity .2s; z-index: 2;
}
.tour-finger.on { opacity: 1; }
.tour-finger::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid var(--demo); opacity: 0; }
.tour-finger.tap { animation: tour-press .32s ease; }
.tour-finger.tap::after { animation: tour-ripple .5s ease-out; }
@keyframes tour-press { 50% { scale: .82; } }
@keyframes tour-ripple { from { opacity: 1; transform: scale(.6); } to { opacity: 0; transform: scale(1.9); } }
/* 説明のあいだ：知らせは上に出す（下の吹き出しのボタンに重ならないように）。スマホは、ページの下の部品も吹き出しの上まで送れるように余白を足す */
html.is-touring .mb-toasts { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (max-width: 999px) { html.is-touring .mb-toasts { top: calc(env(safe-area-inset-top, 0px) + var(--top-h) + 52px); } }
@media (max-width: 639px) { html.is-touring .mb-view { padding-bottom: 52vh; } }
/* ダイアログが開いているときは、帯をダイアログの下に（題名が隠れないように） */
body:has(.modal-back) .demo-ribbon { z-index: 45; }
@media print { .demo-ribbon, .tour, .demo-btn { display: none !important; } }

/* 印刷（手元のブラウザで開いたときだけ使える） */
@media print {
  .mb-side, .mb-top, .app-actions, .toolbar, .sample-bar, .no-print { display: none !important; }
  .mb { display: block; }
  .mb-view { padding: 0; max-width: none; }
  body { background: #fff; }
}

<script>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

  Kit.modal = ({ title, body, actions, wide, onClose, dismissable = true, autofocus }) => {

      const i = modalStack.indexOf(back); if (i >= 0) modalStack.splice(i, 1);
      if (prevFocus && prevFocus.focus) try { prevFocus.focus(); } catch (e) { /* noop */ }
      if (onClose) onClose(v);
    };

    if (title) box.append(h('div', { class: 'modal-h' }, h('h2', null, title), dismissable ? Kit.btn('', () => close(undefined), { icon: 'close', title: '閉じる', kind: 'ghost', sm: true }) : null));
    const b = h('div', { class: 'modal-b' });
    if (body != null) add(b, [typeof body === 'string' ? h('p', null, body) : body]);
    box.append(b);
    if (actions && actions.length) {

    document.addEventListener('keydown', onKey, true);
    modalStack.push(back);
    document.body.append(back);
    box.tabIndex = -1;
    setTimeout(() => {
      const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
      const f = autofocus === 'input' && !coarse ? b.querySelector('input, textarea, select') : null;
      (f || box).focus({ preventScroll: true });

    return { el: box, body: b, close };
  };

    const input = multiline ? h('textarea', { placeholder, rows: 5 }) : h('input', { type: 'text', placeholder });

  /* ───────── 保存（Kit.store） ─────────
     ひとつもの（doc）  … get(key) / set(key, value)              例：profile, site, plan

     サンプル … 初めて開いたときは sample を見せ、最初に書きかえた時点で保存する（勝手には書かない）。 */
  const META = 'meta';
  const known = { docs: new Set(['profile', 'meta']), colls: new Set(['images']) };
  const cache = { docs: new Map(), colls: new Map() };
  const virtual = new Map(); // サンプルを見せているだけのコレクション

  const listeners = new Map();
  let backend = null;
  let meta = { samplesOff: false, touched: {} };

  function emit(key) {
    for (const k of [key, '*']) {
      const set = listeners.get(k);
      if (set) for (const fn of [...set]) { try { fn(key); } catch (e) { console.error(e); } }
    }
  }

  // 手元（localStorage）。使えないときはメモリだけ（閉じると消える）
  function localBackend() {
    const P = 'sensei:';
    const mem = new Map();
    let ok = true;
    try { localStorage.setItem(P + '__t', '1'); localStorage.removeItem(P + '__t'); } catch (e) { ok = false; }
    let warned = false;
    const read = (k) => { if (!ok) return clone(mem.get(k)); try { const s = localStorage.getItem(P + k); return s == null ? undefined : JSON.parse(s); } catch (e) { return clone(mem.get(k)); } };
    const write = (k, v) => {
      if (!ok) { mem.set(k, clone(v)); return; }
      try { if (v === undefined) localStorage.removeItem(P + k); else localStorage.setItem(P + k, JSON.stringify(v)); }
      catch (e) {
        mem.set(k, clone(v));
        if (!warned) { warned = true; Kit.toast('このブラウザの保存容量がいっぱいです。古い記録を消すか、ホームからバックアップを書き出してください', { type: 'bad', ms: 8000 }); }
      }
    };
    return {
      mode: ok ? 'local' : 'memory',
      async getDoc(key) { return read('d:' + key); },
      async setDoc(key, v) { write('d:' + key, v); },
      async delDoc(key) { write('d:' + key, undefined); },
      async listColl(name) { const o = read('c:' + name) || {}; return Object.values(o); },
      async putItem(name, item) { const o = read('c:' + name) || {}; o[item.id] = item; write('c:' + name, o); },
      async delItem(name, id) { const o = read('c:' + name) || {}; delete o[id]; write('c:' + name, o); },
      async clearColl(name) { write('c:' + name, undefined); },
      watch() {
        window.addEventListener('storage', (e) => {
          if (!e.key || !e.key.startsWith(P) || store.demo) return;
          const rest = e.key.slice(P.length);
          if (rest.startsWith('d:')) { const key = rest.slice(2); cache.docs.delete(key); if (key === META) meta = Object.assign({ samplesOff: false, touched: {} }, read('d:' + META)); emit('doc:' + key); }
          else if (rest.startsWith('c:')) { const name = rest.slice(2); cache.colls.delete(name); emit('coll:' + name); }
        });
      },
    };
  }

  // Artifact の db。ひとつもの → kit/<key> に {v}、ならぶもの → kit_<name>/<id>
  function dbBackend(db) {
    const retry = async (fn) => { try { return await fn(); } catch (e) { if (e && e.code === 'unavailable') { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); } throw e; } };
    return {
      mode: 'db',
      async getDoc(key) { const s = await retry(() => db.doc('kit/' + key).get()); return s.exists ? clone((s.data() || {}).v) : undefined; },
      async setDoc(key, v) { await db.doc('kit/' + key).set({ v: v === undefined ? null : v, at: Date.now() }); },
      async delDoc(key) { await db.doc('kit/' + key).delete(); },
      async listColl(name) { const s = await retry(() => db.collection('kit_' + name).limit(1000).get()); return s.docs.map((d) => clone(d.data())); },
      async putItem(name, item) { await db.collection('kit_' + name).doc(item.id).set(item); },
      async delItem(name, id) { await db.collection('kit_' + name).doc(id).delete(); },
      async clearColl(name) { const s = await db.collection('kit_' + name).limit(1000).get(); for (const d of s.docs) await db.collection('kit_' + name).doc(d.id).delete(); },
      watch() { /* 開くたびに読み直す。同時に2台で編集するときは、あとから保存したほうが残る */ },
    };
  }

  // 書き込みの順番待ち：同じものへの書き込みは1つずつ、最後の値だけ
  const jobs = new Map();
  let failedOnce = false;
  function queue(key, fn, delay = 350) {
    let j = jobs.get(key);
    if (!j) { j = { fn: null, timer: 0, running: null }; jobs.set(key, j); }
    j.fn = fn;
    clearTimeout(j.timer);
    j.timer = setTimeout(() => run(key), delay);
    saveState('saving');
  }
  async function run(key) {
    const j = jobs.get(key);
    if (!j || j.running) return;
    clearTimeout(j.timer);
    j.running = (async () => {
      while (j.fn) {
        const fn = j.fn; j.fn = null;
        try { await fn(); }
        catch (e) {
          console.error('保存に失敗', key, e);
          if (!failedOnce) { failedOnce = true; Kit.toast(saveError(e), { type: 'bad', ms: 8000 }); setTimeout(() => (failedOnce = false), 15000); }
          saveState('error');
        }
      }
    })();
    await j.running;
    j.running = null;
    if (![...jobs.values()].some((x) => x.fn || x.running)) saveState('saved');
  }
  function saveError(e) {
    const c = e && e.code;
    if (c === 'quota_exceeded') return '保存できる量の上限に達しました。古いデータや画像を消してください';
    if (c === 'invalid_argument') return '保存できませんでした（大きすぎるデータか、保存の権限がありません）';
    if (c === 'revoked') return '保存の権限がなくなりました。ページを開き直してください';
    return '保存に失敗しました。通信を確かめて、もう一度操作してください';
  }

  const store = (Kit.store = {
    mode: 'local',
    known,
    ready: null,
    declare(kind, names) { for (const n of [].concat(names || [])) known[kind].add(n); },
    on(key, fn) { if (!listeners.has(key)) listeners.set(key, new Set()); listeners.get(key).add(fn); return () => listeners.get(key).delete(fn); },

    async init() {
      if (store.ready) return store.ready;
      store.ready = (async () => {
        backend = await chooseBackend();
        store.mode = backend.mode;
        try { meta = Object.assign({ samplesOff: false, touched: {} }, await backend.getDoc(META)); } catch (e) { console.error(e); }
        backend.watch();
      })();
      return store.ready;
    },

    // サンプルの登録。アプリは読み込み時に Kit.store.sample('leads', [...]) としておくと、
    // ほかのアプリ（ホームなど）から読んでも同じサンプルが見える
    sample(name, value) { samples.set(name, value); },
    async get(key, o = {}) {
      await store.init();
      if (o.sample && !samples.has(key)) samples.set(key, o.sample);
      o = Object.assign({}, o, { sample: o.sample || samples.get(key) });
      if (!cache.docs.has(key)) {
        let v;
        try { v = await backend.getDoc(key); } catch (e) { console.error(e); }
        cache.docs.set(key, v === null ? undefined : v);
      }
      const v = cache.docs.get(key);
      if (v !== undefined) return clone(v);
      if (o.sample && !meta.samplesOff) return Object.assign(clone(o.sample), { _sample: true });
      return clone(o.blank);
    },
    async set(key, value) {
      await store.init();
      const v = clone(value);
      if (v && typeof v === 'object' && !Array.isArray(v)) delete v._sample;
      cache.docs.set(key, v);
      known.docs.add(key);
      queue('d:' + key, () => backend.setDoc(key, v));
      emit('doc:' + key);
      return clone(v);
    },
    async del(key) {
      await store.init();
      cache.docs.set(key, undefined);
      queue('d:' + key, () => backend.delDoc(key));
      emit('doc:' + key);
    },
    isSample(value) { return !!(value && value._sample); },

    async list(name, o = {}) {
      await store.init();
      known.colls.add(name);
      if (o.sample && !samples.has(name)) samples.set(name, o.sample);
      o = Object.assign({}, o, { sample: o.sample || samples.get(name) });
      if (!cache.colls.has(name)) {
        let items = [];
        try { items = await backend.listColl(name); } catch (e) { console.error(e); }
        items.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
        cache.colls.set(name, new Map(items.map((x) => [x.id, x])));
      }
      const m = cache.colls.get(name);
      if (m.size === 0 && o.sample && !meta.samplesOff && !meta.touched[name]) {
        if (!virtual.has(name)) {
          const now = new Date().toISOString();
          virtual.set(name, o.sample.map((x) => Object.assign({ id: Kit.uid('s'), createdAt: now, updatedAt: now }, clone(x), { sample: true })));
        }
        return clone(virtual.get(name));
      }
      return clone([...m.values()]);
    },
    isVirtual(name) { return virtual.has(name) && !meta.touched[name]; },
    async getItem(name, id) { const all = await store.list(name); return all.find((x) => x.id === id); },

    // サンプルを見せていたコレクションに初めて書くとき、見せていた分も保存する
    async _materialize(name) {
      if (!virtual.has(name) || meta.touched[name]) return;
      const items = virtual.get(name);
      virtual.delete(name);
      const m = cache.colls.get(name) || new Map();
      for (const it of items) { m.set(it.id, it); queue('c:' + name + ':' + it.id, () => backend.putItem(name, it), 100); }
      cache.colls.set(name, m);
      await touch(name);
    },
    async put(name, item) {
      await store.list(name);
      await store._materialize(name);
      const now = new Date().toISOString();
      const it = clone(item);
      if (!it.id) it.id = Kit.uid();
      if (!it.createdAt) it.createdAt = now;
      it.updatedAt = now;
      cache.colls.get(name).set(it.id, it);
      if (!meta.touched[name]) await touch(name);
      queue('c:' + name + ':' + it.id, () => backend.putItem(name, it), 200);
      emit('coll:' + name);
      return clone(it);
    },
    async putMany(name, items) { const out = []; for (const it of items) out.push(await store.put(name, it)); return out; },
    async remove(name, id) {
      await store.list(name);
      await store._materialize(name);
      cache.colls.get(name).delete(id);
      if (!meta.touched[name]) await touch(name);
      queue('c:' + name + ':' + id, () => backend.delItem(name, id), 100);
      emit('coll:' + name);
    },
    async clear(name) {
      await store.list(name);
      virtual.delete(name);
      const m = cache.colls.get(name);
      const ids = [...m.keys()];
      m.clear();
      await touch(name);
      for (const id of ids) queue('c:' + name + ':' + id, () => backend.delItem(name, id), 100);
      emit('coll:' + name);
    },

    // サンプルを片付ける：サンプルの行を消し、まだ保存していない画面は空から始める
    async samplesOff() {
      await store.init();
      meta.samplesOff = true;
      for (const name of known.colls) {
        const items = await store.list(name);
        virtual.delete(name);
        for (const it of items) if (it.sample) await store.remove(name, it.id);
        emit('coll:' + name);
      }
      queue('d:' + META, () => backend.setDoc(META, clone(meta)));
      for (const key of known.docs) emit('doc:' + key);
    },
    samplesShown() { return !meta.samplesOff; },

    // 全部をひとつのJSONに（バックアップ）
    async exportAll() {
      await store.init();
      const out = { app: 'sensei-kit', version: 1, exportedAt: new Date().toISOString(), docs: {}, colls: {} };
      for (const key of known.docs) { if (key === META) continue; const v = cache.docs.has(key) ? cache.docs.get(key) : await backend.getDoc(key).catch(() => undefined); if (v !== undefined && v !== null) out.docs[key] = clone(v); }
      for (const name of known.colls) { await store.list(name); if (store.isVirtual(name)) continue; out.colls[name] = clone([...cache.colls.get(name).values()]); }
      return out;
    },
    async importAll(data) {
      if (!data || data.app !== 'sensei-kit') throw new Error('先生の道具箱のバックアップではありません');
      await store.init();
      for (const [key, v] of Object.entries(data.docs || {})) { if (key !== META) await store.set(key, v); }
      for (const [name, items] of Object.entries(data.colls || {})) {
        await store.clear(name);
        for (const it of items || []) { const m = cache.colls.get(name); m.set(it.id, it); queue('c:' + name + ':' + it.id, () => backend.putItem(name, it), 100); }
        emit('coll:' + name);
      }
      meta.samplesOff = true;
      queue('d:' + META, () => backend.setDoc(META, clone(meta)));
      await store.flush();
    },
    async wipeAll() {
      await store.init();
      for (const name of known.colls) await store.clear(name);
      for (const key of known.docs) if (key !== META) await store.del(key);
      meta = { samplesOff: false, touched: {} };
      virtual.clear();
      queue('d:' + META, () => backend.setDoc(META, clone(meta)));
      await store.flush();
      for (const name of known.colls) emit('coll:' + name);
    },
    async flush() { await Promise.all([...jobs.keys()].map((k) => run(k))); await Promise.all([...jobs.values()].map((j) => j.running).filter(Boolean)); },

    // デモ用の砂場：on のあいだは、架空のクラスの例だけが見えるメモリの中で動く。本物のデータは読まず・書かず、off で元どおり
    demo: false,
    async sandbox(on) {
      await store.init();
      on = !!on;
      if (on === store.demo) return;
      await store.flush();                                   // 待っている書き込みを、いまの保存先に書き終えてから切りかえる
      if (on) {
        real = { backend, docs: cache.docs, colls: cache.colls, virtual: new Map(virtual), meta };
        backend = memoryBackend();
        cache.docs = new Map(); cache.colls = new Map();
        virtual.clear();
        meta = { samplesOff: false, touched: {} };
      } else {
        backend = real.backend; cache.docs = real.docs; cache.colls = real.colls;
        virtual.clear(); for (const [k, v] of real.virtual) virtual.set(k, v);
        meta = real.meta;
        real = null;
      }
      store.demo = on;
      saveState('saved');
      for (const key of known.docs) emit('doc:' + key);
      for (const name of known.colls) emit('coll:' + name);
    },
  });
  let real = null; // デモのあいだ、本物の保存先をあずかる

  function memoryBackend() {
    const docs = new Map(), colls = new Map();
    const coll = (n) => { if (!colls.has(n)) colls.set(n, new Map()); return colls.get(n); };
    return {
      mode: 'demo',
      async getDoc(key) { return clone(docs.get(key)); },
      async setDoc(key, v) { if (v === undefined) docs.delete(key); else docs.set(key, clone(v)); },
      async delDoc(key) { docs.delete(key); },
      async listColl(name) { return [...coll(name).values()].map(clone); },
      async putItem(name, item) { coll(name).set(item.id, clone(item)); },
      async delItem(name, id) { coll(name).delete(id); },
      async clearColl(name) { colls.delete(name); },
      watch() {},
    };
  }

  async function touch(name) {
    if (meta.touched[name]) return;
    meta.touched[name] = true;
    queue('d:' + META, () => backend.setDoc(META, clone(meta)));
  }

  async function chooseBackend() {
    if (!env.artifact) return localBackend();
    const [db, user] = await Promise.all([use('db'), use('user')]);
    if (!db) return localBackend();
    let canEdit = false;
    try { canEdit = user ? await user.canEdit() : false; } catch (e) { canEdit = false; }
    if (!canEdit) return localBackend(); // 持ち主と編集者だけがアカウントに保存。共有で見ている人は自分のブラウザに保存
    try { await db.doc('kit/' + META).get(); } catch (e) { return localBackend(); }
    return dbBackend(db);
  }

  /* ───────── 学校の設定（どのアプリからも使う） ─────────
     みせびらき の「事業プロフィール」のかわり。名簿（クラス）は名簿アプリが持つ。
     学校名・呼び名は画面とファイル名に出るだけ。空欄でも使える。 */
  // 年度（4月はじまり）
  Kit.schoolYear = (d = new Date()) => { const x = d instanceof Date ? d : Kit.parseYmd(d); return x.getMonth() >= 3 ? x.getFullYear() : x.getFullYear() - 1; };
  const LEVELS = [
    { value: 'es', label: '小学校' },
    { value: 'jhs', label: '中学校' },
    { value: 'hs', label: '高校' },
    { value: 'other', label: 'そのほか' },
  ];
  Kit.LEVELS = LEVELS;
  Kit.levelLabel = (v) => (LEVELS.find((x) => x.value === v) || LEVELS[1]).label;
  const PROFILE_SAMPLE = { teacher: 'かず先生', school: 'ひかり中学校（架空）', level: 'jhs', year: Kit.schoolYear(), terms: 3, subject: '数学' };
  const PROFILE_BLANK = { teacher: '', school: '', level: 'jhs', year: Kit.schoolYear(), terms: 3, subject: '' };
  Kit.PROFILE_SAMPLE = PROFILE_SAMPLE;
  const normProfile = (p) => {
    const o = Object.assign(clone(PROFILE_BLANK), p || {});
    if (!LEVELS.some((x) => x.value === o.level)) o.level = 'jhs';
    o.year = Number.isFinite(+o.year) && +o.year > 1990 && +o.year < 2200 ? Math.round(+o.year) : Kit.schoolYear();
    o.terms = +o.terms === 2 ? 2 : 3;
    return o;
  };

  Kit.profile = {
    async get() { const p = await store.get('profile', { sample: PROFILE_SAMPLE, blank: PROFILE_BLANK }); return Object.assign(normProfile(p), p && p._sample ? { _sample: true } : {}); },
    async set(p) { return store.set('profile', normProfile(p)); },
    // 学期の名前（3学期制なら 1学期〜3学期、2期制なら 前期・後期）
    termNames(p) { return p && +p.terms === 2 ? ['前期', '後期'] : ['1学期', '2学期', '3学期']; },
    // 編集ダイアログ。保存したら新しい設定で resolve（やめたら null）
    async edit() {
      const p = await Kit.profile.get();
      const f = {
        teacher: h('input', { type: 'text', placeholder: '例：かず先生', maxlength: 40 }),
        school: h('input', { type: 'text', placeholder: '空欄でも使えます', maxlength: 60 }),
        subject: h('input', { type: 'text', placeholder: '例：数学（担任だけなら空欄）', maxlength: 40 }),
        year: h('input', { type: 'number', min: 1990, max: 2199, step: 1, inputmode: 'numeric' }),
      };
      f.teacher.value = p.teacher || ''; f.school.value = p.school || ''; f.subject.value = p.subject || ''; f.year.value = String(p.year);
      let level = p.level, terms = p.terms;
      const body = h('div', { class: 'stack' },
        p._sample ? h('p', { class: 'small', style: { color: 'var(--shu)' } }, 'いまはサンプル（架空の学校）です。自分の学校に書きかえて保存してください。') : null,
        h('div', { class: 'grid cols-2' },
          Kit.field({ label: '呼び名', input: f.teacher, id: 'pf-teacher', hint: '画面のあいさつに出るだけです。' }),
          Kit.field({ label: '学校名（任意）', input: f.school, id: 'pf-school', hint: '印刷物の見出しに出ます。' })),
        Kit.field({ label: '校種', input: Kit.seg(LEVELS, level, (v) => { level = v; }, { label: '校種' }), hint: '係の例や、時間割の時限の数の目安が変わります。' }),
        h('div', { class: 'grid cols-2' },
          Kit.field({ label: '年度', input: f.year, id: 'pf-year', hint: '4月はじまり。' }),
          Kit.field({ label: '学期', input: Kit.seg([{ value: 3, label: '3学期制' }, { value: 2, label: '2期制（前期・後期）' }], terms, (v) => { terms = +v; }, { label: '学期' }) })),
        Kit.field({ label: '担当の教科（任意）', input: f.subject, id: 'pf-subject' }),
        h('p', { class: 'small muted' }, '名簿・成績のもとになる記録は、このブラウザの中だけに保存されます（外には送りません）。'));
      return new Promise((resolve) => {
        Kit.modal({
          title: '学校の設定', wide: true, body, onClose: (v) => resolve(v || null),
          actions: [{ label: 'やめる', kind: 'ghost', value: null }, {
            label: '保存する', kind: 'primary', onClick: async () => {
              const np = normProfile({ teacher: f.teacher.value.trim(), school: f.school.value.trim(), subject: f.subject.value.trim(), year: f.year.value, level, terms });
              await Kit.profile.set(np);
              Kit.toast('学校の設定を保存しました');
              return np;
            },
          }],
        });
      });
    },
  };

  /* ───────── 書き出し ───────── */
  const DL_EXT = ['gif', 'png', 'jpg', 'jpeg', 'webp', 'mp4', 'webm', 'mov', 'txt', 'json', 'md', 'docx', 'pptx', 'epub', 'csv', 'ttf', 'html', 'svg', 'pdf', 'xlsx', 'zip'];
  const MIME = { json: 'application/json', csv: 'text/csv', html: 'text/html', txt: 'text/plain', md: 'text/markdown', svg: 'image/svg+xml', png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', webp: 'image/webp', pdf: 'application/pdf', webm: 'video/webm', mp4: 'video/mp4', ics: 'text/calendar', zip: 'application/zip' };
  Kit.canDownload = (ext) => !env.artifact || DL_EXT.includes(String(ext).toLowerCase());
  Kit.download = async (filename, data, mime) => {
    const ext = (filename.split('.').pop() || '').toLowerCase();
    if (env.artifact) {
      const dl = await use('downloads');
      if (!dl) { Kit.toast('この画面ではファイルを保存できません', { type: 'bad' }); return false; }
      try { await dl.save({ filename, data }); return true; }
      catch (e) {
        const c = e && e.code;
        if (c === 'declined') return false;
        Kit.toast(c === 'rate_limited' ? '保存の確認が開いています。閉じてから、もう一度どうぞ' : c === 'rejected_extension' ? 'この形式のファイルは保存できません' : 'ファイルを保存できませんでした', { type: 'bad' });
        return false;
      }
    }
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime || MIME[ext] || 'application/octet-stream' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename, style: { display: 'none' } });
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    return true;
  };
  Kit.safeName = (s) => String(s || 'file').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 60);

  /* ───────── AI（Artifact の sample） ───────── */
  const AI_MSG = {
    not_granted: 'AI の利用が許可されていません（この画面の設定から許可できます）',
    sampling_disabled: 'このアカウントでは AI が使えません',
    rate_limited: '少し時間をおいてから、もう一度どうぞ',
    refused: 'この内容には AI が答えられませんでした。言い方を変えてみてください',
    invalid_json: 'うまく形にできませんでした。もう一度お試しください',
    prompt_too_large: '文章が長すぎます。短くしてから試してください',
    empty_completion: '答えが空でした。頼み方を変えてみてください',
    session_expired: 'ログインし直してください',
    unavailable: 'AI はこの画面では使えません',
  };
  const ai = (Kit.ai = {
    _ready: null,
    ready() {
      if (!ai._ready) ai._ready = use('sample').then((s) => { document.documentElement.classList.toggle('has-ai', !!s); return !!s; });
      return ai._ready;
    },
    message(code) { return AI_MSG[code] || 'AI との通信がうまくいきませんでした。もう一度どうぞ'; },
    // 文章で：await Kit.ai.ask('…', {onText}) / JSON で：await Kit.ai.ask('…', {json:true})
    async ask(prompt, o = {}) {
      const s = cap.sample || (await use('sample'));
      if (!s) throw { code: 'unavailable', message: AI_MSG.unavailable };
      const opts = {};
      if (o.onText) opts.onText = o.onText;
      if (o.signal) opts.signal = o.signal;
      if (o.tier) opts.modelTier = o.tier;
      if (o.cache !== undefined) opts.cache = o.cache;
      try { return o.json ? await s.json(prompt, opts) : (await s(prompt, opts)).text; }
      catch (e) { const code = (e && e.code) || 'upstream_error'; throw { code, message: code === 'cancelled' ? '' : ai.message(code), text: e && e.text }; }
    },
    // 学校の要約（プロンプトの前置きに使う）。学校名・生徒の名前は入れない
    async context() {
      const p = await Kit.profile.get();
      return ['【校種】' + Kit.levelLabel(p.level), p.subject ? '【担当の教科】' + p.subject : ''].filter(Boolean).join('\n');
    },
    // AI ボタン：使えない画面では出ない（.ai-only）。押している間は「考え中…」
    button(label, run, o = {}) {
      const b = Kit.btn(label, null, { kind: 'ai' + (o.kind ? ' ' + o.kind : ''), icon: 'sparkle', sm: o.sm, class: 'ai-only' });
      const span = b.querySelector('span');
      b.addEventListener('click', async () => {
        if (b.disabled) return;
        b.disabled = true;
        const old = span ? span.textContent : '';
        if (span) span.textContent = '考え中…';
        try { await run(); }
        catch (e) { if (e && e.code !== 'cancelled') Kit.toast((e && e.message) || ai.message(), { type: 'bad' }); }
        finally { b.disabled = false; if (span) span.textContent = old; }
      });
      return b;
    },
  });

  /* ───────── 画像 ───────── */
  Kit.img = {
    // ファイル → 小さくした dataURL（db の1件に入る大きさ。既定 180KB まで）
    async fromFile(file, o = {}) {
      const max = o.max || 1600, maxBytes = o.maxBytes || 180000;
      const src = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
      if (/svg/.test(file.type) && src.length <= maxBytes) return { dataUrl: src, w: 0, h: 0 };
      const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('画像を読み込めませんでした')); i.src = src; });
      const alpha = /png|webp|gif|svg/.test(file.type);
      let scale = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight));
      for (let round = 0; round < 7; round++) {
        const w = Math.max(1, Math.round(im.naturalWidth * scale)), hh = Math.max(1, Math.round(im.naturalHeight * scale));
        const c = h('canvas', { width: w, height: hh });
        const ctx = c.getContext('2d');
        if (!alpha) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, hh); }
        ctx.drawImage(im, 0, 0, w, hh);
        const tries = alpha ? [['image/webp', 0.85], ['image/png']] : [['image/jpeg', 0.86], ['image/jpeg', 0.72], ['image/jpeg', 0.6]];
        for (const [type, q] of tries) {
          const url = c.toDataURL(type, q);
          if (alpha && type === 'image/webp' && !url.startsWith('data:image/webp')) continue; // webp で書けないブラウザ
          if (url.length <= maxBytes) return { dataUrl: url, w, h: hh };
        }
        scale *= 0.75;
      }
      throw new Error('画像が大きすぎて保存できません');
    },
    async save(file, o) { const r = await Kit.img.fromFile(file, o); const it = await store.put('images', { name: file.name || '画像', dataUrl: r.dataUrl, w: r.w, h: r.h }); return it; },
    async get(id) { return store.getItem('images', id); },
    // 'img:<id>' → dataURL。URL や dataURL はそのまま返す
    async resolve(ref) {
      if (!ref) return '';
      if (String(ref).startsWith('img:')) { const it = await Kit.img.get(String(ref).slice(4)); return it ? it.dataUrl : ''; }
      return ref;
    },
    pick(accept = 'image/*') {
      return new Promise((resolve) => {
        const i = h('input', { type: 'file', accept, style: { display: 'none' } });
        i.addEventListener('change', () => { resolve(i.files && i.files[0] ? i.files[0] : null); i.remove(); });

  /* ───────── QR コード（vendor/qrcode.js） ───────── */
  Kit.qr = (text, o = {}) => {
    if (!window.qrcode) throw new Error('QR の部品が読み込まれていません');
    if (window.qrcode.stringToBytesFuncs && window.qrcode.stringToBytesFuncs['UTF-8']) window.qrcode.stringToBytes = window.qrcode.stringToBytesFuncs['UTF-8'];
    const q = window.qrcode(0, o.level || 'M');
    q.addData(String(text || ' '), 'Byte');
    q.make();
    const n = q.getModuleCount(), cell = o.cell || 8, margin = o.margin == null ? 4 : o.margin;
    const size = (n + margin * 2) * cell;
    const c = h('canvas', { width: size, height: size });
    const ctx = c.getContext('2d');
    ctx.fillStyle = o.light || '#ffffff';
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = o.dark || '#000000';
    for (let r = 0; r < n; r++) for (let cc = 0; cc < n; cc++) if (q.isDark(r, cc)) ctx.fillRect((cc + margin) * cell, (r + margin) * cell, cell, cell);
    return c;
  };

  /* ───────── グラフ（SVG・ホバーで値・表でも見られる） ─────────
     Kit.chart.bars(el, {labels, series:[{name, values}], stacked, lines:[{name, values}], format})
     Kit.chart.line(el, {labels, series:[{name, values}], area, format})
     Kit.chart.hbars(el, {items:[{label, value}], format})
     色は --series-1.. を順番に使う（系列に color: 'var(--series-3)' のように指定もできる） */
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs, ...kids) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k]); for (const c of kids) if (c != null) e.append(c); return e; };
  Kit.svg = sv;
  function niceTicks(min, max, count = 4) {
    if (min === max) { max = min + 1; }
    const span = max - min, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => span / s <= count) || 10 * mag;
    const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
    const out = []; for (let v = lo; v <= hi + step / 2; v += step) out.push(Math.round(v / step) * step);
    return out;
  }
  function chartFrame(el, opt, draw) {
    Kit.clear(el);
    el.classList.add('chart');
    const series = (opt.series || []).concat(opt.lines || []);
    if (series.length >= 2 || (opt.lines && opt.lines.length)) {
      el.append(h('div', { class: 'chart-legend' }, series.map((s, i) => h('span', null, h('i', { class: s._line ? 'line' : null, style: { background: s.color || 'var(--series-' + ((i % 8) + 1) + ')' } }), s.name))));
    }
    const holder = h('div', { style: { position: 'relative' } });
    const tip = h('div', { class: 'chart-tip', hidden: true });
    holder.append(tip);
    el.append(holder);
    const fmt = opt.format || ((v) => Kit.num(v));
    let tableOpen = false;
    const tbl = h('div', { class: 'tbl-wrap', hidden: true, style: { marginTop: '8px' } });
    if (opt.table !== false && opt.labels) {
      const toggle = Kit.btn('表で見る', () => { tableOpen = !tableOpen; tbl.hidden = !tableOpen; toggle.querySelector('span').textContent = tableOpen ? '表を閉じる' : '表で見る'; }, { sm: true, kind: 'ghost', class: 'chart-table-toggle' });
      const t = h('table', { class: 'tbl' }, h('thead', null, h('tr', null, h('th', null, ''), series.map((s) => h('th', { class: 'r' }, s.name)))),
        h('tbody', null, opt.labels.map((lb, i) => h('tr', null, h('td', null, lb), series.map((s) => h('td', { class: 'r' }, fmtOrDash(fmt, s.values[i])))))));
      tbl.append(t);
      el.append(toggle, tbl);
    }
    const render = () => {
      const w = Math.max(260, holder.clientWidth || el.clientWidth || 600);
      [...holder.querySelectorAll('svg')].forEach((s) => s.remove());
      const svg = draw(w, tip, fmt);
      holder.insertBefore(svg, tip);
    };
    render();
    // 幅が変わったら描き直す。描き直しのたびに前の見張りを外す（たまらないように）
    if (el._kitRO) el._kitRO.disconnect();
    if (window.ResizeObserver) {
      let last = holder.clientWidth;
      const ro = new ResizeObserver(() => {
        if (!holder.isConnected) { ro.disconnect(); return; }
        if (Math.abs(holder.clientWidth - last) > 4) { last = holder.clientWidth; render(); }
      });

      el._kitRO = ro;
    }
    return el;
  }
  function showTip(tip, holder, x, y, head, rows) {
    Kit.clear(tip);
    tip.append(h('div', { class: 'tip-h' }, head));
    for (const r of rows) tip.append(h('div', { class: 'tip-row' }, h('i', { style: { background: r.color } }), h('span', null, r.name), h('b', null, r.value)));
    tip.hidden = false;
    const W = holder.clientWidth, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(0, x + 12), Math.max(0, W - tw)) + 'px';
    tip.style.top = Math.max(0, y - 10) + 'px';
  }
  const colorOf = (s, i) => s.color || 'var(--series-' + ((i % 8) + 1) + ')';
  const fmtOrDash = (fmt, v) => (v == null || v === '' ? '—' : fmt(v));
  // 折れ線の道筋。値が null の点で線を途切れさせる
  function linePath(values, X, Y) {
    let d = '', pen = false, last = null, first = null;
    values.forEach((v, i) => {
      if (v == null || v === '' || !Number.isFinite(+v)) { pen = false; return; }
      const p = [X(i), Y(+v)];
      d += (pen ? 'L' : 'M') + p[0] + ',' + p[1];
      pen = true; last = p; if (!first) first = p;
    });
    return { d, last, first };
  }
  const xLabelEvery = (n, plotW, avg = 40) => Math.max(1, Math.ceil(n / Math.max(1, Math.floor(plotW / avg))));

  Kit.chart = {
    bars(el, opt) {
      const lines = (opt.lines || []).map((s) => Object.assign({}, s, { _line: true }));
      return chartFrame(el, Object.assign({}, opt, { lines }), (W, tip, fmt) => {
        const H = opt.height || 220, padL = 48, padR = 10, padT = 10, padB = 26;
        const labels = opt.labels, n = labels.length, series = opt.series || [];
        let lo = 0, hi = 0;
        labels.forEach((_, i) => {
          if (opt.stacked) { let p = 0, m = 0; series.forEach((s) => { const v = +s.values[i] || 0; if (v >= 0) p += v; else m += v; }); hi = Math.max(hi, p); lo = Math.min(lo, m); }
          else series.forEach((s) => { const v = +s.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); });
          lines.forEach((s) => { const v = +s.values[i] || 0; hi = Math.max(hi, v); lo = Math.min(lo, v); });
        });
        const ticks = niceTicks(lo, hi === lo ? lo + 1 : hi);
        const y0 = ticks[0], y1 = ticks[ticks.length - 1];
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const Y = (v) => padT + plotH - ((v - y0) / (y1 - y0)) * plotH;
        const band = plotW / n;
        const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opt.title || 'グラフ' });
        ticks.forEach((t) => {
          svg.append(sv('line', { x1: padL, x2: W - padR, y1: Y(t), y2: Y(t), stroke: t === 0 ? 'var(--chart-axis)' : 'var(--chart-grid)', 'stroke-width': 1 }));
          svg.append(sv('text', { x: padL - 6, y: Y(t) + 4, 'text-anchor': 'end' }, (opt.tick || fmt)(t)));
        });
        const every = xLabelEvery(n, plotW, opt.labelWidth || 44);
        labels.forEach((lb, i) => { if (i % every === 0) svg.append(sv('text', { x: padL + band * i + band / 2, y: H - 8, 'text-anchor': 'middle' }, lb)); });
        const groups = opt.stacked ? 1 : Math.max(1, series.length);
        const bw = Math.min(24, (band * 0.72) / groups);
        const rounded = (x, yTop, w, hgt, up) => {
          if (hgt <= 0.5) return '';
          const r = Math.min(4, w / 2, hgt);

            ? `M${x},${yTop + hgt}V${yTop + r}Q${x},${yTop} ${x + r},${yTop}H${x + w - r}Q${x + w},${yTop} ${x + w},${yTop + r}V${yTop + hgt}Z`
            : `M${x},${yTop}V${yTop + hgt - r}Q${x},${yTop + hgt} ${x + r},${yTop + hgt}H${x + w - r}Q${x + w},${yTop + hgt} ${x + w},${yTop + hgt - r}V${yTop}Z`;
        };
        labels.forEach((_, i) => {
          const cx = padL + band * i + band / 2;
          if (opt.stacked) {
            let pos = 0, neg = 0;
            const last = series.length - 1 - [...series].reverse().findIndex((s) => (+s.values[i] || 0) > 0);
            series.forEach((s, si) => {
              const v = +s.values[i] || 0; if (!v) return;
              const from = v >= 0 ? pos : neg, to = from + v;
              if (v >= 0) pos = to; else neg = to;
              const top = Y(Math.max(from, to)), bot = Y(Math.min(from, to));
              const gap = si > 0 ? 2 : 0;
              const hh = Math.max(0, bot - top - gap);
              svg.append(sv('path', { d: si === last && v > 0 ? rounded(cx - bw / 2, top, bw, hh, true) : `M${cx - bw / 2},${top}h${bw}v${hh}h${-bw}Z`, fill: colorOf(s, si) }));
            });
          } else {
            series.forEach((s, si) => {
              const v = +s.values[i] || 0; if (!v) return;

              const w = groups > 1 ? bw - 2 : bw;
              const top = Y(Math.max(0, v)), bot = Y(Math.min(0, v));
              svg.append(sv('path', { d: rounded(x, top, w, bot - top, v > 0), fill: colorOf(s, si) }));
            });
          }
        });
        lines.forEach((s, li) => {
          const col = colorOf(s, series.length + li);
          const { d, last } = linePath(s.values, (i) => padL + band * i + band / 2, Y);
          if (d) svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
          if (last) svg.append(sv('circle', { cx: last[0], cy: last[1], r: 4, fill: col, stroke: 'var(--surface)', 'stroke-width': 2 }));
        });
        const hover = sv('rect', { x: 0, y: padT, width: band, height: plotH, fill: 'var(--ink)', opacity: 0, 'pointer-events': 'none' });
        svg.append(hover);
        labels.forEach((lb, i) => {
          const hit = sv('rect', { x: padL + band * i, y: padT, width: band, height: plotH, fill: 'transparent', tabindex: 0 });
          const on = () => {
            hover.setAttribute('x', padL + band * i); hover.setAttribute('opacity', 0.05);
            const rows = series.map((s, si) => ({ name: s.name, value: fmtOrDash(fmt, s.values[i]), color: colorOf(s, si) })).concat(lines.map((s, li) => ({ name: s.name, value: fmtOrDash(fmt, s.values[i]), color: colorOf(s, series.length + li) })));

    },

    line(el, opt) {
      return chartFrame(el, opt, (W, tip, fmt) => {
        const H = opt.height || 220, padL = 48, padR = 14, padT = 12, padB = 26;
        const labels = opt.labels, n = labels.length, series = opt.series || [];
        const all = series.flatMap((s) => s.values.filter((v) => v != null).map((v) => +v || 0));
        const ticks = niceTicks(Math.min(0, ...all), Math.max(1, ...all));
        const y0 = ticks[0], y1 = ticks[ticks.length - 1];
        const plotW = W - padL - padR, plotH = H - padT - padB;
        const X = (i) => padL + (n <= 1 ? plotW / 2 : (plotW * i) / (n - 1));
        const Y = (v) => padT + plotH - ((v - y0) / (y1 - y0)) * plotH;
        const svg = sv('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': opt.title || 'グラフ' });
        ticks.forEach((t) => { svg.append(sv('line', { x1: padL, x2: W - padR, y1: Y(t), y2: Y(t), stroke: t === 0 ? 'var(--chart-axis)' : 'var(--chart-grid)', 'stroke-width': 1 })); svg.append(sv('text', { x: padL - 6, y: Y(t) + 4, 'text-anchor': 'end' }, (opt.tick || fmt)(t))); });
        const every = xLabelEvery(n, plotW, opt.labelWidth || 44);
        // 最後の目盛りは必ず出し、その手前で近すぎるものは出さない（重ならないように）
        labels.forEach((lb, i) => { if ((i % every === 0 && n - 1 - i >= every) || i === n - 1) svg.append(sv('text', { x: X(i), y: H - 8, 'text-anchor': i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle' }, lb)); });
        series.forEach((s, si) => {
          const col = colorOf(s, si);
          const { d, last, first } = linePath(s.values, X, Y);
          if (!d) return;
          if (opt.area && series.length === 1 && !s.values.some((v) => v == null)) svg.append(sv('path', { d: d + `L${X(n - 1)},${Y(Math.max(y0, 0))}L${X(0)},${Y(Math.max(y0, 0))}Z`, fill: col, opacity: 0.1 }));
          svg.append(sv('path', { d, fill: 'none', stroke: col, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
          if (last) svg.append(sv('circle', { cx: last[0], cy: last[1], r: 4, fill: col, stroke: 'var(--surface)', 'stroke-width': 2 }));
          if (first && first === last) svg.append(sv('circle', { cx: first[0], cy: first[1], r: 4, fill: col }));
        });
        const cross = sv('line', { x1: 0, x2: 0, y1: padT, y2: padT + plotH, stroke: 'var(--ink-3)', 'stroke-width': 1, opacity: 0 });
        svg.append(cross);
        const hit = sv('rect', { x: padL, y: padT, width: plotW, height: plotH, fill: 'transparent' });

          cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i)); cross.setAttribute('opacity', 0.5);
          showTip(tip, el.querySelector('.chart > div') || el, (X(i) / W) * r.width, padT, labels[i], series.map((s, si) => ({ name: s.name, value: fmtOrDash(fmt, s.values[i]), color: colorOf(s, si) })));
        });

        svg.append(hit);
        return svg;
      });
    },

    hbars(el, opt) {
      Kit.clear(el);
      el.classList.add('chart');
      const fmt = opt.format || ((v) => Kit.num(v));

  /* ───────── 画面（アプリの登録と切り替え） ───────── */
  Kit.GROUPS = [
    { id: 'home', label: '' },
    { id: 'class', label: 'クラス' },
    { id: 'lesson', label: '授業' },
