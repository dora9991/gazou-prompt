            h('h3', null, 'はなす2人'),
            h('p', { class: 'small muted' }, '前後左右・ななめのとなりにしません。'),
            h('div', { class: 'st-pairs' }, c.apart.map((p, i) => {
              const a = byId.get(p[0]), b = byId.get(p[1]);
              if (!a || !b) return null;
              return h('div', { class: 'st-pair' }, h('span', null, School.label(a) + ' と ' + School.label(b)), Kit.btn('', () => { c.apart.splice(i, 1); saveCfg(); render(); }, { icon: 'close', sm: true, kind: 'ghost', title: 'この組を外す' }));
            })),
            h('div', { class: 'st-addpair' }, pa, pb, Kit.btn('足す', () => {
              if (!pa.value || !pb.value || pa.value === pb.value) { Kit.toast('ちがう2人を選んでください', { type: 'bad' }); return; }
              if (c.apart.some((p) => (p[0] === pa.value && p[1] === pb.value) || (p[0] === pb.value && p[1] === pa.value))) { Kit.toast('その2人は、もう入っています'); return; }
              c.apart.push([pa.value, pb.value]); saveCfg(); render();
            }, { sm: true, icon: 'plus' }))),
          h('div', { class: 'stack tight' },
            h('h3', null, '固定の席'),
            fixedList.length ? h('div', { class: 'st-pairs' }, fixedList.map(([k, id]) => h('div', { class: 'st-pair' }, h('span', null, School.label(byId.get(id)) + '（' + (+k.split('-')[0] + 1) + '列目）'), Kit.btn('', () => { delete c.fixed[k]; saveCfg(); render(); }, { icon: 'close', sm: true, kind: 'ghost', title: '固定を外す' }))))
              : h('p', { class: 'small muted' }, '「固定する」にして席を押すと、その人は席替えで動きません（配慮が必要なときなど）。')));
      }

      /* ── 席替え（くじ） ── */
      async function run() {
        if (!S.cls || S.busy) return;
        const c = S.cfg, d = S.draft;
        if (!S.cls.students.length) { Kit.toast('名簿に生徒がいません', { type: 'bad' }); return; }
        if (!d.saved && Object.keys(d.seats).length && d.issues == null && !(await Kit.confirm({ title: 'もう一度くじを引きますか？', body: '手で入れかえた席は、新しいくじの結果で置きかわります。', ok: 'くじを引く' }))) return;
        S.busy = true; runBtn.disabled = true;
        const prev = c.avoidPrev ? latest() : null;
        const seed = School.newSeed();
        const input = {
          rows: c.rows, cols: c.cols, blocked: c.blocked, pairs: c.pairs, students: S.cls.students, fixed: c.fixed, apart: c.apart,
          frontRows: c.frontRows, mix: c.mix, emptyBack: c.emptyBack, seed,
          prev: prev ? prev.seats : null, prevRows: prev && prev.rows, prevCols: prev && prev.cols, prevBlocked: prev && prev.blocked, prevPairs: prev && prev.pairs,
        };
        await shuffleShow();
        const res = SeatSolver.solve(input);
        S.busy = false; runBtn.disabled = false;
        if (!alive) return;
        S.draft = { classId: S.cls.id, planId: null, title: '', date: Kit.ymd(), rows: c.rows, cols: c.cols, blocked: c.blocked.slice(), pairs: c.pairs, seats: res.ok ? res.seats : {}, seed, saved: false, issues: res.ok ? res.issues : null, error: res.ok ? null : res.error };
        S.sel = null; S.selStudent = null; S.viewPlanId = null;
        render();
        const g = main.querySelector('.st-grid');
        if (g && !matchMedia('(prefers-reduced-motion: reduce)').matches) for (const el of g.querySelectorAll('.st-seat:not(.is-none)')) el.classList.add('is-new');
        if (res.ok) Kit.toast(res.issues.length ? '席を決めました（守れなかった条件があります）' : '席を決めました。よければ「この席で決定」を押してください');
      }
      // くじの演出：名前を少しのあいだ入れかえて見せる
      function shuffleShow() {
        return new Promise((resolve) => {
          const g = main.querySelector('.st-grid');
          if (!g || matchMedia('(prefers-reduced-motion: reduce)').matches) { setTimeout(resolve, 30); return; }
          const names = S.cls.students.map((s) => (School.hidden() || !s.name ? s.no + '番' : s.name.split(' ')[0]));
          const seats = [...g.querySelectorAll('.st-seat:not(.is-none) .nm')];
          let n = 0;
          const t = setInterval(() => {
            for (const el of seats) el.textContent = names[Math.floor(Math.random() * names.length)];
            if (++n >= 9) { clearInterval(t); resolve(); }
          }, 70);
        });
      }

      async function savePlan() {
        const d = S.draft;
        if (!Object.keys(d.seats).length) return;
        const title = await Kit.ask({ title: '席を保存', label: '名前（あとで見分けるため）', value: d.title || Kit.fmtDate(Kit.ymd(), 'M月D日') + 'の席替え', ok: '保存する' });
        if (title == null) return;
        const it = { id: d.planId || Kit.uid('seat'), classId: S.cls.id, title: title.trim() || '席替え', date: d.planId ? d.date : Kit.ymd(), rows: d.rows, cols: d.cols, blocked: d.blocked, pairs: d.pairs, seats: d.seats, seed: d.seed || null };
        const saved = await Kit.store.put('seatplans', it);
        S.viewPlanId = saved.id;
        S.draft = null;
        await load(); render();
        Kit.toast('席を保存しました。次の席替えでは、この席の「となり」を避けます');
      }
      async function removePlan(id) {
        const ok = await Kit.confirm({ title: 'この保存した席を消しますか？', body: '消すと、次の席替えで「前回のとなり」を避けるときに使われなくなります。', ok: '消す', danger: true });
        if (!ok) return;
        await Kit.store.remove('seatplans', id);
        S.viewPlanId = null; S.draft = null;
        await load(); render();
        Kit.toast('消しました');
      }

      /* ── 発表（1人ずつめくる） ── */
      function show() {
        const d = S.draft;
        if (!Object.keys(d.seats).length) { Kit.toast('先に「席替えする」で席を決めてください', { type: 'bad' }); return; }
        const keys = School.rng().shuffle(Object.keys(d.seats));
        const hidden = new Set(keys);
        let timer = 0, flipKey = null;
        const overlay = h('div', { class: 'st-show', role: 'dialog', 'aria-modal': 'true', 'aria-label': '席の発表' });
        const left = h('span', { class: 'small ink-2 num', 'aria-live': 'polite' });
        const boardBox = h('div', { style: { display: 'contents' } });
        const draw = () => {
          Kit.clear(boardBox);
          boardBox.append(board({ big: true, hiddenSet: hidden, flipKey }));
          left.textContent = hidden.size ? 'のこり ' + hidden.size + '人' : 'ぜんぶ発表しました';
        };
        const next = () => { const k = keys.find((x) => hidden.has(x)); if (!k) { stop(); return; } hidden.delete(k); flipKey = k; draw(); };
        const stop = () => { clearInterval(timer); timer = 0; autoBtn.querySelector('span').textContent = '自動でめくる'; };
        const autoBtn = Kit.btn('自動でめくる', () => { if (timer) { stop(); return; } autoBtn.querySelector('span').textContent = '止める'; timer = setInterval(next, 650); }, { icon: 'play' });
        const close = () => { stop(); overlay.remove(); document.removeEventListener('keydown', onKey, true); };
        const onKey = (e) => { if (e.key === 'Escape') { e.stopPropagation(); close(); } else if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); next(); } };
        overlay.append(h('div', { class: 'st-show-top' },
          h('h2', null, (S.cls.name || '') + ' 新しい席'), left,
          Kit.btn('1人めくる', next, { kind: 'primary', icon: 'right' }), autoBtn,
          Kit.btn('ぜんぶ見せる', () => { stop(); hidden.clear(); flipKey = null; draw(); }, { icon: 'eye' }),
          Kit.btn('閉じる', close, { kind: 'ghost', icon: 'close' })), boardBox);
        overlay.addEventListener('click', (e) => { const b = e.target.closest('[data-k]'); if (b && hidden.has(b.dataset.k)) { hidden.delete(b.dataset.k); flipKey = b.dataset.k; draw(); } });
        document.addEventListener('keydown', onKey, true);
        document.body.append(overlay);
        draw();
        overlay.tabIndex = -1; overlay.focus();
      }

      /* ── 印刷 ── */
      function printDlg() {
        const d = S.draft;
        if (!Object.keys(d.seats).length) { Kit.toast('先に席を決めてください', { type: 'bad' }); return; }
        let which = S.cfg.view;
        const title = h('input', { type: 'text', id: 'st-print-title', value: (S.cls.name || '') + ' 座席表' });
        const date = h('input', { type: 'text', id: 'st-print-date', value: Kit.fmtDate(d.date || Kit.ymd(), 'M月D日(W)') + 'から' });
        Kit.modal({
          title: '座席表を印刷', body: h('div', { class: 'stack' },
            Kit.field({ label: '見出し', input: title }), Kit.field({ label: '日付など', input: date }),
            Kit.field({ label: '図の向き', input: Kit.seg([{ value: 'student', label: '生徒から見た図' }, { value: 'teacher', label: '教卓から見た図' }, { value: 'both', label: '両方（2枚）' }], which, (v) => { which = v; }, { label: '図の向き' }) }),
            h('p', { class: 'small muted' }, 'A4横で印刷します。「前の席」や固定の印は、印刷には出ません。' + (School.hidden() ? '「名前を隠す」がオンなので、番号だけで印刷します。' : ''))),
          actions: [{ label: 'やめる', kind: 'ghost' }, { label: '印刷する', kind: 'primary', onClick: () => { doPrint(which, title.value, date.value); } }],
        });
      }
      function doPrint(which, title, sub) {
        const d = S.draft, st = stById();
        const blocked = new Set(d.blocked || []);
        const n = d.cols;
        const pw = Math.min(40, Math.floor((260 - (n - 1) * 3) / n)) + 'mm', ph = d.rows > 7 ? '15mm' : '19mm', pf = n > 7 ? '11pt' : '14pt';
        const page = (view) => {
          const rowsOrder = view === 'teacher' ? range(d.rows).reverse() : range(d.rows);
          const colsOrder = view === 'teacher' ? range(d.cols).reverse() : range(d.cols);
          const table = h('table', { style: '--pw:' + pw + ';--ph:' + ph + ';--pf:' + pf });
          for (const r of rowsOrder) {
            const tr = h('tr');
            colsOrder.forEach((c, i) => {
              const k = K(r, c), id = d.seats[k], s = id ? st.get(id) : null;
              if (blocked.has(k)) tr.append(h('td', { class: 'none' }));
              else if (!s) tr.append(h('td', { class: 'empty' }, h('span', { class: 'nm' }, '')));
              else tr.append(h('td', null, School.hidden() || !s.name ? h('span', { class: 'nm' }, s.no + '番') : [h('span', { class: 'no' }, s.no), h('span', { class: 'nm' }, s.name)]));
              if (d.pairs && i < colsOrder.length - 1 && (view === 'teacher' ? c % 2 === 0 : c % 2 === 1)) tr.append(h('td', { class: 'aisle' }));
            });
            table.append(tr);
          }
          const front = h('div', { class: 'front' }, h('span', null, '黒　板'), h('span', { class: 'k' }, '教卓'));
          return h('div', { class: 'pg' }, h('h1', null, title), h('div', { class: 'sub' }, [sub, view === 'teacher' ? '（教卓から見た図）' : '（生徒から見た図）'].filter(Boolean).join('　')),
            view === 'teacher' ? [table, front] : [front, table]);
        };
        School.print({ landscape: true, build: () => h('div', { class: 'st-print' }, which === 'both' ? [page('student'), page('teacher')] : page(which)) });
      }

      await load();
      await render();
      const reload = Kit.debounce(async () => { if (!alive || S.busy) return; await load(); render(); }, 150);
      const offs = [Kit.store.on('coll:classes', reload), School.onClassChange(async () => { S.draft = null; S.viewPlanId = null; await load(); render(); })];
      const onMq = () => render();
      mq.addEventListener('change', onMq);
      return () => { alive = false; offs.forEach((f) => f()); reload.cancel(); saveCfg.flush(); mq.removeEventListener('change', onMq); };
    },
  });
})();

      /* 回転盤：外の円のふちに場所、内の円に班（とメンバー）。内の円を時計まわりに1つ回すと、次の週の分担になる。
         文字は、その区切りが上に来たときにまっすぐ読める向き。メンバーの名前は、日本語の縦書きのように1字ずつ中心へ向けて並べる */

        const ang = (i) => (-90 + (360 / n) * i) * Math.PI / 180;

          const mid = ang(i + 0.5), lab = String(labels[i] || '');
          // 見出し（場所・班の名前）：ふちの近くに、区切りの幅に合う大きさで
          const rl = o.ring ? (o.ring + rOut) / 2 : rOut * 0.84;
          text(lab, rl, mid, Math.max(3.2, Math.min(o.ring ? 7 : 6.5, (arc(rl) * 0.8) / Math.max(2, lab.length))), true);
          const names = (o.names && o.names[i]) || [];

          const fs = Math.min(3.8, Math.max(2.6, (arc(rOut * 0.66) * 0.8) / (names.length + 0.5)));

          const a2 = mate(a, ca), b2 = mate(b, cb);
          const first = (x, y) => (x < y ? [x, y] : [y, x]);
          const [a1s, a2s] = first(a, a2).sort(); const [b1s, b2s] = first(b, b2).sort();
          const A1 = cells[a1s], A2 = cells[a2s], B1 = cells[b1s], B2 = cells[b2s];
          cells[a1s] = B1; cells[a2s] = B2; cells[b1s] = A1; cells[b2s] = A2;
        } else {
          if (cb) cells[a] = cb; else delete cells[a];
          if (ca) cells[b] = ca; else delete cells[b];
        }

        savePlan(); render();

        const tb = h('tbody', null, pl.classes.map((c) => h('tr', null, h('th', null, c.name), range(pl.days).flatMap((d) => range(pl.perDay[d]).map((p) => {

        })))));

      }
      async function copyToMine() {
        const pl = S.plan;

        else {
          const c = pl.classes.find((x) => x.id === S.viewId);
          const cells = {};
          for (const [k, cell] of Object.entries(pl.result.cells[c.id] || {})) cells[k] = { s: subjOf(cell.subjectId).name, n: cell.teacherIds.map(tName).join('・') };
          g = { name: c.name + 'の時間割', days: pl.days, perDay: pl.perDay.slice(), cells, bell: DEFAULT_BELL.slice(0, Math.max(...pl.perDay)).map((x) => ({ start: x[0], end: x[1] })) };
        }

      }
      function printPlan() {
        const pl = S.plan;
        if (S.view === 'all') {
          School.print({ landscape: true, margin: '8mm', build: () => h('div', { class: 'tt-print all' }, h('h1', null, pl.name), overviewTable(pl)) });

})();

      await load();

      return () => { alive = false; offs.forEach((f) => f()); reload.cancel(); };
    },
  });
})();

/* ---- js/apps/calendar.js ---- */
// カレンダー：行事・テスト・会議・締切をひとつに。リマインダー・宿題の締切も重ねて見る
// （みせびらき のカレンダーを学校向けに直したもの。予約枠の機能は外し、年間行事のまとめて追加・共有を足した）
(function () {
  'use strict';
  const { h } = Kit;

  /* ───────── 種類・祝日・時刻の小物 ───────── */
  const CATS = [
    { id: 'gyoji', label: '行事' },
    { id: 'test', label: 'テスト' },
    { id: 'class', label: '授業・学級' },
    { id: 'meeting', label: '会議・研修' },
    { id: 'parent', label: '面談・保護者' },
    { id: 'deadline', label: '締切・提出' },
    { id: 'club', label: '部活' },
    { id: 'private', label: '個人' },
  ];
  const CAT = Object.fromEntries(CATS.map((c) => [c.id, c]));
  const catOf = (c) => (CAT[c] ? c : 'class');

  // 祝日は School.holiday（法律の決まりから計算。2000〜2099年）
  const holiday = (s) => School.holiday(s);

  const DAY_START = 7, DAY_END = 22; // 週の表示は 7時〜22時
  const pad = (n) => String(n).padStart(2, '0');
  const ymd = (d) => Kit.ymd(d);
  const add = (d, n) => Kit.ymd(Kit.addDays(d, n));
  const todayS = () => Kit.ymd(Kit.today());
  const isYmd = (s) => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
  const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
  const hm = (n) => pad(Math.floor(n / 60)) + ':' + pad(n % 60);
  const md = (s) => Kit.fmtDate(s, 'M/D(W)');
  const d8 = (s) => String(s).replace(/-/g, '');

  // 終わりの日時（終わりがなければ1時間後。日をまたげば翌日）
  function endOf(it) {
    const s = toMin(it.start), e = toMin(it.end);
    const t = e != null && e > s ? e : s + 60;
    return { date: t >= 1440 ? add(it.date, 1) : it.date, time: hm(t % 1440) };
  }

  /* ───────── くり返しの予定を、表示する範囲の回に広げる ───────── */
  // from〜to（両端ふくむ）。各回の日付は occ。毎月は「同じ日」、その日がない月（31日など）はとばす
  function occurrences(events, from, to) {
    const out = [];
    for (const ev of events || []) {
      if (!ev || !isYmd(ev.date)) continue;
      const rep = ev.repeat === 'weekly' || ev.repeat === 'monthly' ? ev.repeat : 'none';
      if (rep === 'none') { if (ev.date >= from && ev.date <= to) out.push(Object.assign({}, ev, { occ: ev.date })); continue; }
      const last = isYmd(ev.repeatUntil) && ev.repeatUntil < to ? ev.repeatUntil : to;
      if (ev.date > last) continue;
      if (rep === 'weekly') {
        for (let k = ev.date < from ? Math.floor(Kit.daysBetween(ev.date, from) / 7) : 0; ; k++) {
          const s = add(ev.date, k * 7);
          if (s > last) break;
          if (s >= from) out.push(Object.assign({}, ev, { occ: s }));
        }
      } else {
        const b = Kit.parseYmd(ev.date), day = b.getDate(), f = Kit.parseYmd(from);
        let k = Math.max(0, (f.getFullYear() - b.getFullYear()) * 12 + f.getMonth() - b.getMonth() - 1);
        for (let guard = 0; guard < 400; k++, guard++) {
          const d = new Date(b.getFullYear(), b.getMonth() + k, day);
          if (d.getDate() !== day) continue;
          const s = ymd(d);
          if (s > last) break;
          if (s >= from) out.push(Object.assign({}, ev, { occ: s }));
        }
      }
    }
    return out;
  }

  /* ───────── すばやく追加：「10/20 15:40 学年会」を読み取る ───────── */
  const WD = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 };
  const CAT_WORDS = [
    ['test', /テスト|試験|考査|模試|検定|実力/],
    ['meeting', /会議|研修|学年会|委員会|打ち?合わ?せ|打合せ|研究授業|校内研|職員|ミーティング|MTG/i],
    ['parent', /面談|家庭訪問|保護者|三者|二者|PTA|懇談|参観/],
    ['deadline', /締め?切|〆切|期限|提出|〆|入力|通知表|指導要録|報告書|回収/],
    ['gyoji', /入学式|卒業式|始業式|終業式|修了式|式典|開校記念|体育祭|運動会|文化祭|学習発表会|合唱|修学旅行|遠足|校外学習|避難訓練|健康診断|身体測定|集会|宿泊|球技大会|行事|夏休み|冬休み|春休み|休業/],
    ['club', /部活|練習試合|大会|試合|遠征|総体|新人戦/],
    ['private', /通院|病院|歯医者|私用|家族|子ども|子供|保育園|幼稚園|お迎え|誕生日|帰省|旅行|美容院|年休/],
  ];
  const guessCat = (t) => { for (const [c, re] of CAT_WORDS) if (re.test(t)) return c; return 'class'; };

  function parseQuick(input, today) {
    const base = Kit.parseYmd(today ? Kit.ymd(today) : todayS());
    let s = ' ' + String(input || '').normalize('NFKC').replace(/[〜～]/g, '~').replace(/\s+/g, ' ').trim() + ' ';
    let date = null, start = '', end = '', bad = false;
    const take = (re) => { const m = re.exec(s); if (m) s = s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length); return m; };
    const P = '(?:の|に|は|、|,)?';
    const WDP = '(?:\\s*\\([月火水木金土日](?:曜日?)?\\)|\\s*[月火水木金土日]曜日?)?';
    const ymdOf = (y, mo, d) => { const x = new Date(y, mo - 1, d); return x.getMonth() === mo - 1 && x.getDate() === d ? x : null; };
    // 年がない日付は「近いほう」。1か月以上前なら来年
    const near = (mo, d) => { let x = ymdOf(base.getFullYear(), mo, d); if (x && Kit.daysBetween(base, x) < -31) x = ymdOf(base.getFullYear() + 1, mo, d); return x; };
    let m;
    if ((m = take(new RegExp('(\\d{4})[/.\\-年](\\d{1,2})[/.\\-月](\\d{1,2})日?' + WDP + P)))) { date = ymdOf(+m[1], +m[2], +m[3]); bad = !date; }
    else if ((m = take(new RegExp('(\\d{1,2})/(\\d{1,2})(?![\\d/])' + WDP + P))) || (m = take(new RegExp('(\\d{1,2})月(\\d{1,2})日' + WDP + P)))) { date = near(+m[1], +m[2]); bad = !date; }
    else if ((m = take(new RegExp('(?:今日|本日|きょう(?=[のには]|[^ぁ-ゖ]))' + P)))) date = base;
    else if ((m = take(new RegExp('(?:明後日|あさって)' + P)))) date = Kit.addDays(base, 2);
    else if ((m = take(new RegExp('(?:明日|あした(?=[のには]|[^ぁ-ゖ])|あす(?=[のには]|[^ぁ-ゖ]))' + P)))) date = Kit.addDays(base, 1);
    else if ((m = take(new RegExp('(\\d{1,3})日後' + P)))) date = Kit.addDays(base, +m[1]);
    else if ((m = take(new RegExp('(再来週|来週|今週)の?\\s*([月火水木金土日])曜日?' + P)))) {
      // 週は月曜はじまりで数える（「来週の日曜」は次の次の日曜）
      const mon = Kit.addDays(base, -((base.getDay() + 6) % 7));
      date = Kit.addDays(mon, ({ 今週: 0, 来週: 7, 再来週: 14 })[m[1]] + (WD[m[2]] + 6) % 7);
    } else if ((m = take(new RegExp('(?:次の|今度の)?([月火水木金土日])曜日?' + P)))) {
      date = Kit.addDays(base, (WD[m[1]] - base.getDay() + 7) % 7);
    }
    // 時刻：午後3時 / 19時半 / 19:30 / 14時〜16時 / 14〜16時
    const Q = '(午前|午後|朝|昼|夕方|夜)?\\s*';
    const T = '(\\d{1,2})(?::(\\d{2})|時(?:(半)|(\\d{1,2})分)?)';
    const time = (q, hh, mm, half, mk) => {
      let H = +hh;
      const M = mm != null ? +mm : half ? 30 : mk != null ? +mk : 0;
      if (q === '午後' || q === '夕方' || q === '夜' || q === '昼') { if (H < 12) H += 12; }
      else if (q === '午前' || q === '朝') { if (H === 12) H = 0; }
      else if (String(hh).length === 1 && H >= 1 && H <= 5) H += 12; // 「3時」はたいてい午後
      return H <= 23 && M <= 59 ? pad(H) + ':' + pad(M) : '';
    };
    if ((m = take(new RegExp(Q + T + '\\s*(?:~|-|ー|−|–|から)\\s*' + Q + T + '(?:まで)?' + P)))) {
      start = time(m[1], m[2], m[3], m[4], m[5]);
      end = time(m[6] || m[1], m[7], m[8], m[9], m[10]);
    } else if ((m = take(new RegExp(Q + '(\\d{1,2})\\s*(?:~|-|から)\\s*' + T + '(?:まで)?' + P)))) {
      start = time(m[1], m[2]);
      end = time(m[1], m[3], m[4], m[5], m[6]);
    } else if ((m = take(new RegExp(Q + T + '(?:から|~)?' + P)))) {
      start = time(m[1], m[2], m[3], m[4], m[5]);
    }
    if (start && (!end || toMin(end) <= toMin(start))) end = hm(Math.min(toMin(start) + 60, 1439));
    if (!start) end = '';
    const title = s.replace(/\s+/g, ' ').trim()
      .replace(/^(?:の|に|は|から|より|、|,)\s+/, '').replace(/\s+(?:に|から|まで|より|、|,)$/, '').trim();
    return { title, date: ymd(date || base), dateGiven: !!date, bad, allDay: !start, start, end, cat: guessCat(title) };
  }

  /* ───────── 書き出し（Googleカレンダー用CSV・ICS・追加リンク） ───────── */
  function googleCsv(items) {
    const us = (s) => { const d = Kit.parseYmd(s); return pad(d.getMonth() + 1) + '/' + pad(d.getDate()) + '/' + d.getFullYear(); };
    const t12 = (t) => { const n = toMin(t), H = Math.floor(n / 60); return pad(H % 12 || 12) + ':' + pad(n % 60) + ' ' + (H < 12 ? 'AM' : 'PM'); };
    const rows = [['Subject', 'Start Date', 'Start Time', 'End Date', 'End Time', 'All Day Event', 'Description', 'Location']];
    for (const it of items) {
      if (it.allDay || toMin(it.start) == null) rows.push([it.title, us(it.date), '', us(it.date), '', 'True', it.memo || '', it.place || '']);
      else { const e = endOf(it); rows.push([it.title, us(it.date), t12(it.start), us(e.date), t12(e.time), 'False', it.memo || '', it.place || '']); }
    }
    return Kit.csv(rows).replace(/^\ufeff/, ''); // Google の取り込み用なので BOM なし
  }

  const icsEsc = (s) => String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  // 75バイトごとに折り返す（UTF-8 の文字の途中では切らない）
  function icsFold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 75) return line;
    let out = '', cur = '', bytes = 0, limit = 75;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (bytes + b > limit) { out += cur + '\r\n '; cur = ''; bytes = 0; limit = 74; }
      cur += ch; bytes += b;
    }
    return out + cur;
  }
  function toIcs(items, name) {
    const n = new Date();
    const stamp = n.getUTCFullYear() + pad(n.getUTCMonth() + 1) + pad(n.getUTCDate()) + 'T' + pad(n.getUTCHours()) + pad(n.getUTCMinutes()) + pad(n.getUTCSeconds()) + 'Z';
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//sensei-kit//calendar//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(name || '先生の道具箱')];
    for (const it of items) {
      const allDay = it.allDay || toMin(it.start) == null;
      L.push('BEGIN:VEVENT', 'UID:' + String(it.uid || it.id || Kit.uid('ev')).replace(/[^\w.-]/g, '-') + '@sensei-kit', 'DTSTAMP:' + stamp);
      if (allDay) L.push('DTSTART;VALUE=DATE:' + d8(it.date), 'DTEND;VALUE=DATE:' + d8(add(it.date, 1)));
      else { const e = endOf(it); L.push('DTSTART:' + d8(it.date) + 'T' + it.start.replace(':', '') + '00', 'DTEND:' + d8(e.date) + 'T' + e.time.replace(':', '') + '00'); }
      L.push('SUMMARY:' + icsEsc(it.title));
      if (it.place) L.push('LOCATION:' + icsEsc(it.place));
      if (it.memo) L.push('DESCRIPTION:' + icsEsc(it.memo));
      if (CAT[it.cat]) L.push('CATEGORIES:' + icsEsc(CAT[it.cat].label));
      if (it.repeat === 'weekly' || it.repeat === 'monthly' || it.repeat === 'daily') {
        L.push('RRULE:FREQ=' + it.repeat.toUpperCase() + (isYmd(it.repeatUntil) ? ';UNTIL=' + d8(it.repeatUntil) + (allDay ? '' : 'T235959') : ''));
      } else if (it.repeat === 'weekdays') {
        L.push('RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR' + (isYmd(it.repeatUntil) ? ';UNTIL=' + d8(it.repeatUntil) + (allDay ? '' : 'T235959') : ''));
      }
      // 知らせ（リマインダー）：alarm は ICS の TRIGGER の値（例：-PT10M、PT8H）
      if (it.alarm) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(it.title), 'TRIGGER' + (allDay ? ';RELATED=START' : '') + ':' + it.alarm, 'END:VALARM');
      L.push('END:VEVENT');
    }
    L.push('END:VCALENDAR');
    return L.map(icsFold).join('\r\n') + '\r\n';
  }

  function googleLink(it) {
    let dates;
    if (it.allDay || toMin(it.start) == null) dates = d8(it.date) + '/' + d8(add(it.date, 1));
    else { const e = endOf(it); dates = d8(it.date) + 'T' + it.start.replace(':', '') + '00/' + d8(e.date) + 'T' + e.time.replace(':', '') + '00'; }
    const q = new URLSearchParams({ action: 'TEMPLATE', text: it.title || '', dates });
    if (it.memo) q.set('details', it.memo);
    if (it.place) q.set('location', it.place);
    return 'https://calendar.google.com/calendar/render?' + q.toString();
  }

  /* ───────── 読み込み（.ics） ───────── */
  const icsText = (v) => String(v || '').replace(/\\([\\;,nN])/g, (_, c) => (c === 'n' || c === 'N' ? '\n' : c));

  /* ───────── 年間行事の読み取り（まとめて追加） ───────── */
  // 年のない日付は、年度に合わせる（4〜12月はその年、1〜3月は次の年）
  const syYear = (m, year) => (+m >= 4 ? year : year + 1);
  function withSchoolYear(line, year) {
    return String(line).replace(/(^|[^\d\/年.\-])(\d{1,2})([\/月])(\d{1,2})(?!\d)/, (all, pre, m, sep, d) => (+m >= 1 && +m <= 12 ? pre + syYear(m, year) + '/' + m + '/' + d + (sep === '月' ? '' : '') : all));
  }
  function bulkParse(text, year) {
    const items = [], skipped = [];
    const mk = (y, m, d) => { const yy = y ? +y : syYear(m, year); const x = new Date(yy, +m - 1, +d); return x.getMonth() === +m - 1 ? ymd(x) : null; };
    const DATE = '(?:(\\d{4})[\\/年.\\-])?(\\d{1,2})[\\/月.](\\d{1,2})日?(?:\\s*[(（]?[月火水木金土日](?:曜日?)?[)）]?)?';
    const reRange = new RegExp('^' + DATE + '\\s*[〜~\\-ー－]\\s*(?:' + DATE + '|(\\d{1,2})日?)\\s+(.+)$');
    const reOne = new RegExp('^' + DATE + '\\s*(.*)$');
    const reCols = /^(\d{1,2})\s+(\d{1,2})\s+(?:[(（]?[月火水木金土日][)）]?\s+)?(.+)$/;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.normalize('NFKC').replace(/\t+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!line) continue;
      let m = reRange.exec(line);
      if (m) {
        const from = mk(m[1], m[2], m[3]);
        const to = m[6] ? mk(m[4], m[5], m[6]) : m[7] ? mk(m[1], m[2], m[7]) : null;
        const title = m[8].trim();
        if (from && to && to >= from && title) {
          const n = Kit.daysBetween(from, to);
          const cat = guessCat(title);
          if (n <= 14) for (let i = 0; i <= n; i++) items.push({ title, date: add(from, i), allDay: true, start: '', end: '', cat, place: '', memo: n ? (i + 1) + '日目（' + md(from) + '〜' + md(to) + '）' : '', repeat: 'none', repeatUntil: '', notes: [] });
          else { items.push({ title: title + '（〜' + md(to) + '）', date: from, allDay: true, start: '', end: '', cat, place: '', memo: '', repeat: 'none', repeatUntil: '', notes: [] }); items.push({ title: title + '（おわり）', date: to, allDay: true, start: '', end: '', cat, place: '', memo: '', repeat: 'none', repeatUntil: '', notes: [] }); }
          continue;
        }
      }
      m = reOne.exec(line);
      let dateStr = null, rest = '';
      if (m) { const d = mk(m[1], m[2], m[3]); if (d) { dateStr = d; rest = m[4]; } }
      if (!dateStr && (m = reCols.exec(line))) { const d = mk(null, m[1], m[2]); if (d) { dateStr = d; rest = m[3]; } }
      if (!dateStr) {
        const q = parseQuick(withSchoolYear(line, year));
        if (q.dateGiven && !q.bad && q.title) items.push(Object.assign(q, { place: '', memo: '', repeat: 'none', repeatUntil: '', notes: [] }));
        else skipped.push(line);
        continue;
      }
      const q = parseQuick(dateStr.replace(/-/g, '/') + ' ' + rest);
      if (!q.title) { skipped.push(line); continue; }
      items.push({ title: q.title, date: dateStr, allDay: q.allDay, start: q.start, end: q.end, cat: q.cat, place: '', memo: '', repeat: 'none', repeatUntil: '', notes: [] });
    }
    return { items, skipped };
  }

  /* ───────── 取り込みの確かめ（.ics・共有・まとめて追加で同じ画面） ───────── */
  async function previewImport(found, o = {}) {

        h('td', { class: 'nowrap num' }, md(x.ev.date), h('br'), x.ev.allDay ? '終日' : x.ev.start + (x.ev.end ? '〜' + x.ev.end : '')),
        h('td', null, h('label', { for: 'cal-imp-' + i, style: { color: 'var(--ink)', fontWeight: 700 } }, x.ev.title), x.ev.place ? h('div', { class: 'small muted' }, x.ev.place) : null,
          h('div', null,
            x.ev.repeat && x.ev.repeat !== 'none' ? h('span', { class: 'chip' }, x.ev.repeat === 'weekly' ? '毎週' : x.ev.repeat === 'monthly' ? '毎月' : 'くり返し') : null,
            x.dup ? h('span', { class: 'chip warn' }, 'もう入っています') : null,
            x.past ? h('span', { class: 'chip' }, '過去の予定') : null,

        h('td', null, cat)));
    });
    const pastCb = h('input', { type: 'checkbox', id: 'cal-imp-past', onchange: () => { for (const x of rows) if (x.past && !x.dup) { x.on = pastCb.checked; x.cb.checked = x.on; } count(); } });
    const body = h('div', { class: 'stack' },
      h('p', null, o.intro || found.length + '件の予定が見つかりました。読み込む予定にチェックを入れてください。'),
      cut ? h('p', { class: 'small', style: { color: 'var(--warn)' } }, '多すぎるので、新しい順に1000件までにしました。') : null,
      pastN ? h('label', { class: 'check', for: 'cal-imp-past' }, pastCb, '過去の予定（' + pastN + '件）もふくめる') : null,
      h('div', { class: 'tbl-wrap cal-imp' }, h('table', { class: 'tbl' }, h('thead', null, h('tr', null, h('th', null, ''), h('th', null, '日時'), h('th', null, '予定'), h('th', null, '種類'))), tbody)));

      title: o.title || '予定を読み込む', wide: true, body,
      actions: [{ label: 'やめる', kind: 'ghost' }, {
        label, kind: 'primary', onClick: async () => {

    });

  }

  // 共有された予定を受け取る（#share=… のリンク・共有ファイル）

        const from = range_ === 'future' ? t : (ds[0] && ds[0] < t ? ds[0] : t);
        const far = add(t, 365), to = ds.length && ds[ds.length - 1] > far ? ds[ds.length - 1] : far;
        let list = expand
          ? occurrences(S.events, from, to).map((o) => Object.assign({}, o, { date: o.occ, uid: o.id + '-' + d8(o.occ) }))
          : S.events.filter((e) => isYmd(e.date) && (range_ !== 'future' || (e.repeat === 'weekly' || e.repeat === 'monthly' ? !e.repeatUntil || e.repeatUntil >= t : e.date >= t)));

            Kit.field({ label: 'くり返し', input: f.repeat, hint: '終わりにすると、次の日付に進みます（平日は土日・祝日をとばします）。' }),
            Kit.field({ label: 'メモ', input: f.memo })),

.nl-be{display:grid;gap:8px}
.nl-be-h{display:flex;align-items:center;gap:6px}
.nl-be-h .sp{flex:1}
.nl-be-ic{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--gosu-wash);color:var(--gosu)}
.nl-be-ic svg{width:16px;height:16px}
.nl-be textarea{resize:vertical}
.nl-rows{display:grid;gap:6px}
.nl-row{display:grid;grid-template-columns:150px minmax(0,1.3fr) minmax(0,1fr) auto;gap:6px;align-items:start}
.nl-row textarea{min-height:38px;padding:6px 8px;resize:none;overflow:hidden}
.nl-row input[type=date]{min-height:38px}
.nl-row-h{font-size:12px;color:var(--ink-3);font-weight:700}
@media (max-width:640px){.nl-row{grid-template-columns:minmax(0,1fr) auto}.nl-row>textarea{grid-column:1/-1}.nl-row>.btn{grid-row:1;grid-column:2}.nl-row-h{display:none}}
.nl-add{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;border:1px dashed var(--line-strong);border-radius:var(--r)}
.nl-img-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.nl-thumb{width:140px;min-height:90px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;background:var(--surface-2)}
.nl-thumb img{display:block;width:100%;height:auto}
.nl-kata{display:grid;gap:8px}
.nl-kata-it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.nl-kata-it:has(input:checked){border-color:var(--gosu);background:var(--gosu-wash)}
.nl-kata-it input{margin-top:4px}
.nl-cats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.nl-pv{position:relative;overflow:hidden;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.nl-sheet{position:absolute;top:0;left:0;transform-origin:0 0;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.18);box-sizing:border-box}
.nl-end{position:absolute;left:0;right:0;border-top:3px dashed #c0392b;pointer-events:none}
.nl-end span{position:absolute;right:6mm;top:1mm;background:#c0392b;color:#fff;font-size:9pt;padding:.5mm 2mm;border-radius:2mm}
.nl-status{margin:8px 0}
.nl-status.bad{color:var(--bad)}
/* 紙面（画面の見た目と印刷で同じ） */
.nl-page{color:#000;background:#fff;font-size:10.5pt;line-height:1.6;text-align:left;line-break:strict;overflow-wrap:anywhere}
.nl-page *{box-sizing:border-box}
.nl-mast{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2mm 6mm;align-items:end;margin-bottom:4mm}
.nl-name{font-size:28pt;font-weight:700;line-height:1.15;letter-spacing:.06em}
.nl-catch{font-size:10pt;margin-top:1mm}
.nl-mast-r{text-align:right;font-size:9.5pt;line-height:1.45}
.nl-no{font-size:12pt;font-weight:700}
.nl-page.k-line .nl-mast{padding-bottom:2mm;border-bottom:3pt double #000}
.nl-page.k-bar .nl-mast{padding:3mm 4mm;border:1.6pt solid #000}
.nl-page.k-round .nl-mast{padding:3mm 5mm;border:1.2pt solid #000;border-radius:6mm}
.nl-body.c2{columns:2;column-gap:7mm;column-rule:.5pt solid #888}
.nl-blk{margin:0 0 4mm}
.nl-h{font-size:12.5pt;font-weight:700;line-height:1.35;margin:0 0 1.5mm;break-after:avoid}
.k-line .nl-h{border-bottom:1pt solid #000;padding-bottom:.6mm}
.k-bar .nl-h{border-left:2.4mm solid #000;padding-left:2mm}
.k-round .nl-h{display:inline-block;border:1pt solid #000;border-radius:99px;padding:.2mm 3.5mm}
.nl-txt p{margin:0}

.nl-boxed{border:1pt solid #000;padding:2.5mm 3.5mm;break-inside:avoid}

.nl-boxed .nl-h{border:0;padding:0;display:block}
.nl-ul{margin:0;padding:0;list-style:none}
.nl-ul li{padding-left:1em;text-indent:-1em}
.nl-ul li::before{content:'・'}
.nl-tbl{width:100%;border-collapse:collapse;font-size:9.5pt;line-height:1.4;break-inside:avoid}
.nl-tbl th,.nl-tbl td{border:.6pt solid #000;padding:1mm 1.5mm;vertical-align:middle;white-space:pre-line}
.nl-tbl th{background:#e8e8e8;font-weight:700;text-align:center;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.nl-fig{text-align:center;break-inside:avoid}
.nl-fig img{display:block;margin:0 auto;max-width:100%;height:auto}
.nl-fig figcaption{font-size:9pt;margin-top:1mm}
.nl-fig.ph{border:1pt dashed #999;padding:8mm 2mm;color:#888;font-size:9pt}

  // 紙面をつくる（画面の見た目と印刷で同じものを使う）
  function blockEl(b, imgs, o) {
    const head = b.head ? h('h2', { class: 'nl-h' }, b.head) : null;
    if (b.type === 'text' || b.type === 'box') {
      if (o.print && !b.head && !String(b.body || '').trim()) return null;
      return h('section', { class: 'nl-blk' + (b.type === 'box' ? ' nl-boxed' : '') }, head, h('div', { class: 'nl-txt' }, lines(String(b.body || '').replace(/\s+$/, '')).map((t) => (t.trim() ? h('p', null, t) : h('p', { class: 'gap' })))));
    }
    if (b.type === 'list') return h('section', { class: 'nl-blk' }, head, h('ul', { class: 'nl-ul' }, items(b.body).map((t) => h('li', null, t))));
    if (b.type === 'schedule') {
      return h('section', { class: 'nl-blk' }, head, h('table', { class: 'nl-tbl' },
        h('thead', null, h('tr', null, h('th', { style: { width: '18%' } }, '日'), h('th', null, '予定'), h('th', { style: { width: '34%' } }, b.col3 || '持ち物・連絡'))),
        h('tbody', null, (b.rows || []).map((r) => h('tr', null, h('td', { class: 'd' }, r.date ? md(r.date) : ''), h('td', null, r.text || ''), h('td', null, r.note || ''))))));
    }
    if (b.type === 'image') {
      const src = b.src ? imgs.get(b.src) : '';
      if (!src && o.print) return null;
      return h('figure', { class: 'nl-blk nl-fig' + (src ? '' : ' ph') }, src ? h('img', { src, alt: b.caption || '', style: { width: (SIZES[b.size] || SIZES.half) * 100 + '%' } }) : '写真・イラスト（選ぶと、ここに入ります）', b.caption ? h('figcaption', null, b.caption) : null);
    }
    return null;
  }
  function pageEl(x, imgs, o = {}) {
    const page = h('div', { class: 'nl-page k-' + x.look, style: { fontFamily: FONTS[x.font].css } });
    page.append(h('header', { class: 'nl-mast' },
      h('div', null, h('div', { class: 'nl-name' }, x.name || '　'), x.catch ? h('div', { class: 'nl-catch' }, x.catch) : null),
      h('div', { class: 'nl-mast-r' }, h('div', { class: 'nl-no' }, '第' + x.no + '号'), h('div', null, dateText(x)), x.school ? h('div', null, x.school) : null, x.from ? h('div', null, x.from) : null)));
    page.append(h('div', { class: 'nl-body' + (x.cols === 2 ? ' c2' : '') }, x.blocks.map((b) => blockEl(b, imgs, o))));
    return page;
  }

  // 連絡アプリ・メールに貼る文
  function plainText(x) {
    const out = ['【' + x.name + '　第' + x.no + '号】' + dateText(x)];
    const who = [x.school, x.from].filter(Boolean).join('　');
    if (who) out.push(who);
    for (const b of x.blocks) {
      const part = [];
      if (b.head) part.push('■' + b.head);
      if (b.type === 'text' || b.type === 'box') part.push(String(b.body || '').trim());
      if (b.type === 'list') part.push(...items(b.body).map((t) => '・' + t));
      if (b.type === 'schedule') part.push(...(b.rows || []).filter((r) => r.text || r.note).map((r) => (r.date ? md(r.date) + '　' : '') + String(r.text || '').replace(/\n/g, '／') + (r.note ? '（' + (b.col3 || '持ち物・連絡') + '：' + String(r.note).replace(/\n/g, '／') + '）' : '')));
      if (b.type === 'image' && b.caption) part.push('（写真：' + b.caption + '）');
      const t = part.filter(Boolean).join('\n');
      if (t) out.push('', t);
    }
    return out.join('\n');
  }

  // Word（.docx）の中身
  async function imgBytes(ref) {
    const url = await Kit.img.resolve(ref);
    if (!url) return null;
    const im = await new Promise((res) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = url; });
    if (!im) return null;

    if (!x) { // webp・svg などは png に描き直す（Word は webp を読めない）
      const c = h('canvas', { width: im.naturalWidth || 800, height: im.naturalHeight || 600 }), g = c.getContext('2d');
      g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
      x = window.Docx.fromDataUrl(c.toDataURL('image/png'));
    }
    return x && Object.assign(x, { ratio: (im.naturalHeight || 3) / (im.naturalWidth || 4) });
  }
  async function docxOf(x) {
    const P = PAPERS[x.paper], F = FONTS[x.font], look = x.look;
    const hb = look === 'line' ? { bottom: 'single' } : look === 'bar' ? { left: 'thick' } : { top: 'single', bottom: 'single', left: 'single', right: 'single' };
    const heading = (t) => ({ p: t, b: true, size: 12.5, keep: true, before: 4, after: 2, border: hb });
    const txt = (s) => lines(String(s || '').replace(/\s+$/, '')).map((t) => ({ p: t, line: 1.3 }));
    const gap = { p: '', line: 0.6 };
    const right = (p, o) => Object.assign({ p, size: 9.5, align: 'right', line: 1.15 }, o);
    const head = [
      { table: [[{ blocks: [{ p: x.name || '', b: true, size: 26, line: 1.05 }].concat(x.catch ? [{ p: x.catch, size: 10, before: 2 }] : []), valign: 'bottom' },
        { blocks: [right('第' + x.no + '号', { b: true, size: 12 }), right(dateText(x))].concat(x.school ? [right(x.school)] : [], x.from ? [right(x.from)] : []), valign: 'bottom' }]],
      widths: [0.6, 0.4], border: look === 'line' ? 'none' : 'box', thick: look === 'bar', pad: look === 'line' ? 0.3 : 2.5, noGap: look === 'line' },
      look === 'line' ? { p: '', border: { bottom: 'double' }, after: 6, line: 0.3 } : { p: '', line: 0.5 },
    ];
    const body = [];
    for (const b of x.blocks) {
      if (b.type === 'text') { if (!b.head && !String(b.body || '').trim()) continue; if (b.head) body.push(heading(b.head)); body.push(...txt(b.body), gap); }
      else if (b.type === 'box') body.push({ table: [[{ blocks: (b.head ? [{ p: b.head, b: true, size: 11.5, after: 1 }] : []).concat(txt(b.body)) }]], border: 'box', thick: look === 'bar', pad: 2.2 });
      else if (b.type === 'list') { if (b.head) body.push(heading(b.head)); body.push(...items(b.body).map((t) => ({ p: '・' + t, hanging: 3.7, line: 1.3 })), gap); }
      else if (b.type === 'schedule') {
        if (b.head) body.push(heading(b.head));
        body.push({ table: [['日', '予定', b.col3 || '持ち物・連絡'].map((t) => ({ p: t, size: 9.5 }))].concat((b.rows || []).map((r) => [{ p: r.date ? md(r.date) : '', align: 'center', size: 9.5 }, { p: r.text || '', size: 9.5 }, { p: r.note || '', size: 9.5 }])), widths: [0.21, 0.45, 0.34], header: true, pad: 0.8 });
      } else if (b.type === 'image' && b.src) {
        const im = await imgBytes(b.src);
        if (im) { body.push({ img: im.bytes, type: im.type, frac: SIZES[b.size] || SIZES.half, ratio: im.ratio, align: 'center' }); if (b.caption) body.push({ p: b.caption, align: 'center', size: 9, after: 4 }); }
      }
    }
    return { title: x.name + ' 第' + x.no + '号', author: x.from, page: { w: P.w, h: P.h, margin: MARGIN, cols: x.cols, gap: GAP, sep: true }, font: F.word, latin: F.latin, size: 10.5, head, body };
  }

        if (!from || !to || to < from || !window.SenseiCalendar) return [];
        const occ = window.SenseiCalendar.occurrences(events, from, to).filter((e) => cats.has(e.cat || 'class'));
        const t0 = (e) => (e.allDay || !e.start ? '' : e.start);
        const rows = [];
        for (let d = from, g = 0; d <= to && g < 93; d = addDays(d, 1), g++) {
          const evs = occ.filter((e) => e.occ === d).sort((a, b) => t0(a).localeCompare(t0(b)));
          const hol = School.holiday(d);
          const hws = withHw && S.cls ? homework.filter((x) => x.classId === S.cls.id && !x.closed && x.due === d) : [];
          if ((isWeekend(d) || hol) && !evs.length && !hws.length) continue; // 土日・祝日は、予定があるときだけ
          rows.push({
            date: d,
            text: [hol ? '（' + hol + '）' : ''].concat(evs.map((e) => e.title + (t0(e) ? '（' + t0(e) + '〜）' : ''))).filter(Boolean).join('\n'),

     before … 説明を出す前に、見せたい場所を準備する（タブを開く・下までスクロール、など）。指は出さない

        h('button', { type: 'button', class: 'tour-btn ghost', onclick: () => Kit.demo.start(id) }, Kit.icon('refresh', 14), 'もう一度'),
        h('span', { class: 'grow' }),
        h('button', { type: 'button', class: 'tour-btn', onclick: () => stopTour({ keep: true }) }, '自由にさわる'),
        h('button', { type: 'button', class: 'tour-btn primary', onclick: () => Kit.demo.end() }, 'デモを終わる'))]);
    place();
    try { card.querySelector('.tour-btn.primary').focus({ preventScroll: true }); } catch (e) { /* noop */ }
  }

  // 囲みの中を利用者が自分で押したとき：click の手順なら、そのまま次へ
  function onUserClick(e) {
    if (!T || T.busy || !T.el || !e.isTrusted) return;
    const step = T.steps[T.i];
    if (!step || !step.click) return;
    if (T.el === e.target || T.el.contains(e.target)) { T.busy = true; setTimeout(() => { if (T) { T.busy = false; next({ done: true }); } }, 0); }
  }
  function onKey(e) {
    if (!T) return;
    if (e.key === 'Escape' && !Kit.modalOpen()) { e.preventDefault(); stopTour({ keep: true }); }
    else if (e.key === 'ArrowRight' && !T.busy && !/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' && !T.busy && !/INPUT|TEXTAREA|SELECT/.test((e.target && e.target.tagName) || '')) { e.preventDefault(); prev(); }
  }
  const onResize = () => { if (T) T.lastKey = ''; };

  function run(id) {
    stopTour({ keep: true });
    const steps = tours.get(id);
    if (!steps || !steps.length) return;
    T = { id, steps, i: 0, auto: false, el: null, seq: 0, busy: false, timer: 0, raf: 0, lastKey: '', ui: buildLayer() };
    document.documentElement.classList.add('is-touring');
    document.addEventListener('click', onUserClick, true);
    document.addEventListener('keydown', onKey, true);
    window.addEventListener('resize', onResize);
    T.raf = requestAnimationFrame(loop);
    show(0);
  }
  function stopTour() {
    if (!T) return;
    clearTimeout(T.timer); cancelAnimationFrame(T.raf);
    T.seq++;
    T.ui.layer.remove();
    T = null;
    document.documentElement.classList.remove('is-touring');
    document.removeEventListener('click', onUserClick, true);
    document.removeEventListener('keydown', onKey, true);
    window.removeEventListener('resize', onResize);
  }

  /* ── 指で動かす（手順の do から使う） ── */
  async function moveFinger(el) {
    if (!T || !el) return;
    el.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'auto' });
    await sleep(80);
    const r = el.getBoundingClientRect();
    const f = T.ui.finger;
    const x = r.left + r.width / 2, y = r.top + r.height / 2;
    if (reduced() || speed() < 0.5) { f.style.transition = 'none'; f.style.transform = `translate(${x}px, ${y}px)`; f.classList.add('on'); await sleep(60); }
    else {
      if (!f.classList.contains('on')) {
        const c = T.ui.card.getBoundingClientRect();
        f.style.transition = 'none'; f.style.transform = `translate(${c.left + c.width / 2}px, ${c.top + 20}px)`;
        void f.offsetWidth; f.classList.add('on');
      }
      f.style.transition = '';
      f.style.transform = `translate(${x}px, ${y}px)`;
      await sleep(520);
    }
    T.el = el; T.lastKey = '';
    { const y0 = el.getBoundingClientRect().top; keepVisible(el); if (el.getBoundingClientRect().top !== y0) { await sleep(60); const r2 = el.getBoundingClientRect(); f.style.transform = `translate(${r2.left + r2.width / 2}px, ${r2.top + r2.height / 2}px)`; } }
    f.classList.remove('tap'); void f.offsetWidth; f.classList.add('tap');
    await sleep(140);
  }
  const hideFinger = () => { if (T) T.ui.finger.classList.remove('on', 'tap'); };
  const api = {
    q: (sel, scope) => q(sel, scope)(),
    btn: (t, scope) => btn(t, scope)(),
    find: (target, ms) => resolve(target, ms),
    wait: (ms) => sleep(ms),
    async click(target) {
      const el = await resolve(target, 2500);
      if (!el) throw new Error('押す所が見つかりません');
      await moveFinger(el);
      el.click();
      await sleep(120);
      hideFinger();
      return el;
    },
    async type(target, value, o = {}) {
      const el = await resolve(target, 2500);
      if (!el) throw new Error('入力欄が見つかりません');
      await moveFinger(el);
      hideFinger();
      el.focus({ preventScroll: true });
      if (!o.append) { el.value = ''; el.dispatchEvent(new Event('input', { bubbles: true })); }
      const per = reduced() || speed() < 0.5 ? 0 : Math.max(18, Math.min(60, 900 / String(value).length));
      if (!per) { el.value = (o.append ? el.value : '') + value; el.dispatchEvent(new Event('input', { bubbles: true })); }
      else for (const ch of String(value)) { el.value += ch; el.dispatchEvent(new Event('input', { bubbles: true })); await new Promise((r) => setTimeout(r, per)); }
      el.dispatchEvent(new Event('change', { bubbles: true }));
      if (o.enter) el.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      el.blur();
      return el;
    },
    async pick(target, value) {
      const el = await resolve(target, 2500);
      if (!el) throw new Error('選ぶ所が見つかりません');
      await moveFinger(el);
      hideFinger();
      el.value = value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
      el.dispatchEvent(new Event('change', { bubbles: true }));
      return el;
    },
    async check(target, on = true) {
      const el = await resolve(target, 2500);
      if (!el) throw new Error('チェックの所が見つかりません');
      if (!!el.checked !== !!on) { await moveFinger(el); el.click(); hideFinger(); }
      return el;
    },
    // 見せたい所まで、画面をゆっくり送る（指は出さない）
    async scrollTo(target) {
      const el = await resolve(target, 2500);
      if (el) { el.scrollIntoView({ block: 'center', behavior: reduced() ? 'auto' : 'smooth' }); await sleep(380); }
      return el;
    },
    closeModals() { Kit.closeModals(); },
  };

  /* ── 入口 ── */
  Kit.demo = {
    speed: 1,
    has: (id) => tours.has(id) && tours.get(id).length > 0,
    on: () => !!Kit.store.demo,
    // いま動いているデモ（テストからも読む）。ready … 説明を出し終えた / found … 囲む所が見つかった / done … 最後まで来た
    running: () => (T ? { id: T.id, i: T.i, n: T.steps.length, title: (T.steps[T.i] || {}).title, ready: !!T.ready, found: !!T.found, busy: !!T.busy, done: !!T.done } : null),
    btn, q, text, modal, modalBtn, api,
    // デモを始める：砂場に切りかえて、その道具を開き直し、手順を出す
    async start(id) {
      if (!tours.has(id)) return;
      stopTour();
      if (!Kit.store.demo) {
        Kit.closeModals();
        Kit.pref.demo = new Map();
        await Kit.store.sandbox(true);
        document.documentElement.classList.add('is-demo');
        showRibbon();
      } else Kit.closeModals();
      if (Kit.current() !== id) {
        Kit.go(id);
        for (let k = 0; k < 60 && Kit.current() !== id; k++) await new Promise((r) => setTimeout(r, 30));
      } else Kit.remount();
      await Kit.mounted();
      window.scrollTo(0, 0);
      run(id);
    },
    // デモを終えて、本物のデータに戻る
    async end() {
      stopTour();
      Kit.closeModals();
      if (Kit.store.demo) await Kit.store.sandbox(false);
      Kit.pref.demo = null;
      document.documentElement.classList.remove('is-demo');
      if (ribbon) { ribbon.remove(); ribbon = null; }
      await Kit.remount();
      Kit.toast('デモを終えました。あなたのデータに戻っています');
    },
    stopTour,
  };
})();

  const D = Kit.demo;

  const ensure = (t) => async (d) => { if (!isOpen(t)) { await toList(); const it = await d.find(D.text('.tp-it', t), 1500); if (it) it.click(); } room(); };
  const MOTI = '持ち物のお願い';
  Kit.tour('templates', [
    { before: toList, el: D.btn('保護者へ', '.tp-groups'), title: '相手でしぼる', text: 'ひな形は、保護者・生徒・先生あてに分かれています。「保護者へ」でしぼってみます。', click: true, after: 500 },
    { before: toList, el: D.text('.tp-it', MOTI), title: 'ひな形を選ぶ', text: '使いたいひな形を押します。例として「持ち物のお願い」を開きます。', click: true, after: 700 },
    { before: ensure(MOTI), el: '.tp-auto', title: '自動で入るもの', text: 'クラスと先生の名前は、名簿と学校の設定から自動で入ります。入れるのは、残りの空欄だけです。' },
    {
      before: ensure(MOTI), el: '.tp-fields', title: '空欄を入れる', text: '行事名・日付・持ち物を入れます。行事は「カレンダーの予定から入れる」で選ぶこともできます。', doLabel: '入れてみる',
      do: async (d) => {
        await d.type('#tp-v-行事名', '校外学習');
        await d.type('#tp-v-日付', '11月6日（金）');
        await d.type('#tp-v-持ち物', '弁当・水筒\n雨具\nしおり');
      },
      after: 600,
    },
    { before: ensure(MOTI), el: 'textarea[aria-label="できあがりの文"]', title: 'できた文を見る', text: '入れたそばから、文ができあがります。この欄で、直接直すこともできます。' },
    { before: ensure(MOTI), el: '.tp-out .btn-row', title: 'コピー・メールで送る', text: '「コピー」で連絡アプリや Classroom に貼れます。「メールで開く」で、メールの下書きになります。' },
    { before: toList, el: D.text('.tp-it', '〈行事名〉のお知らせ'), title: '文書のひな形', text: '紙で配る「お知らせ」も同じように使えます。入れた行事名は、そのまま引きつぎます。', click: true, after: 700 },
    { before: ensure('〈行事名〉のお知らせ'), el: '.tp-out .btn-row', title: '印刷・Word に', text: '文書は紙の形で見えます。「印刷」でそのまま配れます。「Word に書き出す」で学校の様式にも写せます。' },
  ]);
})();

/* ---- js/start.js ---- */
// 起動（すべてのアプリを読みこんだあとで）
Kit.start();

</script>
