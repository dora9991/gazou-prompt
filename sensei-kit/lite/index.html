<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="description" content="席替え・チラシ・画像生成プロンプトの3つだけの、先生の道具箱の簡易版。データはこのブラウザの中だけに保存します。">
<meta name="theme-color" content="#24473b">
<title>先生の道具箱 簡易版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='8' width='56' height='40' rx='4' fill='%23a07b4f'/%3E%3Crect x='9' y='13' width='46' height='30' rx='2' fill='%2324473b'/%3E%3Cpath d='M17 34c5-9 9-12 14-6s9 3 14-8' stroke='%23f6f3ea' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3Crect x='38' y='51' width='14' height='5' rx='2.5' fill='%23f3cf4a'/%3E%3C/svg%3E">
<script>
// 簡易版は、利用者が表示を選ぶまで「明るい」（端末が暗い表示でも、最初から暗くしない）。表示の切りかえは js/kit.js の Kit.theme
try { if (!localStorage.getItem('sensei:theme')) document.documentElement.dataset.theme = 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../css/kit.css">
</head>
<body>
<div id="kit"></div>
<!-- 簡易版：席替え・チラシ・画像生成プロンプトだけ（名簿は席替えに使うので付き物）。全部の道具は ../index.html。
     部品は ../ の同じ物を読む。順番が大事：kit.js → school.js → 解く部品 → アプリ。最後に Kit.start()。
     アカウント保存（cloud.js）は読まない（簡易版はこのブラウザだけに保存） -->
<script src="../config.js"></script>
<script>
// 簡易版の設定：見出しの文字・出す道具・記録に「簡易版」と付ける
window.SENSEI_CONFIG = Object.assign(window.SENSEI_CONFIG || {}, { lite: true, cloud: false, theme: 'light', only: ['image-prompt'], brand: { sub: '簡易版', top: '先生の道具箱 簡易版' } });
</script>
<script src="../vendor/qrcode.js"></script>
<script src="../js/kit.js"></script>
<script src="../js/usage.js"></script>
<script src="../js/core/school.js"></script>
<script src="../js/core/seat-solver.js"></script>
<script src="../js/core/flyer-templates.js"></script>
<script src="../js/apps/home-lite.js"></script>
<script src="../js/apps/roster.js"></script>
<script src="../js/apps/seats.js"></script>
<script src="../js/apps/flyer.js"></script>
<script src="../js/apps/embeds.js"></script>
<!-- 使い方のデモ（土台と、道具ごとの手順） -->
<script src="../js/demo.js"></script>
<script src="../js/tours/roster.js"></script>
<script src="../js/tours/seats.js"></script>
<script src="../js/tours/flyer.js"></script>
<script src="../js/start.js"></script>
</body>
</html>
